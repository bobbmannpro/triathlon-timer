                        </div>
                        <div style={{ flex: 1, minWidth: 0 }}>
                        <div style={{ display: "flex", alignItems: "center", gap: 8, marginBottom: 6 }}>
                          {wp.fixed
                            ? <div style={{ fontSize: 13, fontWeight: 700, color: "#4ade80", flex: 1 }}>{wp.label}</div>
                            : <input value={wp.label} onChange={e => setWaypoints(pws => pws.map(w => w.id === wp.id ? { ...w, label: e.target.value } : w))}
                                style={{ flex: 1, background: "transparent", border: "none", borderBottom: "1px solid rgba(74,222,128,0.3)", color: "#4ade80", fontSize: 13, fontWeight: 700, outline: "none", padding: "0 0 2px 0" }} />
                          }
                          <select
                            value={wp.action === "start" ? "start" : wp.action === "marker" ? "marker" : `seg_${wp.segIdx}`}
                            onChange={e => {
                              const v = e.target.value;
                              setWaypoints(pws => pws.map(w => w.id !== wp.id ? w :
                                v === "start"  ? { ...w, action: "start",  segIdx: undefined } :
                                v === "marker" ? { ...w, action: "marker", segIdx: undefined } :
                                                 { ...w, action: "split",  segIdx: parseInt(v.replace("seg_","")) }
                              ));
                            }}
                            style={{ background: "#0c2240", border: "1px solid rgba(0,174,239,0.25)", borderRadius: 4, padding: "2px 6px", fontSize: 11, color: "#e8f4fb", outline: "none", cursor: "pointer", flexShrink: 0 }}>
                            <option value="start">Starts clock</option>
                            <option value="marker">Map only</option>
                            {SEGMENTS.map((seg, si) => <option key={si} value={`seg_${si}`}>Logs {seg}</option>)}
                          </select>
                          <button onClick={() => setWaypoints(pws => pws.map(w => w.id === wp.id ? { ...w, enabled: !w.enabled } : w))}
                            title={wp.enabled !== false ? "GPS auto-trigger ON — click to disable" : "GPS auto-trigger OFF — click to enable"}
                            style={{ background: wp.enabled !== false ? "rgba(74,222,128,0.15)" : "rgba(248,113,113,0.1)", border: `1px solid ${wp.enabled !== false ? "rgba(74,222,128,0.4)" : "rgba(248,113,113,0.3)"}`, borderRadius: 4, padding: "2px 7px", fontSize: 9, color: wp.enabled !== false ? "#4ade80" : "#f87171", cursor: "pointer", letterSpacing: 1, flexShrink: 0 }}>
                            {wp.enabled !== false ? "GPS ON" : "GPS OFF"}
                          </button>
                          {!wp.fixed && <button onClick={() => setWaypoints(wps => wps.filter(w => w.id !== wp.id))} style={{ background: "none", border: "none", color: "#5a86a8", fontSize: 16, cursor: "pointer", lineHeight: 1, padding: "0 2px" }}>&times;</button>}
                        </div>
                        <div style={{ display: "flex", gap: 6, flexWrap: "wrap", alignItems: "center" }}>
                          <button onClick={() => { const id = activePlacementId === wp.id ? null : wp.id; activePlacementRef.current = id; setActivePlacementId(id); }}
                            style={{ ...btnStyle(activePlacementId === wp.id ? "#ffd166" : "#4ade80", activePlacementId !== wp.id), padding: "5px 10px", fontSize: 11 }}>
                            {activePlacementId === wp.id ? "✕ Cancel" : "🗺 Pick on Map"}
                          </button>
                          <button onClick={() => dropWaypointHere(wi)} style={{ ...btnStyle("#4ade80", true), padding: "5px 10px", fontSize: 11 }}>
                            📍 My Location
                          </button>
                          <div style={{ display: "flex", alignItems: "center", gap: 4 }}>
                            <span style={{ fontSize: 10, color: "#5a86a8" }}>±</span>
                            <input type="number" min="5" max="500" value={wp.radiusM}
                              onChange={e => setWaypoints(wps => wps.map((w, i) => i === wi ? { ...w, radiusM: +e.target.value } : w))}
                              style={{ width: 52, background: "#0c2240", border: "1px solid rgba(74,222,128,0.2)", borderRadius: 4, padding: "5px 6px", color: "#e8f4fb", fontSize: 11, outline: "none", textAlign: "center" }} />
                            <span style={{ fontSize: 10, color: "#5a86a8" }}>m</span>
                          </div>
                          {wp.lat != null
                            ? <div style={{ fontSize: 10, color: "#4ade80" }}>✓ {wp.lat.toFixed(4)}, {wp.lng.toFixed(4)}</div>
                            : <div style={{ fontSize: 10, color: "#5a86a8" }}>Not placed</div>}
                          {wp.lat != null && <button onClick={() => setWaypoints(wps => wps.map((w, i) => i === wi ? { ...w, lat: null, lng: null } : w))} style={{ background: "none", border: "none", color: "#5a86a8", fontSize: 13, cursor: "pointer" }}>&times;</button>}
                        </div>
                        </div>
                      </div>
                    ); })}

                    <button onClick={() => setWaypoints(wps => [...wps, { id: `cp_${Date.now()}`, label: "Checkpoint", lat: null, lng: null, radiusM: 30, action: "marker", fixed: false }])}
                      style={{ ...btnStyle("#5a86a8", true), width: "100%", padding: "8px", fontSize: 12, marginTop: 4 }}>
                      + Add Checkpoint
                    </button>
                    </div>{/* end cards section */}
                  </div>{/* end GPS Waypoints card */}

                  {/* ── Saved Races ── */}
                  <div style={{ marginTop: 20, background: "#0c2240", border: "1px solid rgba(0,174,239,0.2)", borderRadius: 8, padding: "14px 16px" }}>
                    <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", color: "#5a86a8", marginBottom: 12 }}>
                      Saved Race Presets
                    </div>

                    {/* Save current setup */}
                    <div style={{ display: "flex", flexDirection: "column", gap: 8, marginBottom: savedRaces.length > 0 ? 14 : 0 }}>
                      <input
                        value={saveRaceName}
                        onChange={e => setSaveRaceName(e.target.value)}
                        onKeyDown={e => e.key === "Enter" && saveRace()}
                        placeholder="Race name (e.g. Spring 2026)"
                        style={{ width: "100%", background: "#071829", border: "1px solid rgba(0,174,239,0.3)", borderRadius: 4, padding: "10px 12px", color: "#e8f4fb", fontSize: 13, outline: "none" }}
                      />
                      <div style={{ display: "flex", gap: 8 }}>
                        <button onClick={saveRace} style={{ ...btnStyle("#4ade80"), flex: 1, padding: "10px", fontSize: 13 }}>
                          Save Setup
                        </button>
                        {loadedRaceId && (
                          <button onClick={updateSavedRace} style={{ ...btnStyle("#ffd166"), flex: 1, padding: "10px", fontSize: 13 }}>
                            Update Race
                          </button>
                        )}
                      </div>
                    </div>

                    {/* Saved race list */}
                    {savedRaces.length > 0 && (
                      <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
                        {savedRaces.map(race => (
                          <div key={race.id} style={{ background: "#071829", border: "1px solid rgba(255,255,255,0.07)", borderRadius: 6, padding: "10px 12px", display: "flex", alignItems: "center", justifyContent: "space-between", gap: 10, flexWrap: "wrap" }}>
                            <div style={{ flex: 1, minWidth: 0 }}>
                              <div style={{ fontWeight: 700, fontSize: 13, color: "#e8f4fb", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{race.name}</div>
                              <div style={{ fontSize: 11, color: "#3a6080", marginTop: 2 }}>
                                {race.athletes.length} athletes &nbsp;&middot;&nbsp; {(race.courses || []).map(c => c.name).join(" / ") || `${race.swimYards}y/${race.bikeMiles}mi/${race.runMiles}mi`} &nbsp;&middot;&nbsp; {race.savedAt}
                                {race.waypoints && race.waypoints.some(w => w.lat !== null) && <span style={{ color: "#4ade80", marginLeft: 6 }}>· 📍 {race.waypoints.filter(w => w.lat !== null).length} waypoints</span>}
                              </div>
                            </div>
                            <div style={{ display: "flex", gap: 6, flexShrink: 0 }}>
                              <button onClick={() => loadRace(race)} style={{ ...btnStyle("#00aeef"), padding: "5px 12px", fontSize: 11 }}>Load</button>
                              {deleteConfirm === race.id ? (
                                <>
                                  <button onClick={() => deleteRace(race.id)} style={{ ...btnStyle("#f4742b"), padding: "5px 10px", fontSize: 11 }}>Delete?</button>
                                  <button onClick={() => setDeleteConfirm(null)} style={{ ...btnStyle("#5a86a8", true), padding: "5px 10px", fontSize: 11 }}>No</button>
                                </>
                              ) : (
                                <button onClick={() => setDeleteConfirm(race.id)} style={{ background: "none", border: "none", color: "#3a6080", fontSize: 16, cursor: "pointer", padding: "0 4px" }}>&times;</button>
                              )}
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                    {savedRaces.length === 0 && (
                      <div style={{ fontSize: 12, color: "#3a6080", marginTop: 6 }}>
                        No presets saved yet — set up your athletes &amp; distances above, then save.
                      </div>
                    )}
                  </div>

                  <div style={{ marginTop: 14, background: "#0a3358", borderLeft: "3px solid #00aeef", borderRadius: 4, padding: "10px 14px", fontSize: 12, color: "#7aa8c8" }}>
                    {raceMode === "simultaneous"
                      ? <>All athletes start the moment you press <strong style={{ color: "#ffd166" }}>START RACE</strong>. Tap segments in order — <strong style={{ color: "#f4742b" }}>Run</strong> ends their race. Use <strong style={{ color: "#48cae4" }}>Edit Times</strong> to correct any mis-tap.</>
                      : <>Tap <strong style={{ color: "#48cae4" }}>Send Off</strong> per athlete at dive-in, or <strong style={{ color: "#ffd166" }}>Send Off All</strong> for a mass start. Tap segments in order — <strong style={{ color: "#f4742b" }}>Run</strong> ends their race. Use <strong style={{ color: "#48cae4" }}>Edit Times</strong> to correct any mis-tap.</>
                    }
                  </div>
                </div>
              )}

              {/* ── RACE ── */}
              {view === "race" && (
                <div>
                  {!clockStarted && (
                    <div style={{ background: "linear-gradient(135deg,#0a3358,#0d3a6e)", border: `2px solid ${raceMode === "simultaneous" ? "#ffd166" : "#00aeef"}`, borderRadius: 8, padding: "20px", marginBottom: 16, textAlign: "center" }}>
                      <div style={{ fontFamily: "'Bebas Neue'", fontSize: 22, letterSpacing: 3, color: "#e8f4fb", marginBottom: 4 }}>Ready to Race?</div>
                      {raceMode === "simultaneous" && (
                        <div style={{ fontSize: 11, color: "#ffd166", marginBottom: 10, letterSpacing: 1 }}>SIMULTANEOUS START — all athletes go at once</div>
                      )}
                      <button onClick={startClock} style={{ ...btnStyle(raceMode === "simultaneous" ? "#ffd166" : "#00aeef"), fontSize: 18, padding: "14px 40px", letterSpacing: 3, fontFamily: "'Bebas Neue'" }}>
                        &#9654; START RACE
                      </button>
                    </div>
                  )}

                  {clockStarted && anyUnstarted && raceMode === "separate" && (
                    <button onClick={sendOffAll} style={{ ...btnStyle("#ffd166"), width: "100%", marginBottom: 12, fontSize: 14, letterSpacing: 2 }}>
                      &#9654;&#9654; Send Off All (Simultaneous Start)
                    </button>
                  )}

                  <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", color: "#5a86a8", marginBottom: 10 }}>
                    {athletes.length} Athletes &nbsp;&mdash;&nbsp; Tap to log splits
                    <div style={{ marginTop: 10 }}>
                      {!liveRaceCode ? (
                        <div>
                          <button disabled={livePublishing} onClick={async () => {
                            setLivePublishError("");
                            setLivePublishing(true);
                            const code = registrationCode || generateRaceCode();
                            const ok = await publishLiveRace(code);
                            setLivePublishing(false);
                            if (ok === true) { setLiveRaceCode(code); }
                            else { setLivePublishError(String(ok || "Could not go live.")); }
                          }} style={{ ...btnStyle("#ffd166", true), padding: "5px 14px", fontSize: 11, letterSpacing: 1, opacity: livePublishing ? 0.6 : 1 }}>
                            {livePublishing ? "Publishing…" : "📡 Go Live"}
                          </button>
                          {livePublishError && <div style={{ fontSize: 11, color: "#f87171", marginTop: 6, maxWidth: 280, lineHeight: 1.4 }}>{livePublishError}</div>}
                        </div>
                      ) : (
                        <div style={{ display: "inline-flex", flexWrap: "wrap", alignItems: "center", gap: 8, background: "rgba(255,209,102,0.08)", border: "1px solid rgba(255,209,102,0.3)", borderRadius: 6, padding: "6px 12px" }}>
                          <span style={{ fontSize: 11, color: "#5a86a8", letterSpacing: 1 }}>LIVE</span>
                          <span style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: "#ffd166", letterSpacing: 4 }}>{liveRaceCode}</span>
                          <span style={{ fontSize: 10, color: "#5a86a8" }}>share with spectators</span>
                          <button onClick={() => { if (liveRaceUnsubRef.current) { liveRaceUnsubRef.current.ref.off("value", liveRaceUnsubRef.current.fn); liveRaceUnsubRef.current = null; } setLiveRaceCode(null); localStorage.removeItem("tri-active-live"); rtdb.ref("liveRaces/" + liveRaceCode).remove().catch(console.error); }}
                            style={{ background: "none", border: "none", color: "#3a6080", cursor: "pointer", fontSize: 16, padding: "0 2px", lineHeight: 1 }}>&times;</button>
                        </div>
                      )}
                    </div>
                  </div>

                  {athletes.map((ath, i) => {
                    const next = nextUnloggedSeg(ath);
                    const done = ath.finished;
                    const chipElapsed = ath.startOffset !== null ? clockMs - ath.startOffset : null;
                    const gt = gunTime(ath);
                    const isEditing = editTarget === i;

                    // Live elapsed time for whichever segment the athlete is currently in
                    const liveSegMs = (!done && next >= 0)
                      ? (next === 0
                          ? (ath.startOffset !== null ? clockMs - ath.startOffset : null)
                          : (ath.splits[next - 1] !== null ? clockMs - ath.splits[next - 1] : null))
                      : null;

                    return (
                      <div key={ath.id} style={{
                        background: "#0c2240", borderRadius: 8, marginBottom: 10,
                        border: `1px solid ${done ? "#4ade80" : ath.started ? "rgba(0,174,239,0.3)" : "rgba(255,255,255,0.06)"}`,
                        overflow: "hidden",
                      }}>
                        {/* Header row */}
                        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", padding: "10px 14px", borderBottom: "1px solid rgba(255,255,255,0.06)" }}>
                          <div style={{ display: "flex", alignItems: "center", gap: 10 }}>
                            <div style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: done ? "#4ade80" : "#00aeef", lineHeight: 1, minWidth: 24 }}>{i + 1}</div>
                            {ath.raceNumber != null && <span style={{ background: "rgba(232,121,249,0.12)", border: "1px solid rgba(232,121,249,0.35)", borderRadius: 4, padding: "1px 7px", fontSize: 12, fontFamily: "'Bebas Neue'", letterSpacing: 1, color: "#e879f9", flexShrink: 0 }}>#{ath.raceNumber}</span>}
                            <div>
                              <div style={{ display: "flex", alignItems: "center", gap: 7 }}>
                                <span style={{ fontWeight: 700, fontSize: 14, color: "#e8f4fb" }}>{ath.name}</span>
                                {athleteGpsStatus[i] && (
                                  <div style={{ width: 7, height: 7, borderRadius: "50%", background: "#4ade80", boxShadow: "0 0 0 0 rgba(74,222,128,0.6)", animation: "gpsping 1.4s ease-out infinite", flexShrink: 0 }} title="GPS active" />
                                )}
                                {athleteHrData[i] && (
                                  <span style={{ fontSize: 11, color: "#f4742b", fontWeight: 700 }}>❤️ {athleteHrData[i].bpm}</span>
                                )}
                                {athleteTrainerData[i] && (
                                  <span style={{ fontSize: 11, color: "#ffd166", fontWeight: 700 }}>🚲{athleteTrainerData[i].speed != null ? ` ${(athleteTrainerData[i].speed * 0.621).toFixed(1)}mph` : ""}</span>
                                )}
                                {ath.dob && calcAge(ath.dob) !== null && (
                                  <span style={{ fontSize: 11, color: "#5a86a8" }}>Age {calcAge(ath.dob)}</span>
                                )}
                              </div>
                              <div style={{ display: "flex", gap: 12, flexWrap: "wrap" }}>
                                {ath.started && !done && (
                                  <>
                                    <span style={{ fontSize: 11, color: "#5a86a8" }}>Chip: <span style={{ color: "#48cae4" }}>{formatElapsed(chipElapsed)}</span></span>
                                    {liveSegMs !== null && next >= 0 && (
                                      <span style={{ fontSize: 11, color: "#5a86a8" }}>
                                        {SEGMENTS[next]}: <span style={{ color: segColors[next], fontWeight: 700 }}>{formatElapsed(liveSegMs)}</span>
                                      </span>
                                    )}
                                  </>
                                )}
                                {done && (
                                  <>
                                    <span style={{ fontSize: 11, color: "#5a86a8" }}>Chip: <span style={{ color: "#4ade80" }}>{formatElapsed(totalChipTime(ath))}</span></span>
                                    {gt !== null && <span style={{ fontSize: 11, color: "#5a86a8" }}>Gun: <span style={{ color: "#ffd166" }}>{formatElapsed(gt)}</span></span>}
                                  </>
                                )}
                              </div>
                            </div>
                          </div>
                          <div style={{ display: "flex", gap: 6, alignItems: "center" }}>
                            {done && <span style={{ fontSize: 11, fontWeight: 700, color: "#4ade80", letterSpacing: 1 }}>DONE</span>}
                            {!ath.started && clockStarted && (
                              <button onClick={() => sendOff(i)} style={{ ...btnStyle("#00aeef"), padding: "6px 14px", fontSize: 12 }}>Send Off</button>
                            )}
                            {ath.started && (
                              <button onClick={() => openEdit(i)} style={{ ...btnStyle(isEditing ? "#f4742b" : "#5a86a8", true), padding: "5px 10px", fontSize: 11 }}>
                                {isEditing ? "Cancel" : "Edit Times"}
                              </button>
                            )}
                          </div>
                        </div>

                        {/* Segment buttons */}
                        {ath.started && (
                          <div style={{ padding: "10px 14px", display: "flex", flexWrap: "wrap", gap: 6 }}>
                            {SEGMENTS.map((seg, si) => {
                              const logged = ath.splits[si] !== null;
                              const isNext = si === next;
                              const dur = segmentDuration(ath, si);
                              return (
                                <button key={si} onClick={() => !logged && isNext && logSplit(i, si)}
                                  style={{
                                    padding: "6px 12px", borderRadius: 4, border: "none",
                                    cursor: logged ? "default" : isNext ? "pointer" : "not-allowed",
                                    background: logged ? `${segColors[si]}22` : isNext ? segColors[si] : "rgba(255,255,255,0.04)",
                                    color: logged ? segColors[si] : isNext ? "#071829" : "#3a6080",
                                    fontWeight: 700, fontSize: 12, letterSpacing: 0.5, transition: "all 0.15s",
                                  }}>
                                  {seg}{logged && dur !== null ? ` · ${formatElapsed(dur)}` : isNext && liveSegMs !== null ? ` · ${formatElapsed(liveSegMs)}` : ""}
                                </button>
                              );
                            })}
                          </div>
                        )}

                        {/* Trainer bike progress — shows for trainer/spin courses or whenever live trainer data arrives */}
                        {!done && (() => {
                          const athCourse = (courses || []).find(c => c.id === ath.courseId) || (courses || [])[0];
                          const isTrainerCourse = (athCourse?.bikeType || "gps") !== "gps";
                          // Resolve tData BEFORE the gate so we can show the panel for any course when data is present
                          const tDataFb = athleteTrainerData[i];
                          // Fallback: host's own local BLE device — exact match, or solo-athlete case when no UID/name match resolved
                          const hostFallbackIdx = hostAthIdx ?? (athletes.length === 1 ? 0 : null);
                          const tDataLocal = (!tDataFb && i === hostFallbackIdx)
                            ? btDevices.find(d => d.connected && (d.readings.speed != null || d.readings.trainerDistMi != null || d.readings.power != null))
                            : null;
                          const tData = tDataFb || (tDataLocal ? {
                            distMi: tDataLocal.readings.trainerDistMi ?? null,
                            speed:  tDataLocal.readings.speed   ?? null,
                            cadence: tDataLocal.readings.cadence ?? null,
                            power:  tDataLocal.readings.power   ?? null,
                            t: Date.now()
                          } : null);
                          // Show panel if: trainer/spin course (always, to show no-signal prompt) OR any live trainer data arrived
                          if (!isTrainerCourse && !tData) return null;
                          if (next !== 2 && ath.splits[2] !== null) return null; // T2 already done — hide
                          const targetMi = isTrainerCourse ? (parseFloat(athCourse?.bikeMiles) || 0) : 0;
                          const distMi = tData?.distMi ?? null;
                          const pct = targetMi > 0 && distMi != null ? Math.min(100, (distMi / targetMi) * 100) : 0;
                          const inBike = next === 2;
                          return (
                            <div style={{ padding: "0 14px 10px" }}>
                              <div style={{ background: "#071829", borderRadius: 6, padding: "8px 12px", border: `1px solid ${inBike ? "rgba(255,213,102,0.5)" : "rgba(255,213,102,0.2)"}` }}>
                                <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center", marginBottom: (isTrainerCourse && distMi != null) ? 4 : 0 }}>
                                  <span style={{ fontSize: 10, color: "#ffd166", letterSpacing: 1 }}>🚲 {athCourse?.bikeType === "spin" ? "SPIN BIKE" : "TRAINER"}</span>
                                  <span style={{ fontFamily: "'Bebas Neue'", fontSize: 16, color: "#ffd166", letterSpacing: 1 }}>
                                    {isTrainerCourse
                                      ? (distMi != null ? `${distMi.toFixed(2)} / ${targetMi} mi` : (tData ? '0.00 mi' : 'No signal'))
                                      : (tData ? `${((tData.speed || 0) * 0.621).toFixed(1)} mph` : 'No signal')}
                                  </span>
                                </div>
                                {isTrainerCourse && targetMi > 0 && distMi != null && (
                                  <div style={{ background: "rgba(255,213,102,0.1)", borderRadius: 3, height: 5, marginBottom: 4 }}>
                                    <div style={{ height: "100%", width: `${pct}%`, background: pct >= 100 ? "#4ade80" : "#ffd166", borderRadius: 3, transition: "width 0.4s" }} />

                                )}
                                <div style={{ fontSize: 10, color: tData ? "#5a86a8" : "#f87171" }}>

                                    : (inBike ? 'No trainer signal — use Bike button above to advance manually' : 'Waiting for trainer signal…')}
                                </div>
                              </div>
                            </div>
                          );
                        })()}

                        {/* Edit panel */}
                        {isEditing && (
                          <div style={{ padding: "14px", background: "#071829", borderTop: "1px solid rgba(255,255,255,0.08)" }}>

                            </div>

                              {ath.startOffset !== null && (
                                <div>
                                  <div style={{ fontSize: 10, color: "#5a86a8", marginBottom: 4 }}>Send Off</div>

                                </div>
                              )}
                              {SEGMENTS.map((seg, si) => ath.splits[si] !== null && (
                                <div key={si}>
                                  <div style={{ fontSize: 10, color: segColors[si], marginBottom: 4 }}>{seg}</div>
                                  <input value={editValues[si] !== undefined ? editValues[si] : ""} onChange={e => setEditValues(v => ({ ...v, [si]: e.target.value }))} style={editInputStyle} placeholder="00:00.0" />
                                </div>
                              ))}
                            </div>
                            <div style={{ marginTop: 8, fontSize: 11, color: "#3a6080" }}>

                            </div>

                              <button onClick={() => saveEdits(i)} style={{ ...btnStyle("#4ade80"), padding: "7px 18px", fontSize: 12 }}>Save</button>
                              <button onClick={() => setEditTarget(null)} style={{ ...btnStyle("#5a86a8", true), padding: "7px 18px", fontSize: 12 }}>Cancel</button>
                            </div>
                          </div>
                        )}
                      </div>
                    );

                  {allFinished && (
                    <button onClick={() => setView("results")} style={{ ...btnStyle("#4ade80"), width: "100%", marginTop: 8, fontSize: 14 }}>

                    </button>

                <div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12, marginBottom: 14, padding: "12px 14px", background: "#0c2240", borderRadius: 8, border: "1px solid rgba(0,174,239,0.15)" }}>

                    <div>
                      <div style={{ fontFamily: "'Bebas Neue', sans-serif", fontSize: 22, letterSpacing: 3, color: "#e8f4fb", lineHeight: 1 }}>{certConfig.eventName || "Timeathon Results"}</div>
                      <div style={{ fontSize: 10, color: "#5a86a8", letterSpacing: 2, textTransform: "uppercase", marginTop: 2 }}>Swim &middot; Bike &middot; Run</div>
                    </div>
                  </div>
                  <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 8, marginBottom: 4 }}>
                    <div>
                      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 3, textTransform: "uppercase", color: "#5a86a8" }}>Final Results</div>

                        </button>
                        <button onClick={printCertificates} style={{ ...btnStyle("#ffd166", true), padding: "7px 14px", fontSize: 12 }}>

                    <div style={{ textAlign: "center", color: "#5a86a8", fontSize: 13, padding: "40px 20px" }}>

                    </div>
                  ) : (
                    <div style={{ overflowX: "auto" }}>
                      <div style={{ fontSize: 11, fontWeight: 700, letterSpacing: 2, textTransform: "uppercase", color: "#5a86a8", marginBottom: 6 }}>Overall</div>

                          <tr style={{ borderBottom: "2px solid rgba(255,255,255,0.1)" }}>

                            <th style={{ ...thStyle("#e879f9") }}>Bib</th>
                            <th style={{ ...thStyle("#5a86a8"), textAlign: "left" }}>Athlete</th>
                            <th style={thStyle("#5a86a8")}>Gender</th>
                            <th style={thStyle("#48cae4")}>Age Grp</th>
                            <th style={thStyle("#48cae4")}>Ag #</th>

                            <th style={thStyle("#ffd166")}>Gun</th>
                            <th style={{ ...thStyle("#00aeef"), borderLeft: "1px solid rgba(255,255,255,0.08)" }}>Swim Pace</th>
                            <th style={thStyle("#ffd166")}>Bike</th>
                            <th style={thStyle("#f4742b")}>Run Pace</th>
                          </tr>
                        </thead>
                        <tbody>
                          {sorted.map((ath, place) => {
                            const chip = totalChipTime(ath);
                            const gt   = gunTime(ath);
                            const swimMs = segmentDuration(ath, 0);
                            const bikeMs = segmentDuration(ath, 2);
                            const runMs  = segmentDuration(ath, 4);
                            const ac = athleteCourse(ath);
                            const sp = calcSwimPace(swimMs, ac.swimYards, units.swim);

                            const rp = calcRunPace(runMs, ac.runMiles, units.run);

                                </thead>
                                <tbody>
                                  {group.map((ath, agPlace) => {
                                    const chip = totalChipTime(ath);
                                    const agPlaceColor = agPlace === 0 ? "#4ade80" : agPlace === 1 ? "#ffd166" : agPlace === 2 ? "#48cae4" : "#5a86a8";
                                    return (
                                      <tr key={ath.id} style={{ borderBottom: "1px solid rgba(255,255,255,0.04)" }}>
                                        <td style={{ padding: "8px 8px", fontFamily: "'Bebas Neue'", fontSize: 18, color: agPlaceColor }}>{agPlace + 1}</td>
                                        <td style={{ padding: "8px 8px", fontWeight: 700, color: "#e8f4fb", whiteSpace: "nowrap" }}>{ath.name}</td>

                                          return <td key={si} style={{ padding: "8px 6px", textAlign: "center", color: segColors[si], whiteSpace: "nowrap" }}>{dur !== null ? formatElapsed(dur) : "--"}</td>;

                                        <td style={{ padding: "8px 8px", textAlign: "center", fontWeight: 800, color: "#4ade80", whiteSpace: "nowrap" }}>{chip !== null ? formatElapsed(chip) : "--"}</td>
                                      </tr>
                                    );
                                  })}
                                </tbody>
                              </table>
                            </div>
                          ))}
                        </div>
                      )}
                    </div>
                  )}
                </div>

            </div>

            {photoAlbum && (
            <div style={{ position: "fixed", inset: 0, background: "#040f1e", zIndex: 3000, display: "flex", flexDirection: "column" }}>
              {/* Header */}
              <div style={{ display: "flex", alignItems: "center", gap: 12, padding: "14px 16px", borderBottom: "1px solid rgba(255,255,255,0.08)", flexShrink: 0 }}>
                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: "#00aeef", letterSpacing: 1 }}>📷 {photoAlbum.raceName}</div>
                  <div style={{ fontSize: 11, color: "#3a6080" }}>
                    {photoAlbum.loading ? "Loading photos…" : `${photoAlbum.files.length} photo${photoAlbum.files.length !== 1 ? "s" : ""}`}
                  </div>
                </div>
                <button onClick={() => openPhotoAlbum(photoAlbum.raceId, photoAlbum.raceName, photoAlbum.shareCode)} style={{ ...btnStyle("#5a86a8", true), padding: "6px 14px", fontSize: 12, flexShrink: 0 }}>Change Folder</button>
                <button onClick={closePhotoAlbum} style={{ background: "none", border: "none", color: "#5a86a8", fontSize: 28, cursor: "pointer", padding: "0 4px", lineHeight: 1 }}>&times;</button>
              </div>

              {/* Grid */}
              <div style={{ flex: 1, overflowY: "auto", padding: 12 }}>
                {photoAlbum.loading ? (

                    <button onClick={() => openPhotoAlbum(photoAlbum.raceId, photoAlbum.raceName, photoAlbum.shareCode)} style={{ ...btnStyle("#00aeef"), padding: "8px 22px", fontSize: 13, marginTop: 8 }}>Choose Different Folder</button>

                    <div style={{ display: "flex", alignItems: "center", gap: 12 }}>

                        <div style={{ background: "#00aeef", height: "100%", width: `${photoAlbum.uploadProgress.total ? Math.round((photoAlbum.uploadProgress.done / photoAlbum.uploadProgress.total) * 100) : 0}%`, transition: "width 0.3s" }} />
                      </div>
                      <div style={{ fontSize: 12, color: "#5a86a8", flexShrink: 0 }}>Uploading {photoAlbum.uploadProgress.done}/{photoAlbum.uploadProgress.total}…</div>

                      <div style={{ fontSize: 11, color: "#3a6080" }}>Upload to cloud &amp; get a code participants can use to download photos.</div>

                return (

                      onClick={e => { e.stopPropagation(); setPhotoAlbum(p => ({ ...p, lightboxIdx: null })); }}>&times;</div>
                    <div style={{ position: "absolute", top: 16, left: 16, fontSize: 12, color: "#3a6080" }}>{photoAlbum.lightboxIdx + 1} / {photoAlbum.files.length}</div>

                    )}

                    <div style={{ position: "absolute", bottom: 14, color: "#3a6080", fontSize: 11, maxWidth: "80vw", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</div>

                <div style={{ flex: 1, minWidth: 0 }}>
                  <div style={{ fontFamily: "'Bebas Neue'", fontSize: 22, color: "#e879f9", letterSpacing: 1 }}>&#128247; {viewPhotoAlbum.raceName || viewPhotoAlbum.code}</div>
                  <div style={{ fontSize: 11, color: "#3a6080" }}>
                    {viewPhotoAlbum.loading ? "Loading…" : viewPhotoAlbum.error ? "Not found" : `${viewPhotoAlbum.photos.length} photo${viewPhotoAlbum.photos.length !== 1 ? "s" : ""} · Code: ${viewPhotoAlbum.code}`}
                  </div>
                </div>
                <button onClick={() => setViewPhotoAlbum(null)} style={{ background: "none", border: "none", color: "#5a86a8", fontSize: 28, cursor: "pointer", padding: "0 4px", lineHeight: 1 }}>&times;</button>

              {/* Grid */}
              <div style={{ flex: 1, overflowY: "auto", padding: 12 }}>
                {viewPhotoAlbum.loading ? (
                  <div style={{ display: "flex", alignItems: "center", justifyContent: "center", height: 200, color: "#3a6080", fontSize: 14 }}>Loading photos…</div>
                ) : viewPhotoAlbum.error ? (
                  <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: 260, gap: 12 }}>
                    <div style={{ fontSize: 44 }}>&#128269;</div>
                    <div style={{ color: "#f87171", fontSize: 13, textAlign: "center", maxWidth: 320 }}>{viewPhotoAlbum.error}</div>
                    <button onClick={() => setViewPhotoAlbum(null)} style={{ ...btnStyle("#5a86a8", true), padding: "8px 22px", fontSize: 13 }}>Close</button>
                  </div>
                ) : viewPhotoAlbum.photos.length === 0 ? (
                  <div style={{ textAlign: "center", color: "#3a6080", padding: 40, fontSize: 14 }}>No photos in this album.</div>
                ) : (
                  <>
                    <div style={{ display: "flex", justifyContent: "flex-end", marginBottom: 8 }}>
                      <button onClick={() => downloadAllPhotos(viewPhotoAlbum.photos)} style={{ ...btnStyle("#00aeef", true), padding: "6px 16px", fontSize: 12 }}>&#8595; Download All ({viewPhotoAlbum.photos.length})</button>
                    </div>
                    <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fill, minmax(150px, 1fr))", gap: 8 }}>
                      {viewPhotoAlbum.photos.map((f, idx) => (
                        <div key={f.name} style={{ position: "relative" }}>
                          <div onClick={() => setViewPhotoAlbum(p => ({ ...p, lightboxIdx: idx }))}
                            style={{ aspectRatio: "1", borderRadius: 6, overflow: "hidden", cursor: "pointer", background: "#0c2240" }}>
                            <img src={f.url} alt={f.name} loading="lazy"

                        </div>

              {viewPhotoAlbum.lightboxIdx !== null && (() => {

                  <div style={{ position: "fixed", inset: 0, background: "rgba(0,0,0,0.96)", zIndex: 3100, display: "flex", alignItems: "center", justifyContent: "center" }}
                    onClick={() => setViewPhotoAlbum(p => ({ ...p, lightboxIdx: null }))}>
                    <div style={{ position: "absolute", top: 14, right: 16, color: "#5a86a8", fontSize: 30, cursor: "pointer", lineHeight: 1, padding: 4 }}
                      onClick={e => { e.stopPropagation(); setViewPhotoAlbum(p => ({ ...p, lightboxIdx: null })); }}>&times;</div>
                    <div style={{ position: "absolute", top: 16, left: 16, fontSize: 12, color: "#3a6080" }}>{viewPhotoAlbum.lightboxIdx + 1} / {viewPhotoAlbum.photos.length}</div>
                    {viewPhotoAlbum.lightboxIdx > 0 && (
                      <button onClick={e => { e.stopPropagation(); setViewPhotoAlbum(p => ({ ...p, lightboxIdx: p.lightboxIdx - 1 })); }}
                        style={{ position: "absolute", left: 12, background: "rgba(255,255,255,0.08)", border: "none", color: "#e8f4fb", fontSize: 32, cursor: "pointer", borderRadius: "50%", width: 48, height: 48, display: "flex", alignItems: "center", justifyContent: "center" }}>&#8249;</button>
                    )}
                    {viewPhotoAlbum.lightboxIdx < viewPhotoAlbum.photos.length - 1 && (
                      <button onClick={e => { e.stopPropagation(); setViewPhotoAlbum(p => ({ ...p, lightboxIdx: p.lightboxIdx + 1 })); }}
                        style={{ position: "absolute", right: 12, background: "rgba(255,255,255,0.08)", border: "none", color: "#e8f4fb", fontSize: 32, cursor: "pointer", borderRadius: "50%", width: 48, height: 48, display: "flex", alignItems: "center", justifyContent: "center" }}>&#8250;</button>
                    )}
                    <button onClick={e => { e.stopPropagation(); downloadPhoto(vf.url, vf.name); }}
                      style={{ position: "absolute", bottom: 14, right: 14, background: "rgba(0,174,239,0.15)", border: "1px solid rgba(0,174,239,0.4)", borderRadius: 6, color: "#00aeef", fontSize: 12, padding: "6px 14px", cursor: "pointer" }}>&#8595; Download</button>
                    <img src={vf.url} alt={vf.name} onClick={e => e.stopPropagation()}
                      style={{ maxWidth: "90vw", maxHeight: "88vh", objectFit: "contain", borderRadius: 4 }} />
                    <div style={{ position: "absolute", bottom: 14, left: "50%", transform: "translateX(-50%)", color: "#3a6080", fontSize: 11, maxWidth: "60vw", overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{vf.name}</div>
                  </div>
                );
              })()}
            </div>
            )}

            {/* ── SWIM MEET TIMER ── */}
            {view === "swim" && (() => {

                function recordFinish(eventNum, heatNum, lane) {
                  const t = swimClockMs;
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ev.eventNum !== eventNum ? ev : {
                      ...ev,
                      heats: ev.heats.map(h => h.heatNum !== heatNum ? h : {
                        ...h,
                        lanes: h.lanes.map(sw => sw.lane !== lane ? sw : { ...sw, finalMs: t })
                      })
                    })
                  }));
                }

                function toggleDq(eventNum, heatNum, lane) {
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ev.eventNum !== eventNum ? ev : {
                      ...ev,
                      heats: ev.heats.map(h => h.heatNum !== heatNum ? h : {
                        ...h,
                        lanes: h.lanes.map(sw => sw.lane !== lane ? sw : { ...sw, dq: !sw.dq, finalMs: sw.dq ? sw.finalMs : null })
                      })
                    })
                  }));
                }

                function resetSwimClock() {
                  setSwimClockRunning(false);
                  setSwimClockStarted(false);
                  setSwimClockMs(0);
                  swimOffsetRef.current = 0;
                }

                function persistSwimArchive(updatedMeet) {
                  const entry = {
                    id: `swim_${Date.now()}`,
                    meetName: updatedMeet.meetName || "Unnamed Meet",
                    pool: updatedMeet.pool,
                    date: new Date().toLocaleDateString(),
                    savedAt: Date.now(),
                    events: updatedMeet.events
                  };
                  const updated = [entry, ...swimArchive];
                  setSwimArchive(updated);
                  try { localStorage.setItem("swim-archive", JSON.stringify(updated)); } catch(e) {}
                  if (currentUser) rtdb.ref("users/"+currentUser.uid+"/swimArchive").set(updated).catch(console.error);
                }

                function persistSwimMeets(meets) {
                  setSwimSavedMeets(meets);
                  localStorage.setItem("swim-saved-meets", JSON.stringify(meets));
                  if (currentUser) rtdb.ref("users/"+currentUser.uid+"/swimMeets").set(meets).catch(console.error);
                }
                function saveCurentMeet() {
                  if (!swimMeet.meetName && swimMeet.events.length === 0) return;
                  const existing = swimSavedMeets.find(m => m.id === swimMeet._id);
                  const id = swimMeet._id || `meet_${Date.now()}`;
                  const entry = {
                    id,
                    meetName: swimMeet.meetName || "Unnamed Meet",
                    pool: swimMeet.pool,
                    savedAt: new Date().toLocaleDateString(),
                    events: swimMeet.events,
                    code: existing?.code
                  };
                  if (existing) {
                    persistSwimMeets(swimSavedMeets.map(m => m.id === id ? entry : m));
                  } else {
                    setSwimMeet(m => ({ ...m, _id: id }));
                    persistSwimMeets([entry, ...swimSavedMeets]);
                  }
                }
                function saveAndStartLiveSession(nameVal) {
                  const name = (nameVal || "").trim() || `Meet ${swimSavedMeets.length + 1}`;
                  const existing = swimSavedMeets.find(m => m.id === swimMeet._id);
                  const code = existing?.code || generateSwimCode();
                  const id = swimMeet._id || `meet_${Date.now()}`;
                  const entry = { id, meetName: name, pool: swimMeet.pool, savedAt: new Date().toLocaleDateString(), events: swimMeet.events, code };
                  if (existing) {
                    persistSwimMeets(swimSavedMeets.map(m => m.id === id ? entry : m));
                  } else {
                    persistSwimMeets([entry, ...swimSavedMeets]);
                  }
                  setSwimMeet(m => ({ ...m, meetName: name, _id: id }));
                  setSwimShowSaveBefore(false);
                  setSwimSaveBeforeName("");
                  rtdb.ref(`swimLive/${code}`).set({
                    meetName: name, pool: swimMeet.pool,
                    activeEvent: swimActiveEvent, activeHeat: swimActiveHeat,
                    status: "waiting", startedAt: null,
                    events: swimMeet.events, results: null, heatResults: null,
                  }).catch(console.error);
                  setSwimLiveCode(code);
                }
                function loadSwimMeet(meet) {
                  setSwimMeet({ meetName: meet.meetName, pool: meet.pool, events: meet.events, _id: meet.id });
                  setSwimLiveCode(null);
                  setSwimView("setup");
                  setSwimHomeSection(null);
                }
                function persistSwimAthletes(athletes) {
                  setSwimAthletes(athletes);
                  localStorage.setItem("swim-athletes", JSON.stringify(athletes));
                }

                function seedOneEvent(eventNum) {
                  const numLanes = swimMeet.lanes || 8;
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ev.eventNum === eventNum
                      ? { ...ev, heats: autoSeedEvent(ev, numLanes) }
                      : ev)
                  }));
                }

                function seedAllEvents() {
                  const numLanes = swimMeet.lanes || 8;
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ({ ...ev, heats: autoSeedEvent(ev, numLanes) }))
                  }));
                }

                function addSwimmerEntry(eventNum) {
                  const { name, team, seedTime } = swimNewSwimmerForm;
                  if (!name.trim()) return;
                  const seedMs = parseSeedTime(seedTime) || null;
                  const entry = {
                    name: name.trim(),
                    team: team.trim(),
                    seedMs,
                    seedTime: seedMs ? formatSwimTime(seedMs) : "NT",
                    firstName: name.trim().split(" ")[0] || "",
                    lastName: name.trim().split(" ").slice(1).join(" ") || "",
                    age: 0
                  };
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ev.eventNum === eventNum
                      ? { ...ev, entries: [...(ev.entries || []), entry] }
                      : ev)
                  }));
                  setSwimNewSwimmerForm({ name:"", team:"", seedTime:"" });
                }

                function removeSwimmerEntry(eventNum, entryIdx) {
                  setSwimMeet(m => ({
                    ...m,
                    events: m.events.map(ev => ev.eventNum === eventNum
                      ? { ...ev, entries: (ev.entries || []).filter((_, i) => i !== entryIdx) }
                      : ev)
                  }));
                }

                function reseedWithRoster(m) {
                  const numLanes = m.lanes || 8;
                  const roster = m.meetEntries || [];
                  return {
                    ...m,
                    events: m.events.map(ev => {
                      const entryList = roster
                        .filter(s => s.events.some(e => e.eventNum === ev.eventNum))
                        .map(s => {
                          const evEntry = s.events.find(e => e.eventNum === ev.eventNum);
                          return {
                            name: s.name, firstName: s.firstName, lastName: s.lastName,
                            team: s.team, age: s.age || 0,
                            seedMs: evEntry?.seedMs || null, seedTime: evEntry?.seedTime || "NT"
                          };
                        });
                      if (entryList.length === 0) return ev;
                      return { ...ev, entries: entryList, heats: autoSeedEvent({ ...ev, entries: entryList }, numLanes) };
                    })
                  };
                }

                function addToMeetRoster() {
                  const { name, team, age, gender, ageGroup, events: evts, athleteId } = swimNewEntry;
                  if (!name.trim()) return;
                  const eventEntries = Object.entries(evts)
                    .filter(([, v]) => v.checked)
                    .map(([eventNum, v]) => {
                      const seedMs = parseSeedTime(v.seedTime) || null;
                      return { eventNum: parseInt(eventNum), seedMs, seedTime: seedMs ? formatSwimTime(seedMs) : "NT" };
                    });
                  const entry = {
                    id: swimRosterEditId || `me_${Date.now()}`,
                    athleteId: athleteId || null,
                    name: name.trim(),
                    firstName: name.trim().split(" ")[0] || "",
                    lastName: name.trim().split(" ").slice(1).join(" ") || "",
                    team: team.trim(),
                    age: parseInt(age) || 0,
                    gender, ageGroup,
                    events: eventEntries
                  };
                  setSwimMeet(m => {
                    const existing = (m.meetEntries || []);
                    const updated = swimRosterEditId
                      ? existing.map(e => e.id === swimRosterEditId ? entry : e)
                      : [...existing, entry];
                    return reseedWithRoster({ ...m, meetEntries: updated });
                  });
                  setSwimNewEntry({ name:"", team:"", age:"", gender:"Girls", ageGroup:"Open", events:{}, athleteId:null });
                  setSwimRosterOpen(false);
                  setSwimRosterEditId(null);
                }

                function removeMeetEntry(id) {
                  setSwimMeet(m => reseedWithRoster({ ...m, meetEntries: (m.meetEntries || []).filter(e => e.id !== id) }));
                }

                function autoSeedFromRoster() {
                  if (!(swimMeet.meetEntries||[]).length) return;
                  setSwimMeet(m => reseedWithRoster(m));
                }

                async function importMeetFile(file) {
                  const text = await file.text();
                  let parsed;
                  const lower = file.name.toLowerCase();
                  if (lower.endsWith(".hy3") || lower.endsWith(".cl2")) {
                    parsed = parseHy3(text);
                  } else {
                    parsed = parseSwimCsv(text);
                  }
                  setSwimMeet(m => ({
                    ...parsed,
                    pool: m.pool
                  }));
                  setSwimExpandedEvents({});
                }

                function saveAndAdvance() {
                  const ev = swimMeet.events.find(e => e.eventNum === swimActiveEvent);
                  if (!ev) return;
                  const hIdx = ev.heats.findIndex(h => h.heatNum === swimActiveHeat);
                  const ht = ev.heats[hIdx];
                  resetSwimClock();
                  // Record times to athlete profiles
                  if (ht) {
                    const today = new Date().toISOString().slice(0, 10);
                    const key = eventKey(ev);
                    const athleteUpdates = new Map();
                    ht.lanes.forEach(s => {
                      if (s.finalMs != null && !s.dq && !s.scratch) {
                        const rosterEntry = (swimMeet.meetEntries || []).find(e => e.name === s.name);
                        const aid = rosterEntry?.athleteId;
                        const athlete = aid ? swimAthletes.find(a => a.id === aid) : null;
                        if (!athlete) return;
                        const base = athleteUpdates.get(aid) || athlete;
                        const existing = base.personalBests?.[key];
                        const isFaster = !existing || s.finalMs < existing.ms;
                        const histEntry = { key, ms: s.finalMs, time: formatSwimTime(s.finalMs), date: today, meetName: swimMeet.meetName || "Meet" };
                        athleteUpdates.set(aid, {
                          ...base,
                          personalBests: isFaster ? { ...base.personalBests, [key]: { ms: s.finalMs, time: formatSwimTime(s.finalMs), date: today, meetName: swimMeet.meetName || "Meet" } } : base.personalBests,
                          timeHistory: [...(base.timeHistory || []), histEntry]
                        });
                      }
                    });
                    if (athleteUpdates.size > 0) {
                      persistSwimAthletes(swimAthletes.map(a => athleteUpdates.has(a.id) ? athleteUpdates.get(a.id) : a));
                    }
                  }
                  if (swimLiveCode) {
                    if (ht) {
                      const hrs = {};
                      ht.lanes.forEach(s => { if (s.finalMs != null) hrs[s.lane] = { finalMs: s.finalMs, dq: s.dq||false, name: s.name||"", team: s.team||"" }; });
                      if (Object.keys(hrs).length > 0) {
                        rtdb.ref(`swimLive/${swimLiveCode}/heatResults/${swimActiveEvent}_${swimActiveHeat}`).set(hrs).catch(console.error);
                      }
                    }
                    rtdb.ref(`swimLive/${swimLiveCode}`).update({ status: "waiting", startedAt: null, results: null }).catch(console.error);
                  }
                  if (hIdx < ev.heats.length - 1) {
                    const nextHeat = ev.heats[hIdx + 1];
                    setSwimActiveHeat(nextHeat.heatNum);
                    if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ activeHeat: nextHeat.heatNum }).catch(console.error);
                  } else {
                    const eIdx = swimMeet.events.findIndex(e => e.eventNum === swimActiveEvent);
                    if (eIdx < swimMeet.events.length - 1) {
                      const nextEv = swimMeet.events[eIdx + 1];
                      const nextHt = nextEv.heats[0] ? nextEv.heats[0].heatNum : 1;
                      setSwimActiveEvent(nextEv.eventNum);
                      setSwimActiveHeat(nextHt);
                      if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ activeEvent: nextEv.eventNum, activeHeat: nextHt }).catch(console.error);
                    } else {
                      setSwimView("results");
                      if (swimLiveCode) rtdb.ref(`swimLive/${swimLiveCode}`).update({ status: "finished" }).catch(console.error);
                      return;
                    }
                  }
                }

                const activeEv = swimMeet.events.find(e => e.eventNum === swimActiveEvent);
                const activeHt = activeEv && activeEv.heats.find(h => h.heatNum === swimActiveHeat);
                const totalHeats = activeEv ? activeEv.heats.length : 0;
                const heatIndex  = activeEv ? activeEv.heats.findIndex(h => h.heatNum === swimActiveHeat) : -1;

                const S = { // shared styles
                  card: { background:"#0c2240", border:"1px solid rgba(0,174,239,0.2)", borderRadius:8, padding:"14px 16px", marginBottom:12 },
                  label: { fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:4 },
                  input: { background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 12px", color:"#e8f4fb", fontSize:13, outline:"none", width:"100%", boxSizing:"border-box" },
                  row: { display:"flex", gap:8, alignItems:"center" }
                };

                const swimTabStyle = (active) => ({
                  padding:"8px 16px", fontSize:12, fontWeight:700, letterSpacing:1, textTransform:"uppercase",
                  background: active ? "rgba(0,174,239,0.15)" : "transparent",
                  border: active ? "1px solid rgba(0,174,239,0.4)" : "1px solid rgba(255,255,255,0.08)",
                  borderRadius:6, color: active ? "#00aeef" : "#5a86a8", cursor:"pointer"
                });

                return (
                  <div style={{ paddingTop: 8, maxWidth: 600, margin: "0 auto" }}>

                    {/* Sub-nav (only shown in triathlon mode; swim mode uses top-level nav) */}
                    {appMode !== "swim" && (
                      <div style={{ display:"flex", gap:6, marginBottom:16, flexWrap:"wrap" }}>
                        {[["setup","Setup"],["race","Race"],["results","Results"],["archive","Archive"]].map(([v,label]) => (
                          <button key={v} style={swimTabStyle(swimView === v)} onClick={() => setSwimView(v)}>{label}</button>
                        ))}
                      </div>
                    )}

                    {swimView === "home" && (
                      <div style={{ padding:"10px 0 20px" }}>
                        <div style={{ textAlign:"center", marginBottom:28 }}>
                          <div style={{ fontFamily:"'Bebas Neue', sans-serif", fontSize:56, letterSpacing:6, color:"#f0f6ff", lineHeight:1 }}>
                            <span style={{ color:"#48cae4" }}>Swim</span> Meet
                          </div>
                          <div style={{ fontSize:11, letterSpacing:4, textTransform:"uppercase", color:"#5a86a8", marginTop:6 }}>
                            {swimMeet.meetName || "No meet loaded"}
                          </div>
                        </div>

                        <div style={{ display:"flex", flexDirection:"column", gap:14 }}>

                          <button onClick={() => {
                            const hasWork = swimMeet.meetName || swimMeet.events.length > 0;
                            if (hasWork) { setSwimConfirmNewMeet(true); return; }
                            setSwimMeet({ meetName:"", pool:"25y", events:[] });
                            setSwimLiveCode(null);
                            setSwimView("setup");
                          }}
                            style={{ background:"linear-gradient(135deg,#0c2240,#0d3a6e)", border:"2px solid #48cae4", borderRadius:12, padding:"22px 24px", textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:18 }}>
                            <div style={{ fontSize:40, lineHeight:1 }}>🏊</div>
                            <div>
                              <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:26, letterSpacing:3, color:"#48cae4" }}>New Meet</div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:2 }}>Set up events, heats, and swimmers</div>
                            </div>
                            <div style={{ marginLeft:"auto", fontSize:22, color:"#48cae4" }}>→</div>
                          </button>

                          <button onClick={() => setSwimHomeSection(swimHomeSection === "meets" ? null : "meets")}
                            style={{ background:"linear-gradient(135deg,#0c2240,#1a3a1a)", border:"2px solid #ffd166", borderRadius:12, padding:"22px 24px", textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:18 }}>
                            <div style={{ fontSize:40, lineHeight:1 }}>📋</div>
                            <div>
                              <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:26, letterSpacing:3, color:"#ffd166" }}>Existing Meets</div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:2 }}>
                                {swimSavedMeets.length === 0 ? "No saved meets yet" : `${swimSavedMeets.length} saved meet${swimSavedMeets.length !== 1 ? "s" : ""}`}
                              </div>
                            </div>
                            <div style={{ marginLeft:"auto", fontSize:22, color:"#ffd166" }}>{swimHomeSection === "meets" ? "▲" : "▼"}</div>
                          </button>

                          {swimHomeSection === "meets" && (
                            <div style={{ marginTop:-6, background:"#0a1e36", border:"1px solid rgba(255,209,102,0.25)", borderRadius:8, padding:12, display:"flex", flexDirection:"column", gap:8 }}>
                              {swimSavedMeets.length === 0 ? (
                                <div style={{ fontSize:12, color:"#3a6080", textAlign:"center", padding:"12px 0" }}>No saved meets — go to Setup to save one.</div>
                              ) : swimSavedMeets.map(meet => (
                                <div key={meet.id} style={{ background:"#0c2240", borderRadius:6, padding:"10px 12px", display:"flex", alignItems:"center", justifyContent:"space-between", gap:10 }}>
                                  <div style={{ minWidth:0 }}>
                                    <div style={{ fontWeight:700, fontSize:13, color:"#e8f4fb" }}>{meet.meetName}</div>
                                    <div style={{ fontSize:11, color:"#3a6080" }}>{meet.pool} · {meet.events.length} events · {meet.savedAt}</div>
                                  </div>
                                  <div style={{ display:"flex", gap:6, flexShrink:0 }}>
                                    <button onClick={() => loadSwimMeet(meet)} style={{ ...btnStyle("#ffd166"), padding:"5px 14px", fontSize:11 }}>Load</button>
                                    {swimDeleteMeetConfirm === meet.id ? (
                                      <>
                                        <button onClick={() => { persistSwimMeets(swimSavedMeets.filter(m => m.id !== meet.id)); setSwimDeleteMeetConfirm(null); }} style={{ ...btnStyle("#f4742b"), padding:"5px 10px", fontSize:11 }}>Delete?</button>
                                        <button onClick={() => setSwimDeleteMeetConfirm(null)} style={{ ...btnStyle("#5a86a8", true), padding:"5px 10px", fontSize:11 }}>No</button>
                                      </>
                                    ) : (
                                      <button onClick={() => setSwimDeleteMeetConfirm(meet.id)} style={{ background:"none", border:"none", color:"#3a6080", fontSize:16, cursor:"pointer", padding:"0 4px" }}>×</button>
                                    )}
                                  </div>
                                </div>
                              ))}
                            </div>
                          )}

                          <button onClick={() => setSwimView("athletes")}
                            style={{ background:"linear-gradient(135deg,#0c2240,#0a2a1a)", border:"2px solid #4ade80", borderRadius:12, padding:"22px 24px", textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:18 }}>
                            <div style={{ fontSize:40, lineHeight:1 }}>👥</div>
                            <div>
                              <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:26, letterSpacing:3, color:"#4ade80" }}>Swim Teams</div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:2 }}>
                                {swimAthletes.length === 0 ? "Manage swimmers and teams" : `${swimAthletes.length} swimmer${swimAthletes.length !== 1 ? "s" : ""} in library`}
                              </div>
                            </div>
                            <div style={{ marginLeft:"auto", fontSize:22, color:"#4ade80" }}>→</div>
                          </button>

                          <button onClick={() => setSwimView("archive")}
                            style={{ background:"linear-gradient(135deg,#0c2240,#1a0a2e)", border:"2px solid #f4742b", borderRadius:12, padding:"22px 24px", textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:18 }}>
                            <div style={{ fontSize:40, lineHeight:1 }}>📁</div>
                            <div>
                              <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:26, letterSpacing:3, color:"#f4742b" }}>Past Meets</div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:2 }}>
                                {swimArchive.length === 0 ? "No past meets yet" : `${swimArchive.length} meet${swimArchive.length !== 1 ? "s" : ""} archived`}
                              </div>
                            </div>
                            <div style={{ marginLeft:"auto", fontSize:22, color:"#f4742b" }}>→</div>
                          </button>

                          <button onClick={() => setView("swimwatch")}
                            style={{ background:"linear-gradient(135deg,#0c2240,#1a1a3a)", border:"2px solid #a78bfa", borderRadius:12, padding:"22px 24px", textAlign:"left", cursor:"pointer", display:"flex", alignItems:"center", gap:18 }}>
                            <div style={{ fontSize:40, lineHeight:1 }}>👀</div>
                            <div>
                              <div style={{ fontFamily:"'Bebas Neue',sans-serif", fontSize:26, letterSpacing:3, color:"#a78bfa" }}>Watch a Meet</div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:2 }}>Join a live meet as a viewer</div>
                            </div>
                            <div style={{ marginLeft:"auto", fontSize:22, color:"#a78bfa" }}>→</div>
                          </button>

                        </div>
                      </div>
                    )}

                    {/* ── SETUP ── */}
                    {swimView === "setup" && (
                      <div>
                        {/* Meet header */}
                        <div style={S.card}>
                          <div style={S.label}>Meet Name</div>
                          <input style={S.input} value={swimMeet.meetName}
                            onChange={e => setSwimMeet(m => ({...m, meetName: e.target.value}))}
                            placeholder="e.g. Summer Invitational 2025" />
                          <div style={{...S.label, marginTop:12}}>Pool / Course</div>
                          <div style={{ display:"flex", gap:8 }}>
                            {["25y","25m","50m"].map(p => (
                              <button key={p} onClick={() => setSwimMeet(m => ({...m, pool: p}))}
                                style={{ padding:"6px 16px", borderRadius:4, fontSize:12, fontWeight:700, border:"1px solid rgba(0,174,239,0.4)", background: swimMeet.pool === p ? "rgba(0,174,239,0.2)" : "transparent", color: swimMeet.pool === p ? "#00aeef" : "#5a86a8", cursor:"pointer" }}>
                                {p}
                              </button>
                            ))}
                          </div>
                          <div style={{...S.label, marginTop:12}}>Lanes per Pool</div>
                          <div style={{ display:"flex", gap:6 }}>
                            {[4,6,8,10].map(n => (
                              <button key={n} onClick={() => setSwimMeet(m => ({...m, lanes:n}))}
                                style={{ padding:"6px 14px", borderRadius:4, fontSize:12, fontWeight:700, border:"1px solid rgba(0,174,239,0.4)", background: (swimMeet.lanes||8) === n ? "rgba(0,174,239,0.2)" : "transparent", color: (swimMeet.lanes||8) === n ? "#00aeef" : "#5a86a8", cursor:"pointer" }}>
                                {n}
                              </button>
                            ))}
                          </div>
                        </div>

                        {/* Import */}
                        <div style={S.card}>
                          <div style={S.label}>Import Meet File</div>
                          <input ref={swimFileInputRef} type="file" accept=".hy3,.HY3,.cl2,.CL2,.csv" style={{ display:"none" }}
                            onChange={e => { if (e.target.files[0]) importMeetFile(e.target.files[0]); e.target.value = ""; }} />
                          <button onClick={() => swimFileInputRef.current && swimFileInputRef.current.click()}
                            style={{ ...btnStyle("#48cae4"), fontSize:13, width:"100%", marginBottom:4 }}>
                            📂 Import Meet File (.hy3 or .csv)
                          </button>
                          <div style={{ fontSize:11, color:"#3a6080" }}>Supports Hy-Tek .hy3, .cl2 (Team Manager), and CSV exports.</div>
                        </div>

                        {/* Event tree */}
                        {swimMeet.events.length > 0 && (
                          <div style={S.card}>
                            <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom:10 }}>
                              <div style={S.label}>Events ({swimMeet.events.length})</div>
                              <div style={{ display:"flex", gap:8 }}>
                                <button onClick={seedAllEvents}
                                  style={{ fontSize:11, color:"#48cae4", background:"none", border:"none", cursor:"pointer" }}>🌱 Seed All</button>
                                <button onClick={() => { const all = {}; swimMeet.events.forEach(ev => { all[ev.eventNum] = true; }); setSwimExpandedEvents(all); }}
                                  style={{ fontSize:11, color:"#5a86a8", background:"none", border:"none", cursor:"pointer" }}>Expand All</button>
                              </div>
                            </div>
                            {swimMeet.events.map(ev => {
                              const expanded = !!swimExpandedEvents[ev.eventNum];
                              const showAddForm = swimAddSwimmerEvt === ev.eventNum;
                              return (
                                <div key={ev.eventNum} style={{ background:"#071829", borderRadius:6, marginBottom:6, overflow:"hidden", border:"1px solid rgba(0,174,239,0.1)" }}>
                                  <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", padding:"10px 12px", cursor:"pointer" }}
                                    onClick={() => setSwimExpandedEvents(x => ({...x, [ev.eventNum]: !x[ev.eventNum]}))}>
                                    <div>
                                      <span style={{ color:"#00aeef", fontWeight:700, marginRight:8, fontSize:12 }}>Event {ev.eventNum}</span>
                                      <span style={{ color:"#e8f4fb", fontSize:13 }}>{ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}</span>
                                      <span style={{ color:"#5a86a8", fontSize:11, marginLeft:8 }}>{ev.heats.length} heat{ev.heats.length !== 1 ? "s" : ""}{ev.entries && ev.entries.length > 0 ? ` · ${ev.entries.length} entries` : ""}</span>
                                    </div>
                                    <div style={{ display:"flex", gap:6, alignItems:"center" }}>
                                      <button onClick={e => { e.stopPropagation(); seedOneEvent(ev.eventNum); }}
                                        style={{ fontSize:11, padding:"4px 10px", borderRadius:4, background:"rgba(72,202,228,0.1)", border:"1px solid rgba(72,202,228,0.3)", color:"#48cae4", cursor:"pointer", fontWeight:700 }}>
                                        🌱 Seed
                                      </button>
                                      <button onClick={e => { e.stopPropagation(); setSwimAddSwimmerEvt(x => x === ev.eventNum ? null : ev.eventNum); setSwimNewSwimmerForm({ name:"", team:"", seedTime:"" }); }}
                                        style={{ fontSize:11, padding:"4px 10px", borderRadius:4, background: showAddForm ? "rgba(0,174,239,0.2)" : "rgba(0,174,239,0.08)", border:"1px solid rgba(0,174,239,0.3)", color:"#00aeef", cursor:"pointer", fontWeight:700 }}>
                                        + Swimmer
                                      </button>
                                      <button onClick={e => { e.stopPropagation(); setSwimActiveEvent(ev.eventNum); setSwimActiveHeat(ev.heats[0] ? ev.heats[0].heatNum : 1); setSwimView("race"); }}
                                        style={{ fontSize:11, padding:"4px 10px", borderRadius:4, background:"rgba(0,174,239,0.15)", border:"1px solid rgba(0,174,239,0.3)", color:"#00aeef", cursor:"pointer", fontWeight:700 }}>
                                        ▶ Start
                                      </button>
                                      <span style={{ color:"#5a86a8", fontSize:14 }}>{expanded ? "▲" : "▼"}</span>
                                    </div>
                                  </div>
                                  {expanded && ev.heats.map(ht => (
                                    <div key={ht.heatNum} style={{ padding:"6px 16px", borderTop:"1px solid rgba(0,174,239,0.08)" }}>
                                      <div style={{ fontSize:11, color:"#48cae4", fontWeight:700, marginBottom:4 }}>Heat {ht.heatNum}</div>
                                      {ht.lanes.map(sw => (
                                        <div key={sw.lane} style={{ display:"flex", gap:8, fontSize:12, color:"#e8f4fb", padding:"2px 0" }}>
                                          <span style={{ color:"#5a86a8", width:50 }}>Lane {sw.lane}</span>
                                          <span style={{ flex:1 }}>{sw.name || "(empty)"}</span>
                                          <span style={{ color:"#5a86a8" }}>{sw.team}</span>
                                          <span style={{ color:"#3a6080", width:60, textAlign:"right" }}>{sw.seedTime}</span>
                                        </div>
                                      ))}
                                    </div>
                                  ))}
                                  {/* Entries list */}
                                  {ev.entries && ev.entries.length > 0 && (
                                    <div style={{ padding:"6px 16px 8px", borderTop:"1px solid rgba(0,174,239,0.08)" }}>
                                      <div style={{ fontSize:11, color:"#48cae4", fontWeight:700, marginBottom:4 }}>
                                        Entries ({ev.entries.length}) — click 🌱 Seed to assign heats/lanes
                                      </div>
                                      {ev.entries.map((en, idx) => (
                                        <div key={idx} style={{ display:"flex", gap:8, fontSize:12, color:"#e8f4fb", padding:"2px 0", alignItems:"center" }}>
                                          <span style={{ flex:1 }}>{en.name}</span>
                                          <span style={{ color:"#5a86a8", fontSize:11 }}>{en.team}</span>
                                          <span style={{ color:"#3a6080", width:60, textAlign:"right" }}>{en.seedTime || "NT"}</span>
                                          <button onClick={() => removeSwimmerEntry(ev.eventNum, idx)}
                                            style={{ background:"none", border:"none", color:"#f87171", cursor:"pointer", fontSize:14, padding:"0 4px" }}>×</button>
                                        </div>
                                      ))}
                                    </div>
                                  )}
                                  {/* Add-swimmer form */}
                                  {showAddForm && (
                                    <div style={{ padding:"10px 16px", borderTop:"1px solid rgba(0,174,239,0.1)", background:"rgba(0,174,239,0.04)" }}>
                                      {swimAthletes.length > 0 && (
                                        <div style={{ marginBottom:8 }}>
                                          <select onChange={e => {
                                            if (!e.target.value) return;
                                            const a = swimAthletes.find(x => x.id === e.target.value);
                                            if (a) setSwimNewSwimmerForm(f => ({ ...f, name: a.name, team: a.team }));
                                            e.target.value = "";
                                          }} style={{ ...S.input, marginBottom:0 }}>
                                            <option value="">— Pick from roster —</option>
                                            {swimAthletes.map(a => <option key={a.id} value={a.id}>{a.name} ({a.team || "no team"})</option>)}
                                          </select>
                                        </div>
                                      )}
                                      <div style={{ display:"flex", gap:6, flexWrap:"wrap" }}>
                                        <input placeholder="Name *" value={swimNewSwimmerForm.name}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, name:e.target.value}))}
                                          style={{ ...S.input, flex:2, minWidth:120, marginBottom:0 }} />
                                        <input placeholder="Team" value={swimNewSwimmerForm.team}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, team:e.target.value}))}
                                          style={{ ...S.input, flex:1, minWidth:80, marginBottom:0 }} />
                                        <input placeholder="Seed (1:23.45 or NT)" value={swimNewSwimmerForm.seedTime}
                                          onChange={e => setSwimNewSwimmerForm(f => ({...f, seedTime:e.target.value}))}
                                          style={{ ...S.input, flex:1, minWidth:100, marginBottom:0 }} />
                                        <button onClick={() => addSwimmerEntry(ev.eventNum)}
                                          disabled={!swimNewSwimmerForm.name.trim()}
