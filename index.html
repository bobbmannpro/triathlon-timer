                                          style={{ ...btnStyle("#00aeef"), padding:"8px 16px", fontSize:12, opacity: swimNewSwimmerForm.name.trim() ? 1 : 0.4 }}>
                                          Add
                                        </button>
                                      </div>
                                    </div>
                                  )}
                                </div>
                              );
                            })}
                          </div>
                        )}

                        {/* Add event manually */}
                        <div style={S.card}>
                          <button onClick={() => setSwimAddEventOpen(o => !o)}
                            style={{ ...btnStyle("#48cae4", true), fontSize:12, width:"100%" }}>
                            {swimAddEventOpen ? "✕ Cancel" : "+ Add Event Manually"}
                          </button>
                          {swimAddEventOpen && (
                            <div style={{ marginTop:12, display:"flex", flexDirection:"column", gap:8 }}>
                              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                <div style={{ flex:1, minWidth:120 }}>
                                  <div style={S.label}>Gender</div>
                                  <select value={swimNewEvent.gender} onChange={e => setSwimNewEvent(x => ({...x, gender:e.target.value}))}
                                    style={{...S.input}}>
                                    {["Girls","Boys","Mixed"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:120 }}>
                                  <div style={S.label}>Age Group</div>
                                  <select value={swimNewEvent.ageGroup} onChange={e => setSwimNewEvent(x => ({...x, ageGroup:e.target.value}))}
                                    style={{...S.input}}>
                                    {["8 & Under","9-10","11-12","13-14","15-18","Open"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:100 }}>
                                  <div style={S.label}>Distance</div>
                                  <select value={swimNewEvent.distance} onChange={e => setSwimNewEvent(x => ({...x, distance:parseInt(e.target.value)}))}
                                    style={{...S.input}}>
                                    {[25,50,100,200,400,500,800,1000,1500,1650].map(d => <option key={d} value={d}>{d}</option>)}
                                  </select>
                                </div>
                              </div>
                              <div style={{ display:"flex", gap:8, flexWrap:"wrap" }}>
                                <div style={{ flex:2, minWidth:150 }}>
                                  <div style={S.label}>Stroke</div>
                                  <select value={swimNewEvent.stroke} onChange={e => setSwimNewEvent(x => ({...x, stroke:e.target.value}))}
                                    style={{...S.input}}>
                                    {["Freestyle","Backstroke","Breaststroke","Butterfly","IM","Freestyle Relay","Medley Relay"].map(s => <option key={s} value={s}>{s}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1, minWidth:80 }}>
                                  <div style={S.label}>Heats</div>
                                  <input type="number" min={1} max={99} value={swimNewEvent.heats}
                                    onChange={e => setSwimNewEvent(x => ({...x, heats:parseInt(e.target.value)||1}))}
                                    style={{...S.input}} />
                                </div>
                                <div style={{ flex:1, minWidth:80 }}>
                                  <div style={S.label}>Lanes</div>
                                  <input type="number" min={1} max={10} value={swimNewEvent.lanes}
                                    onChange={e => setSwimNewEvent(x => ({...x, lanes:parseInt(e.target.value)||8}))}
                                    style={{...S.input}} />
                                </div>
                              </div>
                              <button style={{ ...btnStyle("#00aeef"), fontSize:13 }}
                                onClick={() => {
                                  const nextNum = swimMeet.events.length > 0 ? Math.max(...swimMeet.events.map(e => e.eventNum)) + 1 : 1;
                                  const heats = Array.from({length: swimNewEvent.heats}, (_, hi) => ({
                                    heatNum: hi + 1,
                                    lanes: Array.from({length: swimNewEvent.lanes}, (_, li) => ({
                                      lane: li + 1, lastName:"", firstName:"", name:"", age:0, team:"", seedTime:"NT", seedMs:null, finalMs:null, dq:false, scratch:false
                                    }))
                                  }));
                                  setSwimMeet(m => ({...m, events: [...m.events, { eventNum:nextNum, gender:swimNewEvent.gender, ageGroup:swimNewEvent.ageGroup, distance:swimNewEvent.distance, stroke:swimNewEvent.stroke, course:m.pool, heats }]}));
                                  setSwimAddEventOpen(false);
                                }}>
                                Add Event
                              </button>
                            </div>
                          )}
                        </div>

                        {/* ── Meet Roster ── */}
                        <div style={S.card}>
                          <div style={{ display:"flex", alignItems:"center", justifyContent:"space-between", marginBottom: swimRosterOpen || (swimMeet.meetEntries||[]).length > 0 ? 10 : 0 }}>
                            <div style={S.label}>Meet Roster {(swimMeet.meetEntries||[]).length > 0 ? `(${swimMeet.meetEntries.length})` : ""}</div>
                            <div style={{ display:"flex", gap:8 }}>
                              {(swimMeet.meetEntries||[]).length > 0 && swimMeet.events.length > 0 && (
                                <button onClick={autoSeedFromRoster}
                                  style={{ fontSize:11, color:"#48cae4", background:"none", border:"none", cursor:"pointer" }}>🌱 Seed from Roster</button>
                              )}
                              <button onClick={() => { setSwimRosterOpen(o => !o); setSwimRosterEditId(null); setSwimNewEntry({ name:"", team:"", age:"", gender:"Girls", ageGroup:"Open", events:{} }); }}
                                style={{ fontSize:11, color:"#00aeef", background:"none", border:"none", cursor:"pointer" }}>
                                {swimRosterOpen ? "✕ Cancel" : "+ Add Swimmer"}
                              </button>
                            </div>
                          </div>

                          {/* Roster list */}
                          {(swimMeet.meetEntries||[]).map(s => (
                            <div key={s.id} style={{ display:"flex", gap:8, padding:"7px 0", alignItems:"flex-start", borderBottom:"1px solid rgba(0,174,239,0.06)" }}>
                              <div style={{ flex:1 }}>
                                <span style={{ fontSize:13, color:"#e8f4fb", fontWeight:600 }}>{s.name}</span>
                                {s.team ? <span style={{ fontSize:11, color:"#5a86a8", marginLeft:8 }}>{s.team}</span> : null}
                                {s.age ? <span style={{ fontSize:11, color:"#3a6080", marginLeft:6 }}>age {s.age}</span> : null}
                                <div style={{ fontSize:11, color:"#3a6080", marginTop:2 }}>
                                  {s.events.length > 0
                                    ? `Events: ${s.events.map(e => `${e.eventNum} (${e.seedTime})`).join(", ")}`
                                    : <span style={{ color:"#f87171" }}>No events selected</span>}
                                </div>
                              </div>
                              <button onClick={() => {
                                const evts = {};
                                s.events.forEach(e => { evts[e.eventNum] = { checked:true, seedTime: e.seedTime === "NT" ? "" : e.seedTime }; });
                                setSwimNewEntry({ name:s.name, team:s.team, age:String(s.age||""), gender:s.gender||"Girls", ageGroup:s.ageGroup||"Open", events:evts });
                                setSwimRosterEditId(s.id);
                                setSwimRosterOpen(true);
                              }} style={{ background:"none", border:"none", color:"#5a86a8", cursor:"pointer", fontSize:12, padding:"2px 4px" }}>✏️</button>
                              <button onClick={() => removeMeetEntry(s.id)}
                                style={{ background:"none", border:"none", color:"#f87171", cursor:"pointer", fontSize:16, padding:"0 4px" }}>×</button>
                            </div>
                          ))}

                          {/* Add / edit form */}
                          {swimRosterOpen && (
                            <div style={{ marginTop:10, padding:"12px", background:"rgba(0,174,239,0.04)", borderRadius:6, border:"1px solid rgba(0,174,239,0.1)" }}>
                              {/* Pick from global roster */}
                              {swimAthletes.length > 0 && !swimRosterEditId && (
                                <div style={{ marginBottom:8 }}>
                                  <select onChange={e => {
                                    if (!e.target.value) return;
                                    const a = swimAthletes.find(x => x.id === e.target.value);
                                    if (a) {
                                      // Auto-fill seed times from athlete's personal bests for any already-checked events
                                      const updatedEvts = {};
                                      Object.entries(swimNewEntry.events).forEach(([evNum, val]) => {
                                        const meetEv = swimMeet.events.find(ev => ev.eventNum === parseInt(evNum));
                                        const pb = meetEv && (a.personalBests||{})[eventKey(meetEv)];
                                        updatedEvts[evNum] = val.checked ? { ...val, seedTime: pb ? pb.time : (val.seedTime||"") } : val;
                                      });
                                      setSwimNewEntry(f => ({ ...f, name:a.name, team:a.team||"", gender:a.gender||"Girls", ageGroup:a.ageGroup||"Open", age:String(a.age||""), athleteId:a.id, events:updatedEvts }));
                                    }
                                    e.target.value = "";
                                  }} style={{ ...S.input, marginBottom:0 }}>
                                    <option value="">— Pick from athlete roster —</option>
                                    {swimAthletes.map(a => <option key={a.id} value={a.id}>{a.name} ({a.team || "no team"})</option>)}
                                  </select>
                                </div>
                              )}
                              {/* Swimmer info */}
                              <div style={{ display:"flex", gap:6, flexWrap:"wrap", marginBottom:8 }}>
                                <input placeholder="Full name *" value={swimNewEntry.name}
                                  onChange={e => setSwimNewEntry(f => ({...f, name:e.target.value, athleteId:null}))}
                                  style={{ ...S.input, flex:2, minWidth:140, marginBottom:0 }} />
                                <input placeholder="Team" value={swimNewEntry.team}
                                  onChange={e => setSwimNewEntry(f => ({...f, team:e.target.value}))}
                                  style={{ ...S.input, flex:1, minWidth:90, marginBottom:0 }} />
                                <input placeholder="Age" type="number" min={1} max={99} value={swimNewEntry.age}
                                  onChange={e => setSwimNewEntry(f => ({...f, age:e.target.value}))}
                                  style={{ ...S.input, width:60, marginBottom:0 }} />
                                <select value={swimNewEntry.gender} onChange={e => setSwimNewEntry(f => ({...f, gender:e.target.value}))}
                                  style={{ ...S.input, marginBottom:0 }}>
                                  {["Girls","Boys","Mixed"].map(g => <option key={g} value={g}>{g}</option>)}
                                </select>
                              </div>
                              {/* Event entries */}
                              {swimMeet.events.length > 0 ? (
                                <div style={{ marginBottom:8 }}>
                                  <div style={{ ...S.label, marginBottom:6 }}>Events &amp; Seed Times</div>
                                  {swimMeet.events.map(ev => {
                                    const checked = !!(swimNewEntry.events[ev.eventNum]?.checked);
                                    const seedVal = swimNewEntry.events[ev.eventNum]?.seedTime || "";
                                    return (
                                      <div key={ev.eventNum} style={{ display:"flex", gap:8, alignItems:"center", padding:"4px 0", borderBottom:"1px solid rgba(0,174,239,0.04)" }}>
                                        <input type="checkbox" checked={checked}
                                          onChange={e => {
                                            // Auto-fill seed time from PB when checking an event
                                            let autoSeed = "";
                                            if (e.target.checked && swimNewEntry.athleteId) {
                                              const ath = swimAthletes.find(a => a.id === swimNewEntry.athleteId);
                                              const pb = ath && (ath.personalBests||{})[eventKey(ev)];
                                              if (pb) autoSeed = pb.time;
                                            }
                                            setSwimNewEntry(f => ({
                                              ...f,
                                              events: { ...f.events, [ev.eventNum]: { ...(f.events[ev.eventNum]||{}), checked:e.target.checked, seedTime: e.target.checked ? (autoSeed || f.events[ev.eventNum]?.seedTime || "") : "" } }
                                            }));
                                          }} style={{ accentColor:"#00aeef", width:16, height:16, cursor:"pointer" }} />
                                        <span style={{ fontSize:12, color: checked ? "#e8f4fb" : "#5a86a8", flex:1 }}>
                                          <span style={{ color:"#00aeef", marginRight:4 }}>#{ev.eventNum}</span>
                                          {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}
                                        </span>
                                        {checked && (
                                          <input placeholder="Seed time (NT or 1:23.45)" value={seedVal}
                                            onChange={e => setSwimNewEntry(f => ({
                                              ...f,
                                              events: { ...f.events, [ev.eventNum]: { ...(f.events[ev.eventNum]||{}), seedTime:e.target.value } }
                                            }))}
                                            style={{ ...S.input, width:140, marginBottom:0, fontSize:11 }} />
                                        )}
                                      </div>
                                    );
                                  })}
                                </div>
                              ) : (
                                <div style={{ fontSize:11, color:"#5a86a8", marginBottom:8 }}>Add events first, then assign them here.</div>
                              )}
                              <button onClick={addToMeetRoster} disabled={!swimNewEntry.name.trim()}
                                style={{ ...btnStyle("#00aeef"), padding:"8px 20px", fontSize:12, opacity: swimNewEntry.name.trim() ? 1 : 0.4 }}>
                                {swimRosterEditId ? "Save Changes" : "Add to Meet"}
                              </button>
                            </div>
                          )}
                        </div>

                        {/* Save meet to archive */}
                        {swimMeet.events.length > 0 && (
                          <div style={{ display:"flex", gap:8, marginTop:4 }}>
                            <button style={{ ...btnStyle("#48cae4"), padding:"8px 18px", fontSize:12 }}
                              onClick={() => { saveCurentMeet(); alert("Meet saved!"); }}>
                              💾 Save Meet
                            </button>
                            <button style={{ ...btnStyle("#ffd166"), flex:1 }}
                              onClick={() => { persistSwimArchive(swimMeet); alert("Meet saved to archive!"); }}>
                              💾 Save Meet to Archive
                            </button>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── RACE ── */}
                    {swimView === "race" && (
                      <div>
                        {!activeEv || !activeHt ? (
                          <div style={{ textAlign:"center", padding:"40px 0" }}>
                            <div style={{ color:"#5a86a8", marginBottom:16 }}>No heat selected. Go to Setup to start a heat.</div>
                            <button style={btnStyle("#48cae4")} onClick={() => setSwimView("setup")}>← Back to Setup</button>
                          </div>
                        ) : (
                          <div>
                            {/* Event / heat header */}
                            <div style={{ ...S.card, marginBottom:10 }}>
                              <div style={{ fontSize:11, color:"#5a86a8", fontWeight:700, letterSpacing:2, textTransform:"uppercase" }}>
                                Event {activeEv.eventNum} &mdash; {activeEv.gender} {activeEv.ageGroup} {activeEv.distance} {activeEv.stroke}
                              </div>
                              <div style={{ fontSize:13, color:"#48cae4", marginTop:2 }}>
                                Heat {heatIndex + 1} of {totalHeats}
                              </div>
                            </div>

                            {/* Clock */}
                            <div style={{ background:"#071829", border:"2px solid rgba(0,174,239,0.4)", borderRadius:12, padding:"20px 16px", textAlign:"center", marginBottom:14 }}>
                              <div style={{ fontSize:52, fontWeight:700, letterSpacing:2, color: swimClockRunning ? "#00aeef" : "#e8f4fb", fontVariantNumeric:"tabular-nums" }}>
                                {formatSwimTime(swimClockMs)}
                              </div>
                              <div style={{ display:"flex", gap:10, justifyContent:"center", marginTop:12 }}>
                                {!swimClockStarted ? (
                                  <button onClick={() => {
                                    setSwimClockStarted(true);
                                    setSwimClockRunning(true);
                                    if (swimLiveCode) {
                                      rtdb.ref(`swimLive/${swimLiveCode}`).update({
                                        status: "racing",
                                        startedAt: Date.now(),
                                        activeEvent: swimActiveEvent,
                                        activeHeat: swimActiveHeat,
                                        results: null,
                                      }).catch(console.error);
                                    }
                                  }} style={{ ...btnStyle("#00aeef"), fontSize:16, padding:"12px 40px", letterSpacing:2 }}>
                                    ▶ START ALL
                                  </button>
                                ) : (
                                  <>
                                    <button onClick={() => setSwimClockRunning(r => !r)}
                                      style={{ ...btnStyle(swimClockRunning ? "#ffd166" : "#00aeef"), fontSize:13, padding:"8px 20px" }}>
                                      {swimClockRunning ? "⏸ Pause" : "▶ Resume"}
                                    </button>
                                    <button onClick={resetSwimClock}
                                      style={{ ...btnStyle("#f87171", true), fontSize:13, padding:"8px 16px" }}>
                                      ↺ Reset
                                    </button>
                                  </>
                                )}
                              </div>
                            </div>

                            {/* Live Session panel */}
                            <div style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.25)", borderRadius:8, padding:"12px 14px", marginBottom:14 }}>
                              <div style={{ fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:8 }}>📡 Live Session</div>
                              {!swimLiveCode ? (
                                <button style={{ ...btnStyle("#48cae4"), fontSize:12, padding:"8px 20px" }} onClick={() => {
                                  const savedMeet = swimSavedMeets.find(m => m.id === swimMeet._id);
                                  if (!swimMeet._id || !savedMeet) { setSwimShowSaveBefore(true); return; }
                                  const code = savedMeet.code || generateSwimCode();
                                  if (!savedMeet.code) persistSwimMeets(swimSavedMeets.map(m => m.id === swimMeet._id ? { ...m, code } : m));
                                  rtdb.ref(`swimLive/${code}`).set({
                                    meetName: swimMeet.meetName || "Unnamed Meet",
                                    pool: swimMeet.pool,
                                    activeEvent: swimActiveEvent,
                                    activeHeat: swimActiveHeat,
                                    status: "waiting",
                                    startedAt: null,
                                    events: swimMeet.events,
                                    results: null,
                                    heatResults: null,
                                  }).catch(console.error);
                                  setSwimLiveCode(code);
                                }}>
                                  Start Live Session
                                </button>
                              ) : (
                                <div>
                                  <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap", marginBottom:6 }}>
                                    <span style={{ fontSize:11, color:"#5a86a8" }}>Code:</span>
                                    <span style={{ fontSize:24, fontWeight:700, letterSpacing:5, color:"#00aeef", fontFamily:"monospace" }}>{swimLiveCode}</span>
                                    <button style={{ ...btnStyle("#48cae4", true), padding:"4px 10px", fontSize:11 }} onClick={() => navigator.clipboard?.writeText(swimLiveCode).catch(() => {})}>
                                      📋 Copy
                                    </button>
                                    <button style={{ ...btnStyle("#f87171", true), padding:"4px 10px", fontSize:11 }} onClick={() => {
                                      rtdb.ref(`swimLive/${swimLiveCode}`).remove().catch(console.error);
                                      setSwimLiveCode(null);
                                    }}>
                                      Stop
                                    </button>
                                  </div>
                                  <div style={{ fontSize:11, color:"#5a86a8" }}>Lane operators: open app → 🏁 Lane tab → enter this code</div>
                                </div>
                              )}
                            </div>

                            {/* Lane cards */}
                            {activeHt.lanes.sort((a,b) => a.lane - b.lane).map(sw => {
                              const finished = sw.finalMs != null;
                              const isDq = sw.dq;
                              return (
                                <div key={sw.lane} style={{ background: finished ? "rgba(0,174,239,0.07)" : "#0c2240", border: `1px solid ${swimHostClickerDetecting === sw.lane ? "#ffd166" : finished ? "rgba(0,174,239,0.4)" : isDq ? "rgba(248,113,113,0.3)" : "rgba(0,174,239,0.15)"}`, borderRadius:8, padding:"12px 14px", marginBottom:8 }}>
                                  <div style={{ display:"flex", alignItems:"center", gap:10, marginBottom:8 }}>
                                    <div style={{ background:"rgba(0,174,239,0.15)", borderRadius:4, padding:"4px 10px", fontSize:12, fontWeight:700, color:"#48cae4" }}>
                                      Lane {sw.lane}
                                    </div>
                                    <div style={{ flex:1 }}>
                                      <div style={{ fontSize:14, fontWeight:600, color: isDq ? "#f87171" : "#e8f4fb" }}>
                                        {sw.name || "(Empty Lane)"} {isDq && <span style={{ fontSize:11, color:"#f87171" }}>DQ</span>}
                                      </div>
                                      <div style={{ fontSize:11, color:"#5a86a8" }}>{sw.team}{sw.age ? ` · Age ${sw.age}` : ""}{sw.seedTime && sw.seedTime !== "NT" ? ` · Seed: ${sw.seedTime}` : ""}</div>
                                    </div>
                                    {(() => {
                                      const assigned = swimHostClickers.find(c => c.lane === sw.lane);
                                      const detecting = swimHostClickerDetecting === sw.lane;
                                      if (detecting) return (
                                        <div style={{ fontSize:11, color:"#ffd166", fontWeight:700, whiteSpace:"nowrap" }}>⏳ Press clicker… (Esc to cancel)</div>
                                      );
                                      if (assigned) return (
                                        <div style={{ display:"flex", alignItems:"center", gap:4 }}>
                                          <span style={{ background:"rgba(0,174,239,0.15)", border:"1px solid rgba(0,174,239,0.4)", borderRadius:4, padding:"2px 8px", fontSize:11, color:"#48cae4", fontFamily:"monospace" }}>
                                            🎯 {assigned.key === " " ? "Space" : assigned.key}
                                          </span>
                                          <button onClick={() => setSwimHostClickers(cs => cs.filter(c => c.lane !== sw.lane))}
                                            style={{ background:"none", border:"none", color:"#5a86a8", cursor:"pointer", fontSize:14, lineHeight:1, padding:"0 2px" }}>×</button>
                                        </div>
                                      );
                                      return (
                                        <button onClick={() => setSwimHostClickerDetecting(sw.lane)}
                                          style={{ background:"none", border:"1px dashed rgba(0,174,239,0.3)", borderRadius:4, padding:"2px 8px", fontSize:11, color:"#5a86a8", cursor:"pointer", whiteSpace:"nowrap" }}>
                                          🎯 +
                                        </button>
                                      );
                                    })()}
                                    <div style={{ fontSize:20, fontWeight:700, fontVariantNumeric:"tabular-nums", color: finished ? "#00aeef" : "#3a6080" }}>
                                      {finished ? formatSwimTime(sw.finalMs) : "--:--.--"}
                                    </div>
                                  </div>
                                  <div style={{ display:"flex", gap:8 }}>
                                    <button
                                      onClick={() => { if (!sw.scratch) recordFinish(activeEv.eventNum, activeHt.heatNum, sw.lane); }}
                                      disabled={sw.scratch || isDq}
                                      style={{ flex:1, padding:"10px", fontSize:13, fontWeight:700, letterSpacing:1, borderRadius:6, cursor: sw.scratch || isDq ? "default" : "pointer", background: finished ? "rgba(0,174,239,0.2)" : "rgba(0,174,239,0.1)", border: `2px solid ${finished ? "#00aeef" : "rgba(0,174,239,0.3)"}`, color: finished ? "#00aeef" : "#e8f4fb", opacity: sw.scratch || isDq ? 0.4 : 1 }}>
                                      {finished ? `✓ ${formatSwimTime(sw.finalMs)}` : "FINISH"}
                                    </button>
                                    <button onClick={() => toggleDq(activeEv.eventNum, activeHt.heatNum, sw.lane)}
                                      style={{ padding:"10px 14px", fontSize:12, fontWeight:700, borderRadius:6, cursor:"pointer", background: isDq ? "rgba(248,113,113,0.2)" : "transparent", border:`1px solid ${isDq ? "#f87171" : "rgba(248,113,113,0.3)"}`, color: isDq ? "#f87171" : "#5a86a8" }}>
                                      DQ
                                    </button>
                                    <button onClick={() => setSwimMeet(m => ({...m, events: m.events.map(ev => ev.eventNum !== activeEv.eventNum ? ev : { ...ev, heats: ev.heats.map(h => h.heatNum !== activeHt.heatNum ? h : { ...h, lanes: h.lanes.map(s => s.lane !== sw.lane ? s : {...s, scratch: !s.scratch, finalMs: null}) }) }) }))}
                                      style={{ padding:"10px 10px", fontSize:11, fontWeight:700, borderRadius:6, cursor:"pointer", background: sw.scratch ? "rgba(255,209,102,0.15)" : "transparent", border:`1px solid ${sw.scratch ? "rgba(255,209,102,0.5)" : "rgba(255,255,255,0.1)"}`, color: sw.scratch ? "#ffd166" : "#5a86a8" }}>
                                      SCR
                                    </button>
                                  </div>
                                </div>
                              );
                            })}

                            {/* Footer buttons */}
                            <div style={{ display:"flex", gap:10, marginTop:16 }}>
                              <button onClick={() => { setSwimView("setup"); }}
                                style={{ ...btnStyle("#48cae4", true), flex:1, fontSize:12 }}>
                                ← Back to Setup
                              </button>
                              <button onClick={saveAndAdvance}
                                style={{ ...btnStyle("#00aeef"), flex:2, fontSize:13 }}>
                                Save &amp; Next Heat →
                              </button>
                            </div>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── RESULTS ── */}
                    {swimView === "results" && (
                      <div>
                        {swimMeet.events.length === 0 ? (
                          <div style={{ textAlign:"center", padding:"40px 0", color:"#5a86a8" }}>No events. Import or create events in Setup.</div>
                        ) : (
                          <div>
                            {/* Event selector */}
                            <div style={S.card}>
                              <div style={S.label}>Select Event</div>
                              <select value={swimResultsEvent || ""} onChange={e => setSwimResultsEvent(parseInt(e.target.value))}
                                style={{...S.input}}>
                                <option value="">-- choose event --</option>
                                {swimMeet.events.map(ev => (
                                  <option key={ev.eventNum} value={ev.eventNum}>
                                    Event {ev.eventNum} — {ev.gender} {ev.ageGroup} {ev.distance} {ev.stroke}
                                  </option>
                                ))}
                              </select>
                            </div>

                            {/* Results tabs */}
                            <div style={{ display:"flex", gap:6, marginBottom:12 }}>
                              <button style={swimTabStyle(swimResultsTab === "results")} onClick={() => setSwimResultsTab("results")}>Event Results</button>
                              <button style={swimTabStyle(swimResultsTab === "scores")} onClick={() => setSwimResultsTab("scores")}>Team Scores</button>
                            </div>

                            {swimResultsTab === "results" && (() => {
                              const selEv = swimMeet.events.find(e => e.eventNum === swimResultsEvent);
                              if (!selEv) return <div style={{ color:"#5a86a8", textAlign:"center", padding:24 }}>Select an event above to view results.</div>;

                              const allSwimmers = selEv.heats.flatMap(h => h.lanes.map(sw => ({...sw, heatNum: h.heatNum})));
                              const finishers = allSwimmers.filter(s => s.finalMs != null && !s.dq && !s.scratch).sort((a,b) => a.finalMs - b.finalMs);
                              const dqs = allSwimmers.filter(s => s.dq);
                              const scratches = allSwimmers.filter(s => s.scratch && !s.dq);
                              const dnf = allSwimmers.filter(s => s.finalMs == null && !s.dq && !s.scratch);
                              const pts = [6,4,3,2,1];

                              return (
                                <div>
                                  {/* Heat breakdown */}
                                  {selEv.heats.map(ht => {
                                    const heatSwimmers = ht.lanes.slice().sort((a,b) => {
                                      if (a.finalMs != null && b.finalMs != null) return a.finalMs - b.finalMs;
                                      if (a.finalMs != null) return -1;
                                      return 1;
                                    });
                                    return (
                                      <div key={ht.heatNum} style={{ ...S.card, marginBottom:8 }}>
                                        <div style={{ fontSize:12, fontWeight:700, color:"#48cae4", marginBottom:8 }}>Heat {ht.heatNum}</div>
                                        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                                          <thead>
                                            <tr>
                                              {["Ln","Name","Age","Team","Seed","Final"].map(h => (
                                                <th key={h} style={{ textAlign: h === "Ln" || h === "Age" ? "center" : "left", padding:"4px 6px", color:"#5a86a8", fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"1px solid rgba(0,174,239,0.12)" }}>{h}</th>
                                              ))}
                                            </tr>
                                          </thead>
                                          <tbody>
                                            {heatSwimmers.map(sw => (
                                              <tr key={sw.lane}>
                                                <td style={{ textAlign:"center", padding:"5px 6px", color:"#48cae4" }}>{sw.lane}</td>
                                                <td style={{ padding:"5px 6px", color: sw.dq ? "#f87171" : "#e8f4fb" }}>{sw.name || "—"}{sw.dq ? " DQ" : sw.scratch ? " SCR" : ""}</td>
                                                <td style={{ textAlign:"center", padding:"5px 6px", color:"#5a86a8" }}>{sw.age || ""}</td>
                                                <td style={{ padding:"5px 6px", color:"#5a86a8" }}>{sw.team}</td>
                                                <td style={{ padding:"5px 6px", color:"#3a6080" }}>{sw.seedTime || "NT"}</td>
                                                <td style={{ padding:"5px 6px", fontWeight: sw.finalMs != null && !sw.dq ? 700 : 400, color: sw.dq ? "#f87171" : sw.finalMs != null ? "#00aeef" : "#3a6080" }}>
                                                  {sw.dq ? "DQ" : sw.scratch ? "SCR" : sw.finalMs != null ? formatSwimTime(sw.finalMs) : "--"}
                                                </td>
                                              </tr>
                                            ))}
                                          </tbody>
                                        </table>
                                      </div>
                                    );
                                  })}

                                  {/* Overall standings */}
                                  <div style={{ ...S.card }}>
                                    <div style={{ fontSize:12, fontWeight:700, color:"#ffd166", marginBottom:8 }}>Overall Event Standings</div>
                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:12 }}>
                                      <thead>
                                        <tr>
                                          {["Pl","Name","Age","Team","Seed","Final","Pts"].map(h => (
                                            <th key={h} style={{ textAlign: ["Pl","Age","Pts"].includes(h) ? "center" : "left", padding:"4px 6px", color:"#5a86a8", fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"1px solid rgba(0,174,239,0.12)" }}>{h}</th>
                                          ))}
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {finishers.map((sw, i) => (
                                          <tr key={`${sw.heatNum}-${sw.lane}`} style={{ background: i % 2 === 0 ? "transparent" : "rgba(0,174,239,0.03)" }}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", fontWeight:700, color: i === 0 ? "#ffd166" : i === 1 ? "#c0c0c0" : i === 2 ? "#cd7f32" : "#e8f4fb" }}>{i+1}</td>
                                            <td style={{ padding:"5px 6px", color:"#e8f4fb" }}>{sw.name}</td>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#5a86a8" }}>{sw.age}</td>
                                            <td style={{ padding:"5px 6px", color:"#5a86a8" }}>{sw.team}</td>
                                            <td style={{ padding:"5px 6px", color:"#3a6080" }}>{sw.seedTime || "NT"}</td>
                                            <td style={{ padding:"5px 6px", fontWeight:700, color:"#00aeef" }}>{formatSwimTime(sw.finalMs)}</td>
                                            <td style={{ textAlign:"center", padding:"5px 6px", fontWeight:700, color:"#ffd166" }}>{i < pts.length ? pts[i] : ""}</td>
                                          </tr>
                                        ))}
                                        {dqs.map(sw => (
                                          <tr key={`dq-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#f87171" }}>DQ</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#f87171" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                        {scratches.map(sw => (
                                          <tr key={`scr-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#5a86a8" }}>SCR</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#5a86a8" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                        {dnf.map(sw => (
                                          <tr key={`dnf-${sw.heatNum}-${sw.lane}`}>
                                            <td style={{ textAlign:"center", padding:"5px 6px", color:"#3a6080" }}>—</td>
                                            <td colSpan={5} style={{ padding:"5px 6px", color:"#3a6080" }}>{sw.name} — {sw.team}</td>
                                            <td></td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  </div>

                                  {/* Print buttons */}
                                  <div style={{ display:"flex", gap:8, marginTop:8 }}>
                                    <button style={{ ...btnStyle("#5a86a8", true), flex:1, fontSize:12 }}
                                      onClick={() => printSwimResults(selEv, swimMeet.meetName)}>
                                      🖨 Print Results
                                    </button>
                                    <button style={{ ...btnStyle("#ffd166", true), flex:1, fontSize:12 }}
                                      onClick={() => printRibbonLabels(selEv, swimMeet.meetName)}>
                                      🏷 Print Ribbon Labels
                                    </button>
                                  </div>
                                </div>
                              );
                            })()}

                            {swimResultsTab === "scores" && (() => {
                              const teamScores = computeTeamScores(swimMeet.events);
                              return (
                                <div style={S.card}>
                                  <div style={{ fontSize:12, fontWeight:700, color:"#ffd166", marginBottom:12 }}>Team Scores — All Events</div>
                                  {teamScores.length === 0 ? (
                                    <div style={{ color:"#3a6080", fontSize:12 }}>No results recorded yet.</div>
                                  ) : (
                                    <table style={{ width:"100%", borderCollapse:"collapse", fontSize:13 }}>
                                      <thead>
                                        <tr>
                                          <th style={{ textAlign:"left", padding:"6px 8px", color:"#5a86a8", fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"1px solid rgba(0,174,239,0.12)" }}>Team</th>
                                          <th style={{ textAlign:"right", padding:"6px 8px", color:"#5a86a8", fontSize:10, fontWeight:700, letterSpacing:1, textTransform:"uppercase", borderBottom:"1px solid rgba(0,174,239,0.12)" }}>Points</th>
                                        </tr>
                                      </thead>
                                      <tbody>
                                        {teamScores.map(([team, pts], i) => (
                                          <tr key={team} style={{ background: i === 0 ? "rgba(255,209,102,0.05)" : "transparent" }}>
                                            <td style={{ padding:"8px 8px", color: i === 0 ? "#ffd166" : "#e8f4fb", fontWeight: i === 0 ? 700 : 400 }}>
                                              {i === 0 ? "🏆 " : `${i+1}. `}{team}
                                            </td>
                                            <td style={{ padding:"8px 8px", textAlign:"right", fontWeight:700, color: i === 0 ? "#ffd166" : "#e8f4fb" }}>{pts}</td>
                                          </tr>
                                        ))}
                                      </tbody>
                                    </table>
                                  )}
                                </div>
                              );
                            })()}

                            <button style={{ ...btnStyle("#ffd166"), width:"100%", marginTop:8 }}
                              onClick={() => { persistSwimArchive(swimMeet); alert("Meet saved to archive!"); }}>
                              💾 Save Meet to Archive
                            </button>
                          </div>
                        )}
                      </div>
                    )}

                    {/* ── DEVICES ── */}
                    {swimView === "devices" && (
                      <div>
                        {/* Clicker Assignments */}
                        <div style={S.card}>
                          <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:10 }}>📡 Clicker Assignments</div>
                          {swimHostClickers.length === 0 ? (
                            <div style={{ fontSize:13, color:"#5a86a8", marginBottom:10 }}>No clickers assigned yet.</div>
                          ) : (
                            <div style={{ display:"flex", flexDirection:"column", gap:6, marginBottom:10 }}>
                              {swimHostClickers.map(c => (
                                <div key={c.lane} style={{ display:"flex", alignItems:"center", gap:10, background:"#071829", borderRadius:6, padding:"8px 12px" }}>
                                  <span style={{ fontSize:12, color:"#5a86a8", width:60 }}>Lane {c.lane}</span>
                                  <span style={{ background:"rgba(0,174,239,0.15)", border:"1px solid rgba(0,174,239,0.4)", borderRadius:4, padding:"2px 10px", fontFamily:"monospace", fontSize:13, color:"#48cae4" }}>
                                    🎯 {c.key === " " ? "Space" : c.key}
                                  </span>
                                  <button onClick={() => setSwimHostClickers(cs => cs.filter(x => x.lane !== c.lane))}
                                    style={{ marginLeft:"auto", background:"none", border:"none", color:"#f87171", cursor:"pointer", fontSize:16, lineHeight:1 }}>×</button>
                                </div>
                              ))}
                            </div>
                          )}
                          <div style={{ fontSize:12, color:"#5a86a8", marginTop:4 }}>
                            To assign a clicker, go to <strong style={{ color:"#48cae4" }}>🏁 Race</strong> tab and tap <strong style={{ color:"#48cae4" }}>🎯 +</strong> on any lane card.
                          </div>
                        </div>

                        {/* Lane Timer (remote phones) */}
                        <div style={S.card}>
                          <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:10 }}>🏁 Lane Timer Devices</div>
                          {swimLiveCode ? (
                            <div>
                              <div style={{ fontSize:13, color:"#e8f4fb", marginBottom:6 }}>Share this code with lane operators:</div>
                              <div style={{ display:"flex", alignItems:"center", gap:10, flexWrap:"wrap" }}>
                                <span style={{ fontSize:28, fontWeight:700, letterSpacing:6, color:"#00aeef", fontFamily:"monospace" }}>{swimLiveCode}</span>
                                <button style={{ ...btnStyle("#48cae4", true), padding:"5px 12px", fontSize:11 }} onClick={() => navigator.clipboard?.writeText(swimLiveCode).catch(() => {})}>
                                  📋 Copy
                                </button>
                              </div>
                              <div style={{ fontSize:12, color:"#5a86a8", marginTop:8 }}>
                                Lane operators: open this app → 👀 Watch tab → enter this code → select their lane.
                              </div>
                            </div>
                          ) : (
                            <div style={{ fontSize:13, color:"#5a86a8" }}>
                              No live session active. Start a session from the <strong style={{ color:"#48cae4" }}>🏁 Race</strong> tab to share a code with lane timer operators.
                            </div>
                          )}
                        </div>
                      </div>
                    )}

                    {swimView === "athletes" && (
                      <div style={{ padding:"10px 0 20px" }}>
                        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                          <div style={{ fontSize:18, fontWeight:700, color:"#e8f4fb" }}>👥 Swim Teams</div>
                          <button style={{ ...btnStyle("#4ade80"), padding:"7px 16px", fontSize:12 }}
                            onClick={() => setSwimAthleteView(swimAthleteView === "add" ? "list" : "add")}>
                            {swimAthleteView === "add" ? "✕ Cancel" : "+ Add Swimmer"}
                          </button>
                        </div>

                        {swimAthleteView === "add" && (
                          <div style={{ background:"#0c2240", border:"1px solid rgba(72,202,228,0.25)", borderRadius:10, padding:"16px", marginBottom:16 }}>
                            <div style={{ display:"flex", flexDirection:"column", gap:10 }}>
                              <div>
                                <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3, letterSpacing:2, textTransform:"uppercase" }}>Full Name</div>
                                <input value={swimNewAthlete.name} onChange={e => setSwimNewAthlete(a => ({ ...a, name: e.target.value }))}
                                  placeholder="First Last" style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 12px", color:"#e8f4fb", fontSize:14, outline:"none", width:"100%", boxSizing:"border-box" }} />
                              </div>
                              <div>
                                <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3, letterSpacing:2, textTransform:"uppercase" }}>Team</div>
                                <input value={swimNewAthlete.team} onChange={e => setSwimNewAthlete(a => ({ ...a, team: e.target.value }))}
                                  placeholder="Team name" style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 12px", color:"#e8f4fb", fontSize:14, outline:"none", width:"100%", boxSizing:"border-box" }} />
                              </div>
                              <div style={{ display:"flex", gap:10 }}>
                                <div style={{ flex:1 }}>
                                  <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3, letterSpacing:2, textTransform:"uppercase" }}>Age</div>
                                  <input type="number" min={1} max={99} value={swimNewAthlete.age||""} onChange={e => setSwimNewAthlete(a => ({ ...a, age: e.target.value }))}
                                    placeholder="Age" style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 10px", color:"#e8f4fb", fontSize:13, outline:"none", width:"100%", boxSizing:"border-box" }} />
                                </div>
                                <div style={{ flex:1 }}>
                                  <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3, letterSpacing:2, textTransform:"uppercase" }}>Gender</div>
                                  <select value={swimNewAthlete.gender} onChange={e => setSwimNewAthlete(a => ({ ...a, gender: e.target.value }))}
                                    style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 10px", color:"#e8f4fb", fontSize:13, outline:"none", width:"100%" }}>
                                    {["Girls","Boys","Mixed"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                                <div style={{ flex:1 }}>
                                  <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3, letterSpacing:2, textTransform:"uppercase" }}>Age Group</div>
                                  <select value={swimNewAthlete.ageGroup} onChange={e => setSwimNewAthlete(a => ({ ...a, ageGroup: e.target.value }))}
                                    style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 10px", color:"#e8f4fb", fontSize:13, outline:"none", width:"100%" }}>
                                    {["8 & Under","9-10","11-12","13-14","15-18","Open"].map(g => <option key={g} value={g}>{g}</option>)}
                                  </select>
                                </div>
                              </div>
                              <button disabled={!swimNewAthlete.name.trim()} onClick={() => {
                                if (!swimNewAthlete.name.trim()) return;
                                const n = swimNewAthlete.name.trim();
                                const updated = [...swimAthletes, {
                                  id: `swa_${Date.now()}`,
                                  name: n,
                                  firstName: n.split(" ")[0] || "",
                                  lastName: n.split(" ").slice(1).join(" ") || "",
                                  team: swimNewAthlete.team,
                                  age: parseInt(swimNewAthlete.age) || 0,
                                  gender: swimNewAthlete.gender,
                                  ageGroup: swimNewAthlete.ageGroup,
                                  personalBests: {},
                                  timeHistory: []
                                }];
                                persistSwimAthletes(updated);
                                setSwimNewAthlete({ name:"", team:"", age:"", ageGroup:"Open", gender:"Girls" });
                                setSwimAthleteView("list");
                              }} style={{ ...btnStyle("#4ade80"), padding:"9px", fontSize:13, opacity: swimNewAthlete.name.trim() ? 1 : 0.4 }}>
                                Add Swimmer
                              </button>
                            </div>
                          </div>
                        )}

                        {swimAthletes.length === 0 ? (
                          <div style={{ color:"#3a6080", fontSize:13, textAlign:"center", padding:"40px 0" }}>No swimmers yet — add one above.</div>
                        ) : (() => {
                          const teams = [...new Set(swimAthletes.map(a => a.team || "Unassigned"))].sort();
                          return teams.map(team => (
                            <div key={team} style={{ marginBottom:16 }}>
                              <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#48cae4", marginBottom:8 }}>{team}</div>
                              <div style={{ display:"flex", flexDirection:"column", gap:6 }}>
                                {swimAthletes.filter(a => (a.team || "Unassigned") === team).map(ath => {
                                  const pbs = Object.entries(ath.personalBests || {});
                                  const expanded = !!swimExpandedAthletes[ath.id];
                                  return (
                                    <div key={ath.id} style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.1)", borderRadius:8, overflow:"hidden" }}>
                                      <div style={{ padding:"10px 14px", display:"flex", alignItems:"center", justifyContent:"space-between" }}>
                                        <div style={{ flex:1, cursor: pbs.length > 0 ? "pointer" : "default" }}
                                          onClick={() => pbs.length > 0 && setSwimExpandedAthletes(x => ({...x, [ath.id]: !x[ath.id]}))}>
                                          <div style={{ fontSize:14, fontWeight:700, color:"#e8f4fb" }}>{ath.name}</div>
                                          <div style={{ fontSize:11, color:"#5a86a8", marginTop:2 }}>
                                            {ath.gender} · {ath.ageGroup}{ath.age ? ` · age ${ath.age}` : ""}
                                            {pbs.length > 0 && <span style={{ color:"#4ade80", marginLeft:8 }}>▸ {pbs.length} PB{pbs.length > 1 ? "s" : ""}</span>}
                                          </div>
                                        </div>
                                        <button onClick={() => persistSwimAthletes(swimAthletes.filter(a => a.id !== ath.id))}
                                          style={{ background:"none", border:"none", color:"#3a6080", fontSize:18, cursor:"pointer", padding:"0 4px" }}>×</button>
                                      </div>
                                      {expanded && pbs.length > 0 && (
                                        <div style={{ padding:"8px 14px 10px", borderTop:"1px solid rgba(0,174,239,0.08)", background:"rgba(0,174,239,0.03)" }}>
                                          <div style={{ fontSize:10, color:"#48cae4", fontWeight:700, letterSpacing:2, textTransform:"uppercase", marginBottom:6 }}>Personal Bests</div>
                                          {pbs.map(([key, pb]) => {
                                            const parts = key.split("_");
                                            const label = `${parts[0]}y ${parts[1]} (${parts[2]})`;
                                            return (
                                              <div key={key} style={{ display:"flex", gap:8, fontSize:12, padding:"3px 0", borderBottom:"1px solid rgba(0,174,239,0.04)" }}>
                                                <span style={{ flex:1, color:"#b0c8dc" }}>{label}</span>
                                                <span style={{ color:"#4ade80", fontWeight:700 }}>{pb.time}</span>
                                                <span style={{ color:"#3a6080", fontSize:11 }}>{pb.meetName}</span>
                                                <span style={{ color:"#3a6080", fontSize:11 }}>{pb.date}</span>
                                              </div>
                                            );
                                          })}
                                        </div>
                                      )}
                                    </div>
                                  );
                                })}
                              </div>
                            </div>
                          ));
                        })()}
                      </div>
                    )}

                    {/* ── ARCHIVE ── */}
                    {swimView === "archive" && (
                      <div>
                        <div style={{ fontSize:11, color:"#5a86a8", fontWeight:700, letterSpacing:3, textTransform:"uppercase", marginBottom:12 }}>
                          Past Meets ({swimArchive.length})
                        </div>
                        {swimArchive.length === 0 ? (
                          <div style={{ ...S.card, textAlign:"center", color:"#5a86a8" }}>No archived meets yet. Save a meet from Setup or Results.</div>
                        ) : swimArchive.map(entry => (
                          <div key={entry.id} style={S.card}>
                            <div style={{ display:"flex", alignItems:"flex-start", justifyContent:"space-between" }}>
                              <div>
                                <div style={{ fontWeight:700, color:"#e8f4fb", fontSize:14 }}>{entry.meetName || "Unnamed Meet"}</div>
                                <div style={{ fontSize:11, color:"#5a86a8", marginTop:2 }}>
                                  {entry.date} &middot; {entry.pool} &middot; {entry.events.length} event{entry.events.length !== 1 ? "s" : ""}
                                </div>
                              </div>
                              <div style={{ display:"flex", gap:6 }}>
                                <button
                                  onClick={() => {
                                    if (entry.events.length > 0) {
                                      const ev = entry.events[0];
                                      const allSwimmers = ev.heats.flatMap(h => h.lanes.map(sw => ({...sw, heatNum: h.heatNum})));
                                      printSwimResults(ev, entry.meetName, allSwimmers);
                                    }
                                  }}
                                  style={{ fontSize:11, padding:"5px 10px", borderRadius:4, background:"transparent", border:"1px solid rgba(0,174,239,0.3)", color:"#00aeef", cursor:"pointer" }}>
                                  🖨 View
                                </button>
                                <button
                                  onClick={() => {
                                    if (window.confirm(`Delete "${entry.meetName}"?`)) {
                                      const updated = swimArchive.filter(a => a.id !== entry.id);
                                      setSwimArchive(updated);
                                      try { localStorage.setItem("swim-archive", JSON.stringify(updated)); } catch(e) {}
                                      if (currentUser) rtdb.ref("users/"+currentUser.uid+"/swimArchive").set(updated).catch(console.error);
                                    }
                                  }}
                                  style={{ fontSize:11, padding:"5px 10px", borderRadius:4, background:"transparent", border:"1px solid rgba(248,113,113,0.3)", color:"#f87171", cursor:"pointer" }}>
                                  Delete
                                </button>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    )}

                  {/* New meet — save current first */}
                  {swimConfirmNewMeet && (
                    <div style={{ position:"fixed", inset:0, background:"rgba(7,24,41,0.92)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 20px" }}
                      onClick={e => { if (e.target === e.currentTarget) setSwimConfirmNewMeet(false); }}>
                      <div style={{ background:"#0c2240", border:"2px solid #ffd166", borderRadius:12, padding:"24px 20px", width:"100%", maxWidth:420 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:"#e8f4fb", marginBottom:6 }}>Save current meet?</div>
                        <div style={{ fontSize:12, color:"#5a86a8", marginBottom:20 }}>
                          {swimMeet.meetName ? `"${swimMeet.meetName}"` : "This meet"} has unsaved changes. Save it before starting a new one?
                        </div>
                        <div style={{ display:"flex", flexDirection:"column", gap:8 }}>
                          <button onClick={() => { saveCurentMeet(); setSwimConfirmNewMeet(false); setSwimMeet({ meetName:"", pool:"25y", events:[] }); setSwimLiveCode(null); setSwimView("setup"); }}
                            style={{ ...btnStyle("#ffd166"), padding:"11px", fontSize:13 }}>
                            💾 Save &amp; New Meet
                          </button>
                          <button onClick={() => { setSwimConfirmNewMeet(false); setSwimMeet({ meetName:"", pool:"25y", events:[] }); setSwimLiveCode(null); setSwimView("setup"); }}
                            style={{ ...btnStyle("#f87171", true), padding:"11px", fontSize:13 }}>
                            Discard &amp; New Meet
                          </button>
                          <button onClick={() => setSwimConfirmNewMeet(false)}
                            style={{ ...btnStyle("#5a86a8", true), padding:"11px", fontSize:13 }}>
                            Cancel
                          </button>
                        </div>
                      </div>
                    </div>
                  )}

                  {/* Save-before-live prompt */}
                  {swimShowSaveBefore && (
                    <div style={{ position:"fixed", inset:0, background:"rgba(7,24,41,0.92)", zIndex:300, display:"flex", alignItems:"center", justifyContent:"center", padding:"0 20px" }}
                      onClick={e => { if (e.target === e.currentTarget) setSwimShowSaveBefore(false); }}>
                      <div style={{ background:"#0c2240", border:"2px solid #48cae4", borderRadius:12, padding:"24px 20px", width:"100%", maxWidth:420 }}>
                        <div style={{ fontSize:14, fontWeight:700, color:"#e8f4fb", marginBottom:6 }}>Name this meet before starting a live session</div>
                        <div style={{ fontSize:12, color:"#5a86a8", marginBottom:16 }}>The meet code is locked in when you save — it will never change for this meet.</div>
                        <input
                          autoFocus
                          value={swimSaveBeforeName}
                          onChange={e => setSwimSaveBeforeName(e.target.value)}
                          onKeyDown={e => { if (e.key === "Enter" && swimSaveBeforeName.trim()) saveAndStartLiveSession(swimSaveBeforeName); }}
                          placeholder="e.g. Spring Invitational 2026"
                          style={{ width:"100%", background:"#071829", border:"1px solid rgba(72,202,228,0.5)", borderRadius:6, padding:"10px 12px", color:"#e8f4fb", fontSize:14, outline:"none", boxSizing:"border-box", marginBottom:12 }}
                        />
                        <div style={{ display:"flex", gap:8 }}>
                          <button onClick={() => { if (swimSaveBeforeName.trim()) saveAndStartLiveSession(swimSaveBeforeName); }}
                            disabled={!swimSaveBeforeName.trim()}
                            style={{ ...btnStyle("#48cae4"), flex:1, padding:"11px", fontSize:13, opacity: swimSaveBeforeName.trim() ? 1 : 0.4, cursor: swimSaveBeforeName.trim() ? "pointer" : "default" }}>
                            Save &amp; Start Live Session
                          </button>
                          <button onClick={() => setSwimShowSaveBefore(false)} style={{ ...btnStyle("#5a86a8", true), padding:"11px 18px", fontSize:13 }}>Cancel</button>
                        </div>
                      </div>
                    </div>
                  )}

                  </div>
                );
              })()}

            {/* ── LANE TIMER ── */}
            {view === "swimlane" && (() => {
              function joinLaneTimer() {
                const code = swimLaneCode.trim().toUpperCase();
                if (!code) { setSwimLaneError("Enter a meet code."); return; }
                if (!swimLaneNum || swimLaneNum < 1) { setSwimLaneError("Enter a lane number."); return; }
                if (swimLaneListenerRef.current) {
                  swimLaneListenerRef.current.ref.off("value", swimLaneListenerRef.current.fn);
                  swimLaneListenerRef.current = null;
                }
                setSwimLaneError("");
                setSwimLaneSession(null);
                setSwimLaneConnecting(true);
                const ref = rtdb.ref(`swimLive/${code}`);
                const fn = snap => {
                  setSwimLaneConnecting(false);
                  if (!snap.exists()) {
                    setSwimLaneSession(null);
                    setSwimLaneError("Code not found. Check with the host.");
                    return;
                  }
                  setSwimLaneError("");
                  setSwimLaneSession(snap.val());
                };
                const errFn = err => {
                  setSwimLaneConnecting(false);
                  setSwimLaneError("Connection error: " + err.message);
                };
                ref.on("value", fn, errFn);
                swimLaneListenerRef.current = { ref, fn };
                setSwimLaneCode(code);
              }

              const connected = !!swimLaneSession;
              const status = swimLaneSession?.status || "waiting";

              return (
                <div style={{ maxWidth:640, margin:"0 auto", padding:"0 16px 40px" }}>
                  <div style={{ padding:"20px 0 10px", fontSize:20, fontWeight:700, color:"#e8f4fb" }}>🏊 Lane Timer</div>

                  {/* Join form */}
                  {!connected && (
                    <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.2)", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                      <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:8 }}>Join Session</div>
                      <div style={{ display:"flex", gap:8, alignItems:"flex-end", flexWrap:"wrap" }}>
                        <div style={{ flex:2, minWidth:120 }}>
                          <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3 }}>Meet Code</div>
                          <input
                            value={swimLaneCode}
                            onChange={e => setSwimLaneCode(e.target.value.toUpperCase())}
                            onKeyDown={e => e.key === "Enter" && joinLaneTimer()}
                            maxLength={6}
                            placeholder="ABC123"
                            style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 12px", color:"#e8f4fb", fontSize:16, fontFamily:"monospace", letterSpacing:3, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <div style={{ flex:1, minWidth:70 }}>
                          <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3 }}>Lane #</div>
                          <input
                            type="number" min={1} max={10}
                            value={swimLaneNum}
                            onChange={e => setSwimLaneNum(parseInt(e.target.value) || 1)}
                            style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"8px 12px", color:"#e8f4fb", fontSize:16, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <div>
                          <button style={{ ...btnStyle("#00aeef"), padding:"9px 20px", fontSize:13, opacity: swimLaneConnecting ? 0.6 : 1 }} onClick={joinLaneTimer} disabled={swimLaneConnecting}>
                            {swimLaneConnecting ? "Connecting…" : "Join"}
                          </button>
                        </div>
                      </div>
                      {swimLaneError && <div style={{ marginTop:8, fontSize:13, color:"#f87171", fontWeight:600 }}>{swimLaneError}</div>}
                    </div>
                  )}

                  {/* Connected view */}
                  {connected && (() => {
                    const activeEvData = swimLaneSession?.events?.find(e => e.eventNum === swimLaneSession?.activeEvent);
                    const activeHtData = activeEvData?.heats?.find(h => h.heatNum === swimLaneSession?.activeHeat);
                    const mySwimmer = activeHtData?.lanes?.find(l => l.lane === swimLaneNum);
                    const totalHeats = activeEvData?.heats?.length || 0;
                    return (
                    <div>
                      {/* Top bar */}
                      <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:16 }}>
                        <div>
                          <div style={{ fontSize:15, fontWeight:700, color:"#e8f4fb" }}>{swimLaneSession.meetName || "Unnamed Meet"}</div>
                          <div style={{ fontSize:11, color:"#5a86a8", marginTop:1 }}>
                            Code: <span style={{ fontFamily:"monospace", color:"#48cae4", letterSpacing:2 }}>{swimLaneCode}</span>
                          </div>
                        </div>
                        <button style={{ background:"transparent", border:"1px solid rgba(90,134,168,0.4)", borderRadius:6, padding:"6px 14px", fontSize:12, color:"#5a86a8", cursor:"pointer" }} onClick={() => {
                          if (swimLaneListenerRef.current) {
                            swimLaneListenerRef.current.ref.off("value", swimLaneListenerRef.current.fn);
                            swimLaneListenerRef.current = null;
                          }
                          setSwimLaneSession(null);
                          setSwimLaneFinished(false);
                        }}>Leave</button>
                      </div>

                      {/* Lane + event/heat pill row */}
                      <div style={{ display:"flex", gap:8, marginBottom:16, flexWrap:"wrap" }}>
                        <div style={{ background:"rgba(0,174,239,0.15)", border:"1px solid rgba(0,174,239,0.35)", borderRadius:20, padding:"5px 14px", fontSize:13, fontWeight:700, color:"#00aeef" }}>
                          Lane {swimLaneNum}
                        </div>
                        {swimLaneSession.activeEvent && (
                          <div style={{ background:"rgba(90,134,168,0.1)", border:"1px solid rgba(90,134,168,0.25)", borderRadius:20, padding:"5px 14px", fontSize:13, color:"#5a86a8" }}>
                            Event {swimLaneSession.activeEvent}
                            {activeEvData?.eventName ? ` · ${activeEvData.eventName}` : ""}
                          </div>
                        )}
                        {swimLaneSession.activeHeat && (
                          <div style={{ background:"rgba(90,134,168,0.1)", border:"1px solid rgba(90,134,168,0.25)", borderRadius:20, padding:"5px 14px", fontSize:13, color:"#5a86a8" }}>
                            Heat {swimLaneSession.activeHeat}{totalHeats > 1 ? ` of ${totalHeats}` : ""}
                          </div>
                        )}
                      </div>

                      {/* Swimmer card */}
                      <div style={{ background:"#0c2240", border:"1px solid rgba(72,202,228,0.25)", borderRadius:12, padding:"18px 20px", marginBottom:16, minHeight:80 }}>
                        {mySwimmer ? (
                          <div>
                            <div style={{ fontSize:28, fontWeight:700, color:"#e8f4fb", marginBottom:4 }}>{mySwimmer.name || "—"}</div>
                            {mySwimmer.team && <div style={{ fontSize:14, color:"#48cae4" }}>{mySwimmer.team}</div>}
                            {mySwimmer.seedTime && <div style={{ fontSize:12, color:"#5a86a8", marginTop:4 }}>Seed: {formatSwimTime(mySwimmer.seedTime)}</div>}
                          </div>
                        ) : (
                          <div style={{ color:"#3a6080", fontSize:14, paddingTop:8 }}>
                            {swimLaneSession.activeEvent ? "No swimmer assigned to this lane" : "Waiting for host to select event…"}
                          </div>
                        )}
                      </div>

                      {/* Clock */}
                      <div style={{ textAlign:"center", marginBottom:20 }}>
                        <div style={{ fontSize:64, fontWeight:700, letterSpacing:3, color: status === "racing" ? "#00aeef" : "#3a6080", fontVariantNumeric:"tabular-nums", lineHeight:1 }}>
                          {formatSwimTime(status === "racing" ? swimLaneClockMs : (swimLaneFinished && swimLaneSession?.results?.[swimLaneNum] ? swimLaneSession.results[swimLaneNum].finalMs : 0))}
                        </div>
                        <div style={{ fontSize:13, color:"#5a86a8", marginTop:8 }}>
                          {status === "waiting" ? "⏳ Waiting for start…" :
                           status === "racing" && !swimLaneFinished ? "🏁 Race in progress" :
                           swimLaneFinished ? `✓ Recorded — waiting for next heat` :
                           "Heat finished"}
                        </div>
                      </div>

                      {/* STOP button — big phone-friendly */}
                      <button
                        disabled={status !== "racing" || swimLaneFinished}
                        onClick={() => {
                          if (status !== "racing" || swimLaneFinished) return;
                          const finalMs = Date.now() - swimLaneSession.startedAt;
                          rtdb.ref(`swimLive/${swimLaneCode}/results/${swimLaneNum}`).set({ finalMs, dq: false }).catch(console.error);
                          setSwimLaneFinished(true);
                        }}
                        style={{
                          width:"100%", padding:"32px 20px", fontSize:22, fontWeight:900, letterSpacing:3,
                          borderRadius:16, marginBottom:16, userSelect:"none", WebkitUserSelect:"none",
                          cursor: status === "racing" && !swimLaneFinished ? "pointer" : "default",
                          background: swimLaneFinished ? "rgba(0,174,239,0.08)" : status === "racing" ? "rgba(239,68,68,0.18)" : "rgba(90,134,168,0.08)",
                          border: `3px solid ${swimLaneFinished ? "#00aeef" : status === "racing" ? "#ef4444" : "rgba(90,134,168,0.2)"}`,
                          color: swimLaneFinished ? "#00aeef" : status === "racing" ? "#fca5a5" : "#3a6080",
                          boxShadow: status === "racing" && !swimLaneFinished ? "0 0 32px rgba(239,68,68,0.25)" : "none",
                          transition:"all 0.15s"
                        }}>
                        {swimLaneFinished ? "✓ FINISH RECORDED" : status === "racing" ? "⏹ STOP" : "■ STOP"}
                      </button>

                      {/* Clicker configuration */}
                      <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.15)", borderRadius:8, padding:"12px 14px" }}>
                        <div style={{ fontSize:10, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:8 }}>Bluetooth Clicker</div>
                        <div style={{ display:"flex", alignItems:"center", gap:10 }}>
                          <span style={{ fontSize:12, color:"#e8f4fb" }}>Key:</span>
                          <span style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"4px 12px", fontFamily:"monospace", fontSize:14, color:"#00aeef", minWidth:40, textAlign:"center" }}>
