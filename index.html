                            {swimClickerKey === " " ? "Space" : swimClickerKey === "AudioVolumeUp" || swimClickerKey === "VolumeUp" ? "🔊 Vol Up" : swimClickerKey === "AudioVolumeDown" || swimClickerKey === "VolumeDown" ? "🔉 Vol Down" : swimClickerKey}
                          </span>
                          <button
                            style={{ background: swimClickerDetecting ? "#ffd166" : "transparent", border:`2px solid ${swimClickerDetecting ? "#ffd166" : "#48cae4"}`, color: swimClickerDetecting ? "#071829" : "#48cae4", padding:"5px 14px", fontSize:12, borderRadius:4, fontWeight:700, cursor:"pointer" }}
                            onClick={() => {
                              if (swimClickerDetecting) { setSwimClickerDetecting(false); return; }
                              setSwimClickerDetecting(true);
                              const detect = (e) => {
                                e.preventDefault();
                                e.stopPropagation();
                                setSwimClickerKey(e.key);
                                setSwimClickerDetecting(false);
                                window.removeEventListener("keydown", detect, true);
                              };
                              window.addEventListener("keydown", detect, true);
                            }}>
                            {swimClickerDetecting ? "⏳ Press any key…" : "Detect"}
                          </button>
                        </div>
                        <div style={{ marginTop:8, fontSize:11, color:"#5a86a8" }}>
                          ● Connected · Lane {swimLaneNum} · {swimLaneSession.pool || ""}
                        </div>
                      </div>
                    </div>
                  );})()}
                </div>
              );
            })()}

            {/* ── SWIM MEET VIEWER ── */}
            {view === "swimwatch" && (() => {
              function joinSwimWatch() {
                const code = swimWatchCode.trim().toUpperCase();
                if (!code) return;
                if (swimWatchListenerRef.current) {
                  swimWatchListenerRef.current.ref.off("value", swimWatchListenerRef.current.fn);
                }
                setSwimWatchError("");
                setSwimWatchSession(null);
                const ref = rtdb.ref(`swimLive/${code}`);
                const fn = snap => {
                  if (!snap.exists()) { setSwimWatchError("Meet not found. Check the code with your host."); setSwimWatchSession(null); return; }
                  setSwimWatchError("");
                  setSwimWatchSession(snap.val());
                };
                ref.on("value", fn);
                swimWatchListenerRef.current = { ref, fn };
              }

              const session = swimWatchSession;
              const connected = !!session;
              const status = session?.status || "waiting";

              // Build sorted swimmer list from events for the "cheer on" picker
              const allSwimmers = connected && session.events
                ? session.events.flatMap(ev => ev.heats.flatMap(ht => ht.lanes.filter(s => s.name).map(s => ({ name: s.name, team: s.team||"", ev: ev.eventNum, ht: ht.heatNum, lane: s.lane, gender: ev.gender, distance: ev.distance, stroke: ev.stroke }))))
                : [];
              const uniqueNames = [...new Set(allSwimmers.map(s => s.name))];

              // Get active heat lane data
              const activeEv = connected && session.events ? session.events.find(e => e.eventNum === session.activeEvent) : null;
              const activeHt = activeEv ? activeEv.heats.find(h => h.heatNum === session.activeHeat) : null;

              return (
                <div style={{ maxWidth:640, margin:"0 auto", padding:"0 16px 40px" }}>
                  <div style={{ padding:"20px 0 10px", fontSize:20, fontWeight:700, color:"#e8f4fb" }}>🏊 Watch Swim Meet</div>

                  {/* Join form */}
                  {!connected && (
                    <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.2)", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                      <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:10 }}>Join a Meet</div>
                      <div style={{ display:"flex", gap:8, alignItems:"flex-end" }}>
                        <div style={{ flex:1 }}>
                          <div style={{ fontSize:10, color:"#5a86a8", marginBottom:3 }}>Meet Code</div>
                          <input
                            value={swimWatchCode}
                            onChange={e => setSwimWatchCode(e.target.value.toUpperCase())}
                            onKeyDown={e => e.key === "Enter" && joinSwimWatch()}
                            maxLength={6}
                            placeholder="ABC123"
                            style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"10px 14px", color:"#e8f4fb", fontSize:18, fontFamily:"monospace", letterSpacing:4, outline:"none", width:"100%", boxSizing:"border-box" }}
                          />
                        </div>
                        <button style={{ padding:"10px 24px", fontWeight:700, fontSize:14, background:"#00aeef", border:"none", borderRadius:4, color:"#071829", cursor:"pointer" }} onClick={joinSwimWatch}>
                          Watch
                        </button>
                      </div>
                      {swimWatchError && <div style={{ marginTop:8, fontSize:12, color:"#f87171" }}>{swimWatchError}</div>}
                    </div>
                  )}

                  {/* Connected view */}
                  {connected && (
                    <div>
                      {/* Meet header */}
                      <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.2)", borderRadius:8, padding:"12px 14px", marginBottom:12, display:"flex", justifyContent:"space-between", alignItems:"center" }}>
                        <div>
                          <div style={{ fontSize:15, fontWeight:700, color:"#e8f4fb" }}>{session.meetName || "Swim Meet"}</div>
                          <div style={{ fontSize:11, color:"#5a86a8", marginTop:2 }}>
                            {session.pool || ""} · Code: <span style={{ fontFamily:"monospace", color:"#48cae4", letterSpacing:2 }}>{swimWatchCode}</span>
                          </div>
                        </div>
                        <div style={{ display:"flex", gap:8, alignItems:"center" }}>
                          <button style={{ background:"transparent", border:"1px solid rgba(0,174,239,0.3)", borderRadius:4, padding:"5px 12px", fontSize:11, color:"#48cae4", cursor:"pointer" }}
                            onClick={() => setSwimWatchChooserOpen(o => !o)}>
                            {swimWatchCheering ? `⭐ ${swimWatchCheering.split(" ")[0]}` : "⭐ Cheer"}
                          </button>
                          <button style={{ background:"transparent", border:"1px solid rgba(90,134,168,0.4)", borderRadius:4, padding:"5px 10px", fontSize:11, color:"#5a86a8", cursor:"pointer" }} onClick={() => {
                            if (swimWatchListenerRef.current) {
                              swimWatchListenerRef.current.ref.off("value", swimWatchListenerRef.current.fn);
                              swimWatchListenerRef.current = null;
                            }
                            setSwimWatchSession(null);
                            setSwimWatchCheering(null);
                          }}>Leave</button>
                        </div>
                      </div>

                      {/* Swimmer chooser */}
                      {swimWatchChooserOpen && (
                        <div style={{ background:"#071829", border:"1px solid rgba(0,174,239,0.3)", borderRadius:8, padding:"12px 14px", marginBottom:12 }}>
                          <div style={{ fontSize:11, fontWeight:700, letterSpacing:2, textTransform:"uppercase", color:"#5a86a8", marginBottom:8 }}>Who are you cheering for?</div>
                          {swimWatchCheering && (
                            <button style={{ ...btnStyle("#f87171", true), fontSize:11, padding:"4px 12px", marginBottom:8 }} onClick={() => { setSwimWatchCheering(null); setSwimWatchChooserOpen(false); }}>
                              ✕ Stop cheering
                            </button>
                          )}
                          <div style={{ display:"flex", flexDirection:"column", gap:4, maxHeight:200, overflowY:"auto" }}>
                            {uniqueNames.map(name => (
                              <button key={name} onClick={() => { setSwimWatchCheering(name); setSwimWatchChooserOpen(false); }}
                                style={{ textAlign:"left", background: swimWatchCheering === name ? "rgba(0,174,239,0.15)" : "transparent", border: swimWatchCheering === name ? "1px solid rgba(0,174,239,0.4)" : "1px solid transparent", borderRadius:4, padding:"7px 10px", color: swimWatchCheering === name ? "#00aeef" : "#e8f4fb", cursor:"pointer", fontSize:13 }}>
                                {swimWatchCheering === name ? "⭐ " : ""}{name}
                              </button>
                            ))}
                            {uniqueNames.length === 0 && <div style={{ fontSize:12, color:"#5a86a8" }}>No swimmer names in this meet yet.</div>}
                          </div>
                        </div>
                      )}

                      {/* Current heat */}
                      {status === "finished" ? (
                        <div style={{ background:"#0c2240", border:"1px solid rgba(72,202,228,0.3)", borderRadius:8, padding:"16px", marginBottom:12, textAlign:"center" }}>
                          <div style={{ fontSize:14, color:"#48cae4", fontWeight:700 }}>🏁 Meet Complete</div>
                        </div>
                      ) : activeHt ? (
                        <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.2)", borderRadius:8, padding:"14px 16px", marginBottom:12 }}>
                          <div style={{ fontSize:11, fontWeight:700, letterSpacing:2, textTransform:"uppercase", color:"#5a86a8", marginBottom:6 }}>
                            Event {session.activeEvent} — {activeEv.gender} {activeEv.ageGroup} {activeEv.distance} {activeEv.stroke}
                          </div>
                          <div style={{ fontSize:12, color:"#48cae4", marginBottom:10 }}>
                            Heat {session.activeHeat} of {activeEv.heats.length}
                          </div>
                          {/* Live clock */}
                          <div style={{ fontSize:44, fontWeight:700, letterSpacing:2, color: status === "racing" ? "#00aeef" : "#3a6080", fontVariantNumeric:"tabular-nums", textAlign:"center", marginBottom:10 }}>
                            {status === "racing" ? formatSwimTime(swimWatchClockMs) : (status === "waiting" ? "⏳ Waiting…" : formatSwimTime(swimWatchClockMs))}
                          </div>
                          {/* Lane results */}
                          {activeHt.lanes.sort((a,b) => a.lane - b.lane).map(sw => {
                            const res = session.results?.[sw.lane];
                            const finalMs = res?.finalMs ?? null;
                            const isCheering = swimWatchCheering && sw.name && sw.name === swimWatchCheering;
                            return (
                              <div key={sw.lane} style={{ display:"flex", alignItems:"center", gap:10, padding:"6px 10px", borderRadius:6, marginBottom:4, background: isCheering ? "rgba(0,174,239,0.1)" : "transparent", border: isCheering ? "1px solid rgba(0,174,239,0.4)" : "1px solid transparent" }}>
                                <span style={{ fontSize:11, color:"#5a86a8", width:46, flexShrink:0 }}>Lane {sw.lane}</span>
                                <span style={{ flex:1, fontSize:13, fontWeight: isCheering ? 700 : 400, color: isCheering ? "#00aeef" : "#e8f4fb" }}>
                                  {isCheering && "⭐ "}{sw.name || "(empty)"}{sw.team ? <span style={{ fontSize:11, color:"#5a86a8", fontWeight:400 }}> · {sw.team}</span> : ""}
                                </span>
                                <span style={{ fontSize:14, fontWeight:700, fontVariantNumeric:"tabular-nums", color: finalMs != null ? "#00aeef" : "#3a6080" }}>
                                  {finalMs != null ? formatSwimTime(finalMs) : (res?.dq ? "DQ" : "--:--.--")}
                                </span>
                              </div>
                            );
                          })}
                        </div>
                      ) : (
                        <div style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.15)", borderRadius:8, padding:"24px", marginBottom:12, textAlign:"center", color:"#5a86a8", fontSize:13 }}>
                          ⏳ Waiting for host to start a heat…
                        </div>
                      )}

                      {/* Completed heats */}
                      {session.heatResults && Object.keys(session.heatResults).length > 0 && (
                        <div style={{ marginTop:16 }}>
                          <div style={{ fontSize:11, fontWeight:700, letterSpacing:3, textTransform:"uppercase", color:"#5a86a8", marginBottom:10 }}>Completed Heats</div>
                          {Object.entries(session.heatResults).sort().map(([key, results]) => {
                            const [evNum, htNum] = key.split("_").map(Number);
                            const ev = session.events?.find(e => e.eventNum === evNum);
                            const ht = ev?.heats.find(h => h.heatNum === htNum);
                            const sorted = Object.entries(results).filter(([,r]) => r.finalMs != null && !r.dq).sort(([,a],[,b]) => a.finalMs - b.finalMs);
                            return (
                              <div key={key} style={{ background:"#0c2240", border:"1px solid rgba(0,174,239,0.15)", borderRadius:8, padding:"10px 14px", marginBottom:8 }}>
                                <div style={{ fontSize:11, color:"#48cae4", fontWeight:700, marginBottom:6 }}>
                                  {ev ? `Event ${evNum} — ${ev.gender} ${ev.ageGroup} ${ev.distance} ${ev.stroke}` : `Event ${evNum}`} · Heat {htNum}
                                </div>
                                {sorted.map(([lane, r], rank) => {
                                  const isCheering = swimWatchCheering && r.name && r.name === swimWatchCheering;
                                  return (
                                    <div key={lane} style={{ display:"flex", alignItems:"center", gap:8, padding:"3px 0", borderRadius:4, background: isCheering ? "rgba(0,174,239,0.08)" : "transparent" }}>
                                      <span style={{ fontSize:11, color:"#5a86a8", width:20 }}>{rank + 1}.</span>
                                      <span style={{ flex:1, fontSize:12, color: isCheering ? "#00aeef" : "#e8f4fb", fontWeight: isCheering ? 700 : 400 }}>
                                        {isCheering && "⭐ "}{r.name || `Lane ${lane}`}{r.team ? <span style={{ fontSize:10, color:"#5a86a8", fontWeight:400 }}> {r.team}</span> : ""}
                                      </span>
                                      <span style={{ fontSize:12, fontVariantNumeric:"tabular-nums", color:"#00aeef", fontWeight:700 }}>{formatSwimTime(r.finalMs)}</span>
                                    </div>
                                  );
                                })}
                                {Object.entries(results).filter(([,r]) => r.dq).map(([lane, r]) => (
                                  <div key={`dq${lane}`} style={{ display:"flex", alignItems:"center", gap:8, padding:"3px 0", opacity:0.5 }}>
                                    <span style={{ fontSize:11, color:"#f87171", width:20 }}>DQ</span>
                                    <span style={{ flex:1, fontSize:12, color:"#e8f4fb" }}>{r.name || `Lane ${lane}`}</span>
                                    <span style={{ fontSize:11, color:"#f87171" }}>Disqualified</span>
                                  </div>
                                ))}
                              </div>
                            );
                          })}
                        </div>
                      )}
                    </div>
                  )}
                </div>
              );
            })()}
          </div>
        );
      }

      ReactDOM.createRoot(document.getElementById("root")).render(<App />);
      const splash = document.getElementById("splash");
      if (splash) { splash.classList.add("hide"); setTimeout(() => splash.remove(), 350); }
    </script>
  </body>
</html>
