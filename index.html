    <script type="text/babel" data-presets="react">
      const { useState, useEffect, useRef, useCallback } = React;

      // Run is the final segment — logging it ends the race for that athlete
      const SEGMENTS   = ["Swim", "T1", "Bike", "T2", "Run"];
      const segColors  = ["#00aeef", "#48cae4", "#ffd166", "#48cae4", "#f4742b"];
      const WP_COLORS  = ["#ffd166","#06d6a0","#00aeef","#f4742b","#a78bfa","#f472b6","#34d399","#fb923c","#60a5fa","#facc15"];
      const DEFAULT_AGE_GROUPS = ["8 & Under", "9-10", "11-12", "13-14", "15+"];
      // LOGO_B64 is defined in the preceding plain <script> tag (keeps Babel fast)

      // ── Formatting helpers ───────────────────────────────────────────────────
      function formatTime(ms) {
        if (ms === null || ms === undefined) return "--:--.-";
        const totalSecs = Math.floor(ms / 1000);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        const tenths = Math.floor((ms % 1000) / 100);
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}.${tenths}`;
      }

      function formatElapsed(ms) {
        if (ms === null || ms === undefined) return "--:--";
        const totalSecs = Math.floor(ms / 1000);
        const mins = Math.floor(totalSecs / 60);
        const secs = totalSecs % 60;
        return `${String(mins).padStart(2, "0")}:${String(secs).padStart(2, "0")}`;
      }

      function parseTimeInput(str) {
        if (!str) return null;
        const match = str.trim().match(/^(\d+):(\d{2})(?:\.(\d))?$/);
        if (!match) return null;
        const mins = parseInt(match[1]);
        const secs = parseInt(match[2]);
        const tenths = match[3] ? parseInt(match[3]) : 0;
        return (mins * 60 + secs) * 1000 + tenths * 100;
      }

      // ── Pace calculators ─────────────────────────────────────────────────────
      function calcSwimPace(ms, dist, unit) {
        if (!ms || !dist || dist <= 0) return null;
        const secsPerHundred = (ms / 1000) / dist * 100;
        const mins = Math.floor(secsPerHundred / 60);
        const secs = Math.floor(secsPerHundred % 60);
        return `${mins}:${String(secs).padStart(2, "0")} /100${unit === "meters" ? "m" : "y"}`;
      }

      function calcBikeMph(ms, dist, unit) {
        if (!ms || !dist || dist <= 0) return null;
        return `${(dist / (ms / 3600000)).toFixed(1)} ${unit === "km" ? "km/h" : "mph"}`;
      }

      function calcRunPace(ms, dist, unit) {
        if (!ms || !dist || dist <= 0) return null;
        const ppu = (ms / 60000) / dist;
        const mins = Math.floor(ppu);
        const secs = Math.floor((ppu - mins) * 60);
        return `${mins}:${String(secs).padStart(2, "0")} /${unit === "km" ? "km" : "mi"}`;
      }

      function calcAge(dob) {
        if (!dob) return null;
        const d = new Date(dob), today = new Date();
        let age = today.getFullYear() - d.getFullYear();
        if (today.getMonth() - d.getMonth() < 0 || (today.getMonth() === d.getMonth() && today.getDate() < d.getDate())) age--;
        return age;
      }

      function placeSuffix(n) {
        if (n === 11 || n === 12 || n === 13) return `${n}th`;
        const s = ["th","st","nd","rd"];
        return `${n}${s[n % 10] || s[0]}`;
      }

      // ── Athlete time helpers ─────────────────────────────────────────────────
      function segmentDuration(athlete, segIndex) {
        const times = athlete.splits;
        if (segIndex === 0) {
          if (times[0] === null || athlete.startOffset === null) return null;
          return times[0] - athlete.startOffset;
        }
        if (times[segIndex] === null || times[segIndex - 1] === null) return null;
        return times[segIndex] - times[segIndex - 1];
      }

      function totalChipTime(athlete) {
        const last = athlete.splits[SEGMENTS.length - 1];
        if (last === null || athlete.startOffset === null) return null;
        return last - athlete.startOffset;
      }

      function gunTime(athlete) {
        const last = athlete.splits[SEGMENTS.length - 1];
        return last !== null ? last : null;
      }

      function freshAthlete(name = "", id = Date.now(), gender = "Male", ageGroup = "9-10", courseId = null) {
        const parts = name.trim().split(" ");
        const firstName = parts[0] || "";
        const lastName = parts.slice(1).join(" ") || "";
        return { id, name: name.trim(), firstName, lastName, gender, ageGroup, courseId, dob: "", raceNumber: null, startOffset: null, splits: Array(SEGMENTS.length).fill(null), started: false, finished: false };
      }
      function athleteName(ath) {
        if (ath.firstName || ath.lastName) return `${ath.firstName || ""} ${ath.lastName || ""}`.trim();
        return ath.name || "";
      }

      function parseSegTime(str) {
        if (!str || !str.trim()) return null;
        const clean = str.trim().replace(/[^0-9:.]/g, "");
        const parts = clean.split(":");
        if (parts.length === 2) {
          const m = parseInt(parts[0], 10);
          const s = parseFloat(parts[1]);
          if (isNaN(m) || isNaN(s)) return null;
          return (m * 60 + s) * 1000;
        }
        if (parts.length === 1) {
          const s = parseFloat(parts[0]);
          return isNaN(s) ? null : s * 1000;
        }
        return null;
      }

      // ── Swim meet helpers ─────────────────────────────────────────────────────
      function formatSwimTime(ms) {
        if (ms == null) return "--:--.--";
        const totalSec = Math.floor(ms / 1000);
        const mins = Math.floor(totalSec / 60);
        const secs = totalSec % 60;
        const hh   = Math.floor((ms % 1000) / 10);
        if (mins > 0) return `${mins}:${String(secs).padStart(2,"0")}.${String(hh).padStart(2,"0")}`;
        return `:${String(secs).padStart(2,"0")}.${String(hh).padStart(2,"0")}`;
      }

      function parseSeedTime(str) {
        if (!str || str === "NT" || str === "") return null;
        const clean = str.trim().replace(/^:/, "0:");
        const m1 = clean.match(/^(\d+):(\d{2})\.(\d{2})$/);
        if (m1) return (parseInt(m1[1])*60 + parseInt(m1[2]))*1000 + parseInt(m1[3])*10;
        const m2 = clean.match(/^(\d{1,2})\.(\d{2})$/);
        if (m2) return parseInt(m2[1])*1000 + parseInt(m2[2])*10;
        return null;
      }

      function genderLabel(g) {
        if (g === "F" || g === "f") return "Girls";
        if (g === "M" || g === "m") return "Boys";
        return "Mixed";
      }

      function ageGroupLabel(min, max) {
        if (max <= 8) return "8 & Under";
        if (min >= 9 && max <= 10) return "9-10";
        if (min >= 11 && max <= 12) return "11-12";
        if (min >= 13 && max <= 14) return "13-14";
        if (min >= 15 && max <= 18) return "15-18";
        return "Open";
      }

      function strokeLabel(s) {
        const map = { "1":"Freestyle","F":"Freestyle","2":"Backstroke","B":"Backstroke",
          "3":"Breaststroke","R":"Breaststroke","4":"Butterfly","Y":"Butterfly",
          "5":"IM","I":"IM","6":"Medley Relay","M":"Medley Relay" };
        return map[s] || s || "Freestyle";
      }

      function courseLabel(c) {
        if (c === "Y" || c === "y") return "25y";
        if (c === "S" || c === "s") return "25m";
        if (c === "M" || c === "m") return "50m";
        return c || "25y";
      }

      function parseHy3(text) {
        const lines = text.split(/\r?\n/);
        let meetName = "";
        const events = {};
        for (const line of lines) {
          if (line.length < 2) continue;
          const rec = line.substring(0, 2);
          if (rec === "A0") {
            meetName = line.substring(2, 32).trim();
          } else if (rec === "B1") {
            const eventNum  = parseInt(line.substring(2, 6).trim(), 10);
            const gender    = line.substring(6, 7);
            const minAge    = parseInt(line.substring(7, 9).trim() || "0", 10);
            const maxAge    = parseInt(line.substring(9, 11).trim() || "99", 10);
            const distance  = parseInt(line.substring(11, 15).trim(), 10);
            const course    = line.substring(15, 16);
            const strokeCode = line.substring(16, 17);
            if (!isNaN(eventNum)) {
              events[eventNum] = {
                eventNum, gender: genderLabel(gender),
                ageGroup: ageGroupLabel(minAge, maxAge),
                distance: isNaN(distance) ? 100 : distance,
                course: courseLabel(course),
                stroke: strokeLabel(strokeCode),
                heats: {}
              };
            }
          } else if (rec === "C1") {
            const lastName  = line.substring(2, 22).trim();
            const firstName = line.substring(22, 37).trim();
            const age       = parseInt(line.substring(38, 40).trim() || "0", 10);
            const team      = line.substring(40, 62).trim();
            const eventNum  = parseInt(line.substring(62, 66).trim(), 10);
            const heatNum   = parseInt(line.substring(66, 68).trim(), 10);
            const lane      = parseInt(line.substring(68, 70).trim(), 10);
            const seedRaw   = line.substring(70, 78).trim();
            const seedMs    = seedRaw ? parseInt(seedRaw, 10) * 10 : null;
            const seedTime  = seedMs ? formatSwimTime(seedMs) : "NT";
            if (!events[eventNum]) continue;
            if (!events[eventNum].heats[heatNum]) events[eventNum].heats[heatNum] = { heatNum, lanes: [] };
            events[eventNum].heats[heatNum].lanes.push({
              lane: isNaN(lane) ? 1 : lane, lastName, firstName,
              name: `${firstName} ${lastName}`.trim(),
              age: isNaN(age) ? 0 : age,
              team, seedTime, seedMs, finalMs: null, dq: false, scratch: false
            });
          }
        }
        return {
          meetName,
          events: Object.values(events).map(ev => ({
            ...ev,
            heats: Object.values(ev.heats).sort((a,b) => a.heatNum - b.heatNum)
          })).sort((a,b) => a.eventNum - b.eventNum)
        };
      }

      function parseSwimCsv(text) {
        const lines = text.split(/\r?\n/).filter(l => l.trim());
        if (lines.length < 2) return { meetName: "Imported Meet", events: [] };
        const headers = lines[0].split(",").map(h => h.trim().toLowerCase());
        const idx = (name) => headers.indexOf(name.toLowerCase());
        const events = {};
        for (let i = 1; i < lines.length; i++) {
          const cols = lines[i].split(",").map(c => c.trim());
          const get = (name) => { const j = idx(name); return j >= 0 ? cols[j] || "" : ""; };
          const eventNum = parseInt(get("eventnum"), 10) || i;
          const heatNum  = parseInt(get("heatnum"), 10) || 1;
          const lane     = parseInt(get("lane"), 10) || 1;
          const seedTimeStr = get("seedtime");
          const seedMs = parseSeedTime(seedTimeStr);
          if (!events[eventNum]) {
            events[eventNum] = {
              eventNum,
              gender: get("gender") || "Mixed",
              ageGroup: get("agegroup") || "Open",
              distance: parseInt(get("distance"), 10) || 100,
              stroke: get("stroke") || "Freestyle",
              course: get("course") || "25y",
              heats: {}
            };
          }
          if (!events[eventNum].heats[heatNum]) events[eventNum].heats[heatNum] = { heatNum, lanes: [] };
          const lastName  = get("lastname");
          const firstName = get("firstname");
          events[eventNum].heats[heatNum].lanes.push({
            lane, lastName, firstName,
            name: `${firstName} ${lastName}`.trim(),
            age: parseInt(get("age"), 10) || 0,
            team: get("team"),
            seedTime: seedMs ? formatSwimTime(seedMs) : (seedTimeStr || "NT"),
            seedMs, finalMs: null, dq: false, scratch: false
          });
        }
        return {
          meetName: "Imported Meet",
          events: Object.values(events).map(ev => ({
            ...ev,
            heats: Object.values(ev.heats).sort((a,b) => a.heatNum - b.heatNum)
          })).sort((a,b) => a.eventNum - b.eventNum)
        };
      }

      function computeTeamScores(events) {
        const scores = {};
        const pts = [6, 4, 3, 2, 1];
        for (const ev of events) {
          const allSwimmers = ev.heats.flatMap(h => h.lanes);
          const finishers = allSwimmers
            .filter(s => s.finalMs != null && !s.dq && !s.scratch)
            .sort((a,b) => a.finalMs - b.finalMs);
          finishers.forEach((s, i) => {
            if (i < pts.length) {
              scores[s.team] = (scores[s.team] || 0) + pts[i];
            }
          });
        }
        return Object.entries(scores).sort((a,b) => b[1] - a[1]);
      }

      function playSwimBeep() {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.type = "sine";
          osc.frequency.value = 880;
          gain.gain.setValueAtTime(0.9, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 1.2);
          osc.start(ctx.currentTime);
          osc.stop(ctx.currentTime + 1.2);
        } catch(e) {}
      }

      function generateSwimCode() {
        return Math.random().toString(36).substring(2, 8).toUpperCase();
      }

      function getLaneOrder(numLanes) {
        const order = [];
        const center = Math.ceil(numLanes / 2);
        order.push(center);
        let left = center - 1, right = center + 1;
        while (order.length < numLanes) {
          if (right <= numLanes) { order.push(right); right++; }
          if (left >= 1 && order.length < numLanes) { order.push(left); left--; }
        }
        return order;
      }

      function autoSeedEvent(event, numLanes) {
        let rawEntries;
        if (event.entries && event.entries.length > 0) {
          rawEntries = event.entries;
        } else {
          rawEntries = event.heats.flatMap(h => h.lanes).filter(l => l.name && l.name.trim());
        }
        if (rawEntries.length === 0) return event.heats;

        const timed = rawEntries.filter(e => e.seedMs != null).sort((a, b) => a.seedMs - b.seedMs);
        const nt = rawEntries.filter(e => e.seedMs == null).sort(() => Math.random() - 0.5);
        const allSorted = [...nt, ...[...timed].reverse()];

        const numHeats = Math.max(1, Math.ceil(allSorted.length / numLanes));
        const laneOrder = getLaneOrder(numLanes);
        const heats = [];

        for (let hi = 0; hi < numHeats; hi++) {
          const chunk = allSorted.slice(hi * numLanes, (hi + 1) * numLanes);
          const sortedChunk = [...chunk].sort((a, b) => (a.seedMs ?? Infinity) - (b.seedMs ?? Infinity));
          const lanes = sortedChunk.map((sw, idx) => ({
            lane: laneOrder[idx],
            name: sw.name || `${sw.firstName||""} ${sw.lastName||""}`.trim(),
            firstName: sw.firstName || (sw.name||"").split(" ")[0] || "",
            lastName: sw.lastName || (sw.name||"").split(" ").slice(1).join(" ") || "",
            team: sw.team || "",
            age: sw.age || 0,
            seedTime: sw.seedMs ? formatSwimTime(sw.seedMs) : "NT",
            seedMs: sw.seedMs || null,
            finalMs: null, dq: false, scratch: false
          })).sort((a, b) => a.lane - b.lane);
          heats.push({ heatNum: hi + 1, lanes });
        }
        return heats;
      }

      function eventKey(ev) {
        return `${ev.distance}_${ev.stroke}_${ev.course||"25y"}`;
      }

      // ── Style helpers ────────────────────────────────────────────────────────
      function btnStyle(color, outline = false) {
        return {
          background: outline ? "transparent" : color,
          border: `2px solid ${color}`,
          color: outline ? color : "#071829",
          padding: "10px 20px",
          borderRadius: 4,
          fontWeight: 700,
          fontSize: 13,
          letterSpacing: 1,
          cursor: "pointer",
        };
      }

      function thStyle(color) {
        return { textAlign: "center", padding: "8px 6px", color, fontWeight: 700, letterSpacing: 1, fontSize: 10, textTransform: "uppercase", whiteSpace: "nowrap" };
      }

      // ── App ──────────────────────────────────────────────────────────────────
      function App() {
        const [view, setView] = useState("home");
        const [raceInitialized, setRaceInitialized] = useState(false); // true once a race is started or loaded; false after clear
        const [homeSection, setHomeSection] = useState(null); // "races" when Existing Race expanded
        const [athletes, setAthletes] = useState([
          { id: 1, name: "Sam",     gender: "Male",   ageGroup: "9-10",  startOffset: null, splits: Array(SEGMENTS.length).fill(null), started: false, finished: false },
          { id: 2, name: "Kai",     gender: "Male",   ageGroup: "9-10",  startOffset: null, splits: Array(SEGMENTS.length).fill(null), started: false, finished: false },

                    .bindTooltip(athName, { permanent: false, direction: "top" })

                    .addTo(map);
                }
              });
            } catch(_) {}
          };
          ref.on("value", fn);
          joinGpsMapListenerRef.current = { ref, fn };
          return () => { ref.off("value", fn); joinGpsMapListenerRef.current = null; };
        }, [joinRace?.code, joinAthIdx, view]);

        // Reset trainer trigger flag when race changes
        useEffect(() => { bikeSegTriggeredRef.current = false; }, [joinRace?.code]);

        // Auto-trigger T2 split when trainer distance reaches the bike target
        useEffect(() => {
          if (!joinRace) return;
          const myAth = joinRace.athletes?.[joinAthIdx];
          const myCourse = (joinRace.courses || []).find(c => c.id === myAth?.courseId) || (joinRace.courses || [])[0];
          const coursebikeType = myCourse?.bikeType || "gps";
          if (coursebikeType === "gps") return;
          if (bikeSegTriggeredRef.current) return;
          const splits = joinLiveData?.athletes?.[joinAthIdx]?.splits || [];
          const bikeStarted = splits[1] != null;
          const bikeEnded = splits[2] != null;
          if (bikeEnded) { bikeSegTriggeredRef.current = true; return; }
          if (!bikeStarted) return;
          const targetMi = parseFloat(myCourse?.bikeMiles) || 0;
          if (targetMi <= 0) return;
          const trainer = btDevices.find(d => d.readings.trainerDistMi != null && d.readings.trainerDistMi >= targetMi);
          if (!trainer) return;
          bikeSegTriggeredRef.current = true;
          triggerSplit(2, () => setJoinNextSeg(n => n + 1));
        }, [btDevices, joinLiveData?.athletes?.[joinAthIdx]?.splits?.join(","), joinRace?.code]);

        function generateRaceCode() {
          return Math.random().toString(36).substring(2, 8).toUpperCase();
        }

        function resolveAgeGroup(dob, groups) {
          if (!dob || !groups || !groups.length) return null;
          const age = calcAge(dob);
          if (age === null) return null;
          return groups.find(g => { const r = parseAgeRange(g); return r && age >= r.min && age <= r.max; }) || null;
        }

        async function _doOpenRegistration(code) {
          const payload = {
            code,
            publishedBy: currentUser.uid,
            publisherName: userProfile?.displayName || userProfile?.firstName || currentUser.email,
            status: "registration",
            raceName: certConfig.eventName || "Timeathon Race",
            courses: courses.map(c => ({ id: c.id, name: c.name, swimYards: c.swimYards, bikeMiles: c.bikeMiles, runMiles: c.runMiles })),
            ageGroups,
            segments: SEGMENTS,
            waypoints: waypoints.filter(wp => wp.lat !== null),
            updatedAt: Date.now(),
            registrations: {}
          };
          try {
            await rtdb.ref("liveRaces/" + code).set(payload);
            setRegistrationCode(code);
            setRegistrationOpen(true);
            setRegAthleteCount(0);
            stopRegListener(); // detach any previous listener before attaching a new one
            const ref = rtdb.ref("liveRaces/" + code + "/registrations");
            const fn = snap => {
              if (!snap.exists()) { setRegAthleteCount(0); return; }
              const regs = snap.val();
              const entries = Object.values(regs);
              setRegAthleteCount(entries.length);
              setAthletes(prev => {
                const existingUids = new Set(prev.map(a => a.uid).filter(Boolean));
                const toAdd = entries.filter(r => !existingUids.has(r.uid)).map(r => ({
                  ...freshAthlete(`${r.firstName} ${r.lastName}`.trim(), r.uid, r.gender, r.ageGroup),
                  uid: r.uid,
                  dob: r.dob || "",
                  courseId: r.courseId || courses[0]?.id || null
                }));
                return toAdd.length > 0 ? [...prev, ...toAdd] : prev;
              });
            };
            ref.on("value", fn, err => console.error("reg listener:", err));
            regListenerRef.current = { ref, fn };
          } catch(e) { console.error("openRegistration:", e); }
        }

        async function openRegistration() {
          if (!currentUser) return;
          if (!loadedRaceId) { setShowSaveBeforeReg(true); return; }
          // Reuse existing code or generate a new one and lock it in
          const code = registrationCode || generateRaceCode();
          if (!registrationCode) {
            // Persist the code into the saved race so it never changes
            persistRaces(savedRaces.map(r => r.id === loadedRaceId ? { ...r, code } : r));
          }
          await _doOpenRegistration(code);
        }

        async function saveAndOpenRegistration(nameVal) {
          if (!currentUser) return;
          const name = nameVal.trim() || `Race ${savedRaces.length + 1}`;
          const code = registrationCode || generateRaceCode();
          const id = Date.now();
          const raceAthletes = athletes.map(a => ({ name: a.name, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender, ageGroup: a.ageGroup, dob: a.dob || "", courseId: a.courseId || null }));
          const entry = { id, name, code, savedAt: new Date().toLocaleDateString(), ageGroups, courses, units, certConfig, waypoints, athletes: raceAthletes };
          persistRaces([...savedRaces, entry]);
          mergeAthletesToLibrary(athletes);
          setLoadedRaceId(id);
          setSaveRaceName("");
          setShowSaveBeforeReg(false);
          await _doOpenRegistration(code);
        }

        async function registerForRace(code, profileData, selectedCourseId) {
          if (!currentUser) { setRegError("You must be logged in to register."); return; }
          setRegWorking(true); setRegError("");
          const uid = currentUser.uid;
          const raceName = regRaceData?.raceName || "Race";
          const hostName = regRaceData?.publisherName || "Unknown";
          const ageGroup = resolveAgeGroup(profileData.dob, regRaceData?.ageGroups || ageGroups) || profileData.ageGroup || (regRaceData?.ageGroups?.[0] ?? ageGroups[0]);
          const registration = {
            uid,
            firstName: profileData.firstName.trim(),
            lastName: profileData.lastName.trim(),
            name: `${profileData.firstName.trim()} ${profileData.lastName.trim()}`.trim(),
            gender: profileData.gender,
            ageGroup,
            dob: profileData.dob || "",
            courseId: selectedCourseId || regRaceData?.courses?.[0]?.id || null,
            joinedAt: Date.now()
          };
          try {
            await rtdb.ref("liveRaces/" + code + "/registrations/" + uid).set(registration);
            const joined = { code, raceName, hostName, joinedAt: Date.now() };
            const updatedJoined = { ...joinedRaces, [code]: joined };
            setJoinedRaces(updatedJoined);
            try { localStorage.setItem("tri-joined-races", JSON.stringify(updatedJoined)); } catch(e) {}
            rtdb.ref("users/" + uid + "/joinedRaces/" + code).set(joined).catch(console.error);
            // Always go to the dashboard — even if race isn't live yet, the Firebase
            // listener will update in real-time when the host publishes/starts.
            const athListSnap = await rtdb.ref("liveRaces/" + code + "/athletes").once("value");
            const currentAths = athListSnap.val() || [];
            let athIdx = currentAths.findIndex(a => a.uid === uid);
            if (athIdx === -1) {
              athIdx = currentAths.length;
              const bibTx = await rtdb.ref("liveRaces/" + code + "/nextBib").transaction(cur => (cur || 0) + 1);
              const raceNumber = bibTx.snapshot.val();
              await rtdb.ref("liveRaces/" + code + "/athletes/" + athIdx).set({
                uid, id: uid, name: registration.name,
                firstName: registration.firstName, lastName: registration.lastName,
                gender: registration.gender, ageGroup,
                dob: registration.dob, courseId: registration.courseId,
                raceNumber,
                splits: Array(SEGMENTS.length).fill(null),
                started: false, finished: false, startOffset: null, joinedAt: registration.joinedAt
              });
            } else {
              await rtdb.ref("liveRaces/" + code + "/athletes/" + athIdx).update({ uid, courseId: registration.courseId });
            }
            const raceSnap = await rtdb.ref("liveRaces/" + code).once("value");
            const raceData = raceSnap.val();
            if (raceData) {
              const segs = raceData.segments || SEGMENTS;
              if (raceData.athletes) {
                raceData.athletes = raceData.athletes.map(ath => ({
                  ...ath, splits: Array.from({ length: segs.length }, (_, i) =>
                    ath.splits?.[i] !== undefined && ath.splits?.[i] !== null ? ath.splits[i] : null)
                }));
              }
              bikeSegTriggeredRef.current = false;
              setJoinRace({ ...raceData, code });
              setJoinAthIdx(athIdx);
              setJoinGpsActive(false);
              setJoinNextSeg(0);
            }
          } catch(e) {
            setRegError("Registration failed. Please try again.");
            console.error("registerForRace:", e);
          }
          setRegWorking(false);
        }

        async function publishLiveRace(codeIn) {
          if (!currentUser) return "Not logged in.";
          const code = codeIn || generateRaceCode();
          stopRegListener();
          setRegistrationOpen(false);
          const payload = {
            code, publishedBy: currentUser.uid,
            publisherName: userProfile?.displayName || userProfile?.firstName || currentUser.email,
            startedAt: Date.now(), clockMs, clockRunning: false, clockStarted: false, status: "live",
            raceName: certConfig.eventName || "Race",
            athletes: athletes.map(a => ({ id: a.id, uid: a.uid || null, name: a.name, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender, ageGroup: a.ageGroup, courseId: a.courseId || null, dob: a.dob || null, raceNumber: a.raceNumber ?? null, started: a.started, finished: a.finished, startOffset: a.startOffset, splits: a.splits })),
            segments: SEGMENTS, updatedAt: Date.now(),
            courses,
            waypoints: waypoints.filter(wp => wp.lat !== null)
          };
          try {
            const timeout = new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 8000));
            await Promise.race([rtdb.ref("liveRaces/" + code).set(payload), timeout]);
            return true;
          } catch(e) {
            console.error("publishLiveRace failed:", e.message);
            if (e.message === "timeout") return "Connection timed out — check your internet.";
            return e.message || "Failed to go live.";
          }
        }

        function updateLiveRace(code) {
          if (!code || !currentUser) return;
          // Multi-path update: only touches explicit paths, never overwrites /athletes/{i}/gps, /trainer, /hr
          const updates = {
            clockMs, clockRunning,
            updatedAt: Date.now(),
            waypoints: waypoints.filter(wp => wp.lat !== null)
          };
          athletes.forEach((ath, i) => {
            updates[`athletes/${i}/id`]          = ath.id;
            updates[`athletes/${i}/uid`]         = ath.uid || null;
            updates[`athletes/${i}/name`]        = ath.name;
            updates[`athletes/${i}/firstName`]   = ath.firstName || "";
            updates[`athletes/${i}/lastName`]    = ath.lastName  || "";
            updates[`athletes/${i}/gender`]      = ath.gender;
            updates[`athletes/${i}/ageGroup`]    = ath.ageGroup;
            updates[`athletes/${i}/courseId`]    = ath.courseId  || null;
            updates[`athletes/${i}/dob`]         = ath.dob       || null;
            updates[`athletes/${i}/raceNumber`]  = ath.raceNumber ?? null;
            updates[`athletes/${i}/started`]     = ath.started;
            updates[`athletes/${i}/finished`]    = ath.finished;
            updates[`athletes/${i}/startOffset`] = ath.startOffset;
            updates[`athletes/${i}/splits`]      = ath.splits;
          });
          rtdb.ref("liveRaces/" + code).update(updates).catch(console.error);
        }

        function watchRace(code) {
          if (!code.trim()) { setLiveRaceError("Enter a race code."); return; }
          setLiveRaceLoading(true); setLiveRaceError("");
          if (liveRaceUnsubRef.current) { liveRaceUnsubRef.current.ref.off("value", liveRaceUnsubRef.current.fn); }
          const ref = rtdb.ref("liveRaces/" + code.trim().toUpperCase());
          const fn = snap => {
            setLiveRaceLoading(false);
            if (!snap.exists()) { setLiveRaceError("No active race found with that code."); setLiveRace(null); }
            else {
              const data = snap.val();
              const segCount = (data.segments || SEGMENTS).length;
              // RTDB strips null from arrays — restore them so split logic works
              if (data.athletes) {
                data.athletes = data.athletes.map(ath => ({
                  ...ath,
                  splits: Array.from({ length: segCount }, (_, i) =>
                    (ath.splits && ath.splits[i] !== undefined && ath.splits[i] !== null) ? ath.splits[i] : null
                  )
                }));
              }
              setLiveRace({ ...data, code: snap.key });
              setLiveRaceError("");
            }
          };
          ref.on("value", fn, () => { setLiveRaceLoading(false); setLiveRaceError("Could not connect. Check the code and try again."); });
          liveRaceUnsubRef.current = { ref, fn };
        }
        function friendlyAuthError(code) {

          return map[code] || "Something went wrong. Please try again.";
        }

        function autoArchiveRace() {
          if (!athletes.some(a => a.finished)) return;
          if (!archiveSessionRef.current) archiveSessionRef.current = `session_${Date.now()}`;
          const sessionId = archiveSessionRef.current;
          const entry = {
            id: sessionId, name: certConfig.eventName || "Race", date: new Date().toLocaleDateString(),
            savedAt: Date.now(), segments: SEGMENTS, courses, units, certConfig,
            athletes: athletes.map(a => ({ id: a.id, name: athleteName(a) || a.name, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender, ageGroup: a.ageGroup, raceNumber: a.raceNumber ?? null, splits: [...a.splits], startOffset: a.startOffset, finished: a.finished, finishMs: totalChipTime(a) })),
            finishedCount: athletes.filter(a => a.finished).length, totalCount: athletes.length,
          };
          const idx = savedArchive.findIndex(r => r.id === sessionId);
          const updated = idx >= 0 ? savedArchive.map((r, i) => i === idx ? entry : r) : [...savedArchive, entry];
          setSavedArchive(updated);
          try { localStorage.setItem("tri-archive", JSON.stringify(updated)); } catch(e) { console.warn("Archive persist failed:", e); }
          if (currentUser) rtdb.ref("users/" + currentUser.uid + "/archive").set(updated).catch(console.error);
        }

        function archiveSegDur(ath, si) {
          const splits = ath.splits || [];
          const prev = si === 0 ? ath.startOffset : splits[si - 1];
          const cur = splits[si];
          if (cur == null || prev == null) return null;
          return cur - prev;
        }

        function archiveAgPlace(allAthletes, ath) {
          const finishers = (allAthletes || []).filter(a => a.finished && a.gender === ath.gender && a.ageGroup === ath.ageGroup).sort((a, b) => (a.finishMs || Infinity) - (b.finishMs || Infinity));
          const idx = finishers.findIndex(a => a.id === ath.id);
          return idx >= 0 ? idx + 1 : null;
        }

          const overallRows = finishers.map((ath, place) => {

r</th><th>Age Grp</th><th>Ag #</th><th>Course</th>${segs.map(s => `<th>${s}</th>`).join("")}<th>Chip</th></tr></thead><tbody>${overallRows}</tbody></table><h2>Age Group Breakdown</h2>${agSections}<script>window.onload=()=>window.print();<\/script></body></html>`);

        function printArchivedCert(race, targetAth) {
          const medalEmoji = ["🥇","🥈","🥉"], medalColors = ["#d4a017","#8a9ba8","#b87333"];

          }).join("");
          const win = window.open("", "_blank");
          win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Certificate</title><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;600;700;800&family=Bebas+Neue&display=swap" rel="stylesheet"><style>*{box-sizing:border-box;margin:0;padding:0;}@page{size:landscape;margin:0;}body{background:#fff;font-family:'DM Sans',Arial,sans-serif;}.cert{width:100vw;height:100vh;page-break-after:always;break-after:page;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;border:5px solid #00aeef;background:linear-gradient(150deg,#f0f8ff 0%,#ffffff 55%,#e8f4fb 100%);padding:28px 50px;position:relative;overflow:hidden;}.bg-logo{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:44%;opacity:.09;pointer-events:none;object-fit:contain;}.logo{height:52px;object-fit:contain;margin-bottom:2px;}.top-rule,.bottom-rule{width:60%;height:2px;background:linear-gradient(90deg,transparent,#00aeef,transparent);}.event{font-size:11px;letter-spacing:3px;text-transform:uppercase;color:#5a86a8;text-align:center;}.org{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#00aeef;text-align:center;margin-top:-4px;}.medal-emoji{font-size:48px;line-height:1;}.place{font-family:'Bebas Neue',sans-serif;font-size:30px;letter-spacing:4px;}.ag-place{font-size:12px;letter-spacing:2px;color:#0d3a6e;font-weight:700;text-align:center;}.name{font-family:'Bebas Neue',sans-serif;font-size:68px;letter-spacing:5px;color:#071829;line-height:1;text-align:center;}.time-row{display:flex;gap:30px;align-items:center;margin:4px 0;}.time-block{text-align:center;}.time-label{font-size:10px;text-transform:uppercase;letter-spacing:2px;color:#5a86a8;font-weight:700;}.time-val{font-family:'Bebas Neue',sans-serif;font-size:38px;letter-spacing:3px;color:#071829;}.segs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center;}.seg{text-align:center;}.seg-name{font-size:9px;text-transform:uppercase;letter-spacing:2px;color:#5a8           win.document.close();
        }

        function printSwimResults(ev, meetName) {
          if (!ev) return;
          const allSwimmers = ev.heats.flatMap(h => h.lanes.map(sw => ({...sw, heatNum: h.heatNum})));
          const finishers = allSwimmers.filter(s => s.finalMs != null && !s.dq && !s.scratch).sort((a,b) => a.finalMs - b.finalMs);
          const dqs = allSwimmers.filter(s => s.dq);
          const pts = [6,4,3,2,1];
          const heatRows = ev.heats.map(ht => {
            const sorted = ht.lanes.slice().sort((a,b) => {
              if (a.finalMs != null && b.finalMs != null) return a.finalMs - b.finalMs;
              if (a.finalMs != null) return -1; return 1;
            });
            const rows = sorted.map(sw => `<tr><td style="text-align:center">${sw.lane}</td><td>${sw.name||''}</td><td style="text-align:center">${sw.age||''}</td><td>${sw.team||''}</td><td>${sw.seedTime||'NT'}</td><td style="font-weight:700;color:${sw.dq?'#c00':sw.finalMs!=null?'#0070c0':'#999'}">${sw.dq?'DQ':sw.scratch?'SCR':sw.finalMs!=null?formatSwimTime(sw.finalMs):'--'}</td></tr>`).join('');
            return `<h4 style="margin:16px 0 6px;color:#333">Heat ${ht.heatNum}</h4><table><thead><tr><th>Ln</th><th>Name</th><th>Age</th><th>Team</th><th>Seed</th><th>Final</th></tr></thead><tbody>${rows}</tbody></table>`;
          }).join('');
          const standingRows = finishers.map((sw, i) => `<tr><td style="text-align:center;font-weight:700">${i+1}</td><td>${sw.name||''}</td><td style="text-align:center">${sw.age||''}</td><td>${sw.team||''}</td><td>${sw.seedTime||'NT'}</td><td style="font-weight:700;color:#0070c0">${formatSwimTime(sw.finalMs)}</td><td style="text-align:center;font-weight:700">${i<pts.length?pts[i]:''}</td></tr>`).join('') +
            dqs.map(sw => `<tr><td style="text-align:center;color:#c00">DQ</td><td colspan="5" style="color:#c00">${sw.name} — ${sw.team}</td><td></td></tr>`).join('');
          const win = window.open("","_blank");
          win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${meetName||'Meet Results'}</title><style>body{font-family:Arial,sans-serif;font-size:12px;color:#111;padding:20px}h1{font-size:16px;margin:0 0 4px}h2{font-size:13px;color:#555;font-weight:400;margin:0 0 16px}h3{font-size:14px;margin:20px 0 6px;border-bottom:2px solid #0070c0;padding-bottom:4px;color:#0070c0}h4{font-size:12px;margin:12px 0 4px;color:#333}table{width:100%;border-collapse:collapse;margin-bottom:8px}th,td{padding:5px 8px;border-bottom:1px solid #ddd;text-align:left}th{background:#f0f0f0;font-weight:700;font-size:11px;text-transform:uppercase;letter-spacing:0.5px}@media print{button{display:none}}</style></head><body><h1>${meetName||'Meet Results'}</h1><h2>${ev.gender} ${ev.ageGroup} ${ev.distance} ${ev.stroke} — ${ev.course}</h2><h3>Heat-by-Heat Results</h3>${heatRows}<h3>Overall Event Standings</h3><table><thead><tr><th>Pl</th><th>Name</th><th>Age</th><th>Team</th><th>Seed</th><th>Final</th><th>Pts</th></tr></thead><tbody>${standingRows}</tbody></table><button onclick="window.print()" style="margin-top:16px;padding:8px 20px;cursor:pointer">Print</button><script>window.onload=()=>{window.print();}<\/script></body></html>`);
          win.document.close();
        }

        function printRibbonLabels(ev, meetName) {

          const placeColors = ["#d4a017","#8a9ba8","#b87333","#555","#555","#555","#555","#555"];
          const labels = finishers.map((sw, i) => `<div class="label"><div class="place" style="color:${placeColors[i]}">${places[i]} Place</div><div class="name">${sw.name||''}</div><div class="detail">${ev.distance} ${ev.stroke} &mdash; ${ev.gender} ${ev.ageGroup}</div><div class="detail">${sw.team||''} &middot; Heat ${sw.heatNum} &middot; Lane ${sw.lane}</div><div class="time">${formatSwimTime(sw.finalMs)}</div></div>`).join('');
          const win = window.open("","_blank");
          win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Ribbon Labels</title><style>*{box-sizing:border-box;margin:0;padding:0}@page{size:landscape;margin:10mm}body{font-family:Arial,sans-serif;background:#fff}.grid{display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(2,auto);gap:8px;padding:4px}.label{border:2px solid #ccc;border-radius:6px;padding:10px 14px;height:90px;display:flex;flex-direction:column;justify-content:center;gap:2px;page-break-inside:avoid}.place{font-size:18px;font-weight:900;letter-spacing:2px;text-transform:uppercase}.name{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.detail{font-size:10px;color:#555;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.time{font-size:13px;font-weight:700;color:#0070c0;margin-top:2px}@media print{button{display:none}}</style></head><body><div class="grid">${labels}</div><button onclick="window.print()" style="display:block;margin:16px auto;padding:8px 20px;cursor:pointer">Print Labels</button><script>window.onload=()=>{window.print();}<\/script></body></html>`);
          win.document.close();
        }

        function startClock() {
          if (!archiveSessionRef.current) archiveSessionRef.current = `session_${Date.now()}`;
          offsetRef.current = 0;
          setClockMs(0);
          setClockRunning(true);
          setClockStarted(true);
          if (raceMode === "simultaneous") {
            setAthletes(a => a.map(ath => ath.started ? ath : { ...ath, startOffset: 0, started: true }));
          }
        }
        function pauseClock()  { setClockRunning(false); }
        function resumeClock() { setClockRunning(true); }
        function resetClock()  { setClockRunning(false); setClockStarted(false); offsetRef.current = 0; setClockMs(0); }

        function resetTimers() {
          archiveSessionRef.current = null;
          setAthletes(a => a.map(ath => ({ ...freshAthlete(ath.name, ath.id), gender: ath.gender || "Male", ageGroup: ath.ageGroup || ageGroups[0] || "9-10", dob: ath.dob || "", courseId: ath.courseId || courses[0]?.id || null })));
          resetClock();
          setResetConfirm(false);
          setEditTarget(null);
          setView("setup");
        }

        function persistRaces(races) {
          setSavedRaces(races);
          localStorage.setItem("tri-saved-races", JSON.stringify(races));
          if (currentUser) rtdb.ref("users/" + currentUser.uid + "/races").set(races).catch(console.error);
        }

        function mergeAthletesToLibrary(raceAthletes) {
          const existingKeys = new Set(savedAthletes.map(a => (athleteName(a) || a.name || "").trim().toLowerCase()));
          const toAdd = [];
          raceAthletes.forEach(a => {
            const fullName = athleteName(a) || a.name || "";
            const key = fullName.trim().toLowerCase();
            if (!key) return;
            if (!existingKeys.has(key)) {
              toAdd.push({ id: Date.now() + Math.random(), name: fullName, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender || "Male", ageGroup: a.ageGroup || ageGroups[0] || "9-10", dob: a.dob || "" });
              existingKeys.add(key);
            }
          });
          if (toAdd.length > 0) persistSavedAthletes([...savedAthletes, ...toAdd]);
        }

        function saveRace() {
          const name = saveRaceName.trim() || `Race ${savedRaces.length + 1}`;
          const id = Date.now();
          const raceAthletes = athletes.map(a => ({ name: a.name, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender, ageGroup: a.ageGroup, dob: a.dob || "", courseId: a.courseId || null }));
          const entry = {
            id, name,
            code: registrationCode || null,
            savedAt: new Date().toLocaleDateString(),
            ageGroups, courses, units,
            certConfig,
            waypoints,
            athletes: raceAthletes,
          };
          persistRaces([...savedRaces, entry]);
          mergeAthletesToLibrary(athletes);
          setLoadedRaceId(id);
          setSaveRaceName("");
        }

        function updateSavedRace() {
          if (!loadedRaceId) return;
          const raceAthletes = athletes.map(a => ({ name: a.name, firstName: a.firstName || "", lastName: a.lastName || "", gender: a.gender, ageGroup: a.ageGroup, dob: a.dob || "", courseId: a.courseId }));
          const updated = savedRaces.map(r => r.id === loadedRaceId
            ? { ...r, ageGroups, courses, units, certConfig, waypoints, athletes: raceAthletes, savedAt: new Date().toLocaleString() }
            : r);
          persistRaces(updated);
          mergeAthletesToLibrary(athletes);
        }
        async function loadRace(race) {
          setLoadedRaceId(race.id);
          if (race.code) setRegistrationCode(race.code); else setRegistrationCode(null);
          setRegistrationOpen(false);
          stopRegListener();
          if (race.units) setUnits(race.units);
          if (race.certConfig) setCertConfig(race.certConfig);
          const loadedWaypoints = (race.waypoints || DEFAULT_WAYPOINTS).map(wp => ({
            ...wp, lat: wp.lat ?? null, lng: wp.lng ?? null
          }));
          setWaypoints(loadedWaypoints);
          // Re-center setup map to first placed waypoint if the map is already open
          const firstPlaced = loadedWaypoints.find(wp => wp.lat !== null);
          if (firstPlaced && setupMapRef.current) {
            setupMapRef.current.setView([firstPlaced.lat, firstPlaced.lng], 15);
          }
          // Clear saved view so map re-centers on next open instead of restoring old position
          if (!firstPlaced) setupMapViewRef.current = null;
          const loadedCourses = race.courses || [{ id: 1, name: "Sprint", swimYards: race.swimYards || 100, bikeMiles: race.bikeMiles || 6, runMiles: race.runMiles || 1.5 }];
          const loadedAgeGroups = race.ageGroups || DEFAULT_AGE_GROUPS;
          setCourses(loadedCourses);
          setAgeGroups(loadedAgeGroups);
          setAthletes(race.athletes.map((a, i) => {
            const base = freshAthlete(a.name, i + 1);
            return {
              ...base,
              firstName: a.firstName !== undefined ? a.firstName : base.firstName,
              lastName: a.lastName !== undefined ? a.lastName : base.lastName,
              name: a.name || base.name,
              gender: a.gender || "Male",
              ageGroup: a.ageGroup || loadedAgeGroups[0] || "9-10",
              dob: a.dob || "",
              courseId: a.courseId || loadedCourses[0].id,
              raceNumber: a.raceNumber ?? null
            };
          }));
          archiveSessionRef.current = null;

        }
        function onDragEnd() { setDragIdx(null); setDragOverIdx(null); }
        function onTouchStartDrag(e, i) {
          touchDragRef.current = { startIdx: i, overIdx: i };
          setDragIdx(i);
        }
        function onTouchMoveDrag(e) {
          if (!touchDragRef.current) return;
          e.preventDefault();
          const touch = e.touches[0];
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (!el) return;
          const row = el.closest('[data-drag-idx]');
          if (row) {
            const idx = parseInt(row.dataset.dragIdx, 10);
            if (!isNaN(idx) && idx !== touchDragRef.current.overIdx) {
              touchDragRef.current.overIdx = idx;
              setDragOverIdx(idx);
            }
          }
        }
        function onTouchEndDrag() {
          if (!touchDragRef.current) return;
          applyDragDrop(touchDragRef.current.startIdx, touchDragRef.current.overIdx);
          touchDragRef.current = null;
          setDragIdx(null); setDragOverIdx(null);
        }

        function applyWpDragDrop(from, to) {
          if (from === to) return;
          setWaypoints(wps => { const arr = [...wps]; const [item] = arr.splice(from, 1); arr.splice(to, 0, item); return arr; });
        }
        function onWpDragStart(e, i) { setWpDragIdx(i); e.dataTransfer.effectAllowed = "move"; }
        function onWpDragOver(e, i) { e.preventDefault(); e.dataTransfer.dropEffect = "move"; if (i !== wpDragOverIdx) setWpDragOverIdx(i); }
        function onWpDrop(e, i) { e.preventDefault(); if (wpDragIdx !== null) applyWpDragDrop(wpDragIdx, i); setWpDragIdx(null); setWpDragOverIdx(null); }
        function onWpDragEnd() { setWpDragIdx(null); setWpDragOverIdx(null); }
        function onWpTouchStart(e, i) { wpTouchDragRef.current = { startIdx: i, overIdx: i }; setWpDragIdx(i); }
        function onWpTouchMove(e) {
          if (!wpTouchDragRef.current) return;
          e.preventDefault();
          const touch = e.touches[0];
          const el = document.elementFromPoint(touch.clientX, touch.clientY);
          if (!el) return;
          const row = el.closest('[data-wp-drag-idx]');
          if (row) {
            const idx = parseInt(row.dataset.wpDragIdx, 10);
            if (!isNaN(idx) && idx !== wpTouchDragRef.current.overIdx) { wpTouchDragRef.current.overIdx = idx; setWpDragOverIdx(idx); }
          }
        }
        function onWpTouchEnd() {
          if (!wpTouchDragRef.current) return;
          applyWpDragDrop(wpTouchDragRef.current.startIdx, wpTouchDragRef.current.overIdx);
          wpTouchDragRef.current = null;
          setWpDragIdx(null); setWpDragOverIdx(null);
        }

        // ── GPS Demo helpers ─────────────────────────────────────────────────────
        function haversineM(lat1, lng1, lat2, lng2) {
          const R = 6371000;
          const dLat = (lat2 - lat1) * Math.PI / 180;
          const dLng = (lng2 - lng1) * Math.PI / 180;
          const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180) * Math.cos(lat2*Math.PI/180) * Math.sin(dLng/2)**2;
          return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        function dropWaypointHere(wpIdx) {
          if (!navigator.geolocation) { alert("Geolocation not supported."); return; }
          navigator.geolocation.getCurrentPosition(pos => {
            setWaypoints(wps => wps.map((wp, i) => i === wpIdx
              ? { ...wp, lat: +pos.coords.latitude.toFixed(6), lng: +pos.coords.longitude.toFixed(6) }
              : wp
            ));
          }, () => alert("Could not get location."), { enableHighAccuracy: true });
        }

        async function joinRaceByCode(codeOverride) {
          const code = (codeOverride || joinCode).trim().toUpperCase();
          if (!code) return;
          setRegError(""); setRegWorking(true);
          const snap = await rtdb.ref("liveRaces/" + code).once("value");
          setRegWorking(false);
          if (!snap.exists()) { setRegError("No active race found with that code."); return; }
          const data = snap.val();
          const segs = data.segments || SEGMENTS;
          if (data.athletes) {
            data.athletes = data.athletes.map(ath => ({
              ...ath,
              splits: Array.from({ length: segs.length }, (_, i) =>
                ath.splits && ath.splits[i] !== undefined && ath.splits[i] !== null ? ath.splits[i] : null
              )
            }));
          }
          if (data.status === "registration" || data.status === "closed") {
            const raceCourses = data.courses || [];
            const raceAgeGroups = data.ageGroups || ageGroups;
            const prefilled = {
              firstName: userProfile?.firstName || "",
              lastName: userProfile?.lastName || "",
              gender: userProfile?.gender || "Male",
              dob: userProfile?.birthday || "",
              ageGroup: resolveAgeGroup(userProfile?.birthday, raceAgeGroups) || raceAgeGroups[0] || ageGroups[0]
            };
            setRegRaceData({ ...data, code });
            setRegProfile(prefilled);
            setRegCourseId(raceCourses[0]?.id ?? null);
            setRegistrationStep("confirm");
            return;
          }
          setJoinRace({ ...data, code: snap.key });
          setJoinAthIdx(null);
          setJoinGpsActive(false);
          setJoinNextSeg(0);
        }

        useEffect(() => {
          if (!joinRace || !currentUser || joinAthIdx !== null) return;
          const myIdx = (joinRace.athletes || []).findIndex(a => a.uid === currentUser.uid);
          if (myIdx >= 0) setJoinAthIdx(myIdx);
        }, [joinRace, currentUser]);

        function startGpsTracking() {
          if (!navigator.geolocation) { setJoinGpsStatus("Geolocation not supported on this device."); return; }
          if (joinAthIdx === null) { setJoinGpsStatus("Select your name first."); return; }
          const allWps = (joinRace.waypoints || waypoints).filter(wp => wp.lat !== null && wp.lng !== null && wp.enabled !== false);
          setJoinGpsActive(true);
          setJoinGpsStatus("Acquiring GPS signal…");
          acquireWakeLock();
          const triggered = new Set();
          let nextWpIdx = 0;
          let prevLat = null, prevLng = null, totalDistMi = 0;
          // Restore cumulative distance from trail length estimate if trail exists
          if (joinGpsTrailRef.current.length > 0) {
            const t = joinGpsTrailRef.current;
            for (let i = 1; i < t.length; i++) totalDistMi += haversineM(t[i-1][0], t[i-1][1], t[i][0], t[i][1]) / 1609.344;
          }
          let raceStartedForMe = !!(joinRace?.athletes?.[joinAthIdx]?.started);
          let firstFix = true;
          gpsWatchRef.current = navigator.geolocation.watchPosition(pos => {
            const { latitude: lat, longitude: lng, heading, speed } = pos.coords;
            if (prevLat !== null) { totalDistMi += haversineM(prevLat, prevLng, lat, lng) / 1609.344; }
            // Center map on first GPS fix
            if (firstFix) {
              firstFix = false;
              try { if (joinLeafletMapRef.current) joinLeafletMapRef.current.setView([lat, lng], 16, { animate: true }); } catch(_) {}
            }
            prevLat = lat; prevLng = lng;
            setJoinGpsPos({ lat, lng, accuracy: pos.coords.accuracy });
            setJoinGpsStatus(`GPS active · accuracy ±${Math.round(pos.coords.accuracy)}m · ${totalDistMi.toFixed(2)} mi`);
            rtdb.ref(`liveRaces/${joinRace.code}/athletes/${joinAthIdx}/gps`)
              .set({ lat, lng, heading, speed, distanceMi: +totalDistMi.toFixed(3), t: Date.now() }).catch(console.error);
            // Trail tracking
            joinGpsTrailRef.current = [...joinGpsTrailRef.current, [lat, lng]];
            setJoinGpsTrail([...joinGpsTrailRef.current]);
            try { localStorage.setItem("tri-gps-trail", JSON.stringify(joinGpsTrailRef.current)); } catch(_) {}
            // Update athlete's own map marker + trail imperatively
            const map = joinLeafletMapRef.current;
            if (map) {
              try {
                const container = map.getContainer && map.getContainer();
                if (container && document.body.contains(container)) {
                  const lpos = [lat, lng];
                  const segCol = segColors[joinCurSegRef.current] || "#4ade80";
                  if (joinAthMarkerRef.current) {
                    joinAthMarkerRef.current.setLatLng(lpos);
                  } else {
                    const myName = joinRace.athletes?.[joinAthIdx]?.name || "You";
                    joinAthMarkerRef.current = L.circleMarker(lpos, { radius: 12, color: segCol, fillColor: segCol, fillOpacity: 0.9, weight: 3 })
                      .bindTooltip(myName, { permanent: true, direction: "top", offset: [0, -14], className: "leaflet-ath-label" })
                      .addTo(map);
                  }
                  if (joinFollowingRef.current) {
                    map.panTo(lpos, { animate: true, duration: 0.3 });
                  }
                  if (raceStartedForMe && joinGpsTrailRef.current.length > 1) {
                    if (joinLeafletTrailRef.current) {
                      joinLeafletTrailRef.current.setLatLngs(joinGpsTrailRef.current);
                    } else {
                      joinLeafletTrailRef.current = L.polyline(joinGpsTrailRef.current, { color: segCol, weight: 3, opacity: 0.85 }).addTo(map);
                    }
                  }
                }
              } catch(_) {}
            }
            allWps.forEach((wp, wi) => {
              if (triggered.has(wi)) return;
              if (haversineM(lat, lng, wp.lat, wp.lng) >= wp.radiusM) return;
              // Skip T2 (bike→run transition) GPS trigger when using a trainer — handled by distance
              if (wp.action === "split" && wp.segIdx === 2) {
                const myAth = joinRace.athletes?.[joinAthIdx];
                const myCourse = (joinRace.courses || []).find(c => c.id === myAth?.courseId) || (joinRace.courses || [])[0];
                if ((myCourse?.bikeType || "gps") !== "gps") return;
              }
              triggered.add(wi);
              if (wp.action === "marker") {
                nextWpIdx = wi + 1;
                setJoinNextSeg(nextWpIdx);
                return;
              }
              rtdb.ref(`liveRaces/${joinRace.code}`).once("value").then(snap => {
                if (!snap.exists()) return;
                const clockMs = snap.val().clockMs || 0;
                const athRef = rtdb.ref(`liveRaces/${joinRace.code}/athletes/${joinAthIdx}`);
                if (wp.action === "start") {
                  athRef.update({ startOffset: clockMs, started: true }).catch(console.error);
                  raceStartedForMe = true;
                } else if (wp.action === "split") {
                  athRef.child(`splits/${wp.segIdx}`).set(clockMs).catch(console.error);
                  if (wp.segIdx === 4) athRef.update({ finished: true }).catch(console.error);
                }
                nextWpIdx = wi + 1;
                setJoinNextSeg(nextWpIdx);
              });
            });
          }, err => setJoinGpsStatus("GPS error: " + err.message),
          { enableHighAccuracy: true, maximumAge: 0, timeout: 10000 });
        }

        function stopGpsTracking() {
          if (gpsWatchRef.current !== null) {
            navigator.geolocation.clearWatch(gpsWatchRef.current);
            gpsWatchRef.current = null;
          }
          setJoinGpsActive(false);
          setJoinGpsStatus("Tracking stopped.");
        }

        async function generateWatchToken() {
          if (!joinRace || joinAthIdx === null) return;
          setWatchTokenLoading(true);
          const token = Math.random().toString(36).slice(2, 6).toUpperCase() +
                        Math.random().toString(36).slice(2, 6).toUpperCase();
          const ath = joinRace.athletes[joinAthIdx];
          const athleteName = ath ? (ath.firstName ? `${ath.firstName} ${ath.lastName || ""}`.trim() : ath.name || "") : "";
          try {
            await rtdb.ref(`watchTokens/${token}`).set({
              raceCode: joinRace.code,
              athIdx: joinAthIdx,
              athleteName,
              expiresAt: Date.now() + 6 * 60 * 60 * 1000
            });
            setWatchToken(token);
          } catch(e) { console.error("Watch token create failed:", e); }
          setWatchTokenLoading(false);
        }

        async function clearWatchToken() {
          if (!watchToken) return;
          try { await rtdb.ref(`watchTokens/${watchToken}`).remove(); } catch(_) {}
          setWatchToken(null);
          setWatchConnected(false);
        }

        // ── Programmatic split trigger (used by trainer distance auto-complete) ─
        async function triggerSplit(segIdx, onDone) {
          const code = joinRaceCodeRef.current;
          const idx = joinAthIdxRef.current;
          if (code === null || idx === null) return;
          try {
            const snap = await rtdb.ref(`liveRaces/${code}`).once("value");
            if (!snap.exists()) return;
            const clockMs = snap.val().clockMs || 0;
            await rtdb.ref(`liveRaces/${code}/athletes/${idx}/splits/${segIdx}`).set(clockMs);
            if (segIdx === 4) await rtdb.ref(`liveRaces/${code}/athletes/${idx}`).update({ finished: true });
          } catch(e) { console.error("triggerSplit failed:", e); }
          if (onDone) onDone();
        }

        // ── Wake Lock helper ─────────────────────────────────────────────────
        async function acquireWakeLock() {
          if (!navigator.wakeLock) return;
          try {
            if (wakeLockRef.current) return;
            wakeLockRef.current = await navigator.wakeLock.request('screen');
            wakeLockRef.current.addEventListener('release', () => { wakeLockRef.current = null; });
          } catch(_) {}
        }

        // ── Watch trail clear helper ──────────────────────────────────────────
        function clearWatchTrails(raceCode) {
          Object.values(leafletTrailsRef.current).forEach(p => { try { p.remove(); } catch(_) {} });
          leafletTrailsRef.current = {};
          leafletTrailPointsRef.current = {};
          if (raceCode) { try { localStorage.removeItem(`tri-watch-trails-${raceCode}`); } catch(_) {} }
        }

        // ── BLE / Bluetooth helpers ──────────────────────────────────────────

        function parseHeartRate(dv) {
          const flags = dv.getUint8(0);
          return { heartRate: (flags & 0x01) ? dv.getUint16(1, true) : dv.getUint8(1) };
        }

        function parseCscMeasurement(dv, prevCsc, wheelCircM = 2.1) {
          const flags = dv.getUint8(0);
          const hasWheel = flags & 0x01;
          const hasCrank = flags & 0x02;
          let offset = 1;
          let speed = null, cadence = null;
          let cumWheelRevs, lastWheelEvt, cumCrankRevs, lastCrankEvt;

          if (hasWheel && dv.byteLength >= offset + 6) {
            cumWheelRevs = dv.getUint32(offset, true);
            lastWheelEvt = dv.getUint16(offset + 4, true);
            offset += 6;
            if (prevCsc && prevCsc.cumWheelRevs !== undefined) {
              const dRevs = (cumWheelRevs - prevCsc.cumWheelRevs + 0x100000000) % 0x100000000;
              const dTime = ((lastWheelEvt - prevCsc.lastWheelEvt + 0x10000) % 0x10000) / 1024;
              if (dTime > 0) speed = (dRevs * wheelCircM) / dTime;
            }
          }

          if (hasCrank && dv.byteLength >= offset + 4) {
            cumCrankRevs = dv.getUint16(offset, true);
            lastCrankEvt = dv.getUint16(offset + 2, true);
            if (prevCsc && prevCsc.cumCrankRevs !== undefined) {
              const dRevs = (cumCrankRevs - prevCsc.cumCrankRevs + 0x10000) % 0x10000;
              const dTime = ((lastCrankEvt - prevCsc.lastCrankEvt + 0x10000) % 0x10000) / 1024;
              if (dTime > 0) cadence = Math.round((dRevs / dTime) * 60);
            }
          }

          return {
            speed, cadence,
            cumWheelRevs: cumWheelRevs !== undefined ? cumWheelRevs : prevCsc?.cumWheelRevs,
            lastWheelEvt: lastWheelEvt !== undefined ? lastWheelEvt : prevCsc?.lastWheelEvt,
            cumCrankRevs: cumCrankRevs !== undefined ? cumCrankRevs : prevCsc?.cumCrankRevs,
            lastCrankEvt: lastCrankEvt !== undefined ? lastCrankEvt : prevCsc?.lastCrankEvt,
          };
        }

        function parseCyclingPower(dv) {
          return { power: dv.getInt16(2, true) };
        }

        function parseRscMeasurement(dv) {
          return { speed: dv.getUint16(1, true) / 256, cadence: dv.getUint8(3) };
        }

        // FTMS Indoor Bike Data (0x2AD2) — used by Wahoo KICKR, Tacx, etc.
        function parseFtmsIndoorBike(dv) {
          if (dv.byteLength < 2) return {};
          const flags = dv.getUint16(0, true);
          let offset = 2;
          let speed = null, cadence = null, distanceM = null, power = null;
          // Bit 0 = "More Data" flag; when 0, instantaneous speed is present
          if (!(flags & 0x0001)) {
            if (dv.byteLength >= offset + 2) { speed = dv.getUint16(offset, true) / 100 / 3.6; offset += 2; } // km/h → m/s
          }
          if (flags & 0x0002) offset += 2; // avg speed
          if (flags & 0x0004) {
            if (dv.byteLength >= offset + 2) { cadence = dv.getUint16(offset, true) / 2; offset += 2; } // 0.5rpm res
          }
          if (flags & 0x0008) offset += 2; // avg cadence
          if (flags & 0x0010) {
            if (dv.byteLength >= offset + 3) {
              distanceM = dv.getUint8(offset) | (dv.getUint8(offset+1) << 8) | (dv.getUint8(offset+2) << 16);
              offset += 3;
            }
          }
          if (flags & 0x0020) offset += 2; // resistance
          if (flags & 0x0040) {
            if (dv.byteLength >= offset + 2) { power = dv.getInt16(offset, true); offset += 2; }
          }
          return { speed, cadence, distanceM, power };
        }

        async function connectBleDevice(device) {
          const gattServer = await device.gatt.connect();
          const deviceId = device.id;
          btCharacteristicsRef.current[deviceId] = {};

          const services = [
            {
              uuid: "0000180d-0000-1000-8000-00805f9b34fb",
              chars: [{ uuid: "00002a37-0000-1000-8000-00805f9b34fb", key: "hr", parser: (dv) => parseHeartRate(dv) }],
            },
            {
              uuid: "00001816-0000-1000-8000-00805f9b34fb",
              chars: [{ uuid: "00002a5b-0000-1000-8000-00805f9b34fb", key: "csc", parser: (dv, dev) => parseCscMeasurement(dv, dev.readings.cscRaw) }],
            },
            {
              uuid: "00001818-0000-1000-8000-00805f9b34fb",
              chars: [{ uuid: "00002a63-0000-1000-8000-00805f9b34fb", key: "power", parser: (dv) => parseCyclingPower(dv) }],
            },
            {
              uuid: "00001814-0000-1000-8000-00805f9b34fb",
              chars: [{ uuid: "00002a53-0000-1000-8000-00805f9b34fb", key: "rsc", parser: (dv) => parseRscMeasurement(dv) }],
            },
            {
              // FTMS — Fitness Machine Service (Wahoo KICKR, Tacx, most smart trainers)
              uuid: "00001826-0000-1000-8000-00805f9b34fb",
              chars: [{ uuid: "00002ad2-0000-1000-8000-00805f9b34fb", key: "ftms", parser: (dv) => parseFtmsIndoorBike(dv) }],
            },
          ];

          for (const svc of services) {
            let service;
            try { service = await gattServer.getPrimaryService(svc.uuid); } catch (_) { continue; }
            for (const { uuid, key, parser } of svc.chars) {
              let char;
              try { char = await service.getCharacteristic(uuid); } catch (_) { continue; }
              btCharacteristicsRef.current[deviceId][uuid] = char;
              await char.startNotifications();
              char.addEventListener("characteristicvaluechanged", e => {
                setBtDevices(prev => prev.map(d => {
                  if (d.id !== deviceId) return d;
                  const parsed = parser(e.target.value, d);
                  const r = { ...d.readings };
                  if (key === "csc") {
                    r.cscRaw = { ...parsed };
                    if (parsed.speed !== null && parsed.speed !== undefined) r.speed = +(parsed.speed * 3.6).toFixed(1);
                    if (parsed.cadence !== null && parsed.cadence !== undefined) r.cadence = parsed.cadence;
                    if (parsed.cumWheelRevs != null) {
                      const base = d.trainerBaseRevs ?? parsed.cumWheelRevs;
                      r.trainerDistMi = +Math.max(0, (parsed.cumWheelRevs - base) * 2.1 / 1609.344).toFixed(3);
                      const code = joinRaceCodeRef.current ?? hostRaceCodeRef.current, idx = joinAthIdxRef.current ?? hostAthIdxRef.current;
                      if (code !== null && idx !== null) {
                        rtdb.ref(`liveRaces/${code}/athletes/${idx}/trainer`)
                          .set({ distMi: r.trainerDistMi, speed: r.speed ?? null, cadence: r.cadence ?? null, power: r.power ?? null, t: Date.now() }).catch(console.error);
                      }
                      return { ...d, readings: r, trainerBaseRevs: base };
                    }
                    // No wheel revs — still push speed/cadence so trainer signal stays alive
                    if (r.speed != null || r.cadence != null) {
                      const code = joinRaceCodeRef.current ?? hostRaceCodeRef.current, idx = joinAthIdxRef.current ?? hostAthIdxRef.current;
                      if (code !== null && idx !== null) {
                        rtdb.ref(`liveRaces/${code}/athletes/${idx}/trainer`)
                          .set({ distMi: r.trainerDistMi ?? null, speed: r.speed ?? null, cadence: r.cadence ?? null, power: r.power ?? null, t: Date.now() }).catch(console.error);
                      }
                    }
                  } else if (key === "hr") {
                    r.heartRate = parsed.heartRate;
                    const code = joinRaceCodeRef.current ?? hostRaceCodeRef.current, idx = joinAthIdxRef.current ?? hostAthIdxRef.current;
                    if (code !== null && idx !== null) {
                      rtdb.ref(`liveRaces/${code}/athletes/${idx}/hr`)
                        .set({ bpm: parsed.heartRate, t: Date.now() }).catch(console.error);
                    }
                    return { ...d, readings: r, hrHistory: [...(d.hrHistory || []), { t: Date.now(), bpm: parsed.heartRate }].slice(-7200) };
                  } else if (key === "power") {
                    r.power = parsed.power;
                    const code = joinRaceCodeRef.current ?? hostRaceCodeRef.current, idx = joinAthIdxRef.current ?? hostAthIdxRef.current;
                    if (code !== null && idx !== null) {
                      rtdb.ref(`liveRaces/${code}/athletes/${idx}/trainer`)
                        .set({ distMi: r.trainerDistMi ?? null, speed: r.speed ?? null, cadence: r.cadence ?? null, power: r.power ?? null, t: Date.now() }).catch(console.error);
                    }
                  } else if (key === "rsc") {
                    r.speed = +(parsed.speed * 3.6).toFixed(1);
                    r.cadence = parsed.cadence;
                  } else if (key === "ftms") {
                    if (parsed.speed != null) r.speed = +(parsed.speed * 3.6).toFixed(1);
                    if (parsed.cadence != null) r.cadence = +parsed.cadence.toFixed(0);
                    if (parsed.power != null) r.power = parsed.power;
                    let baseM = d.trainerBaseDistM;
                    if (parsed.distanceM != null) {
                      r.ftmsDistM = parsed.distanceM;
                      baseM = d.trainerBaseDistM ?? parsed.distanceM;
                      r.trainerDistMi = +Math.max(0, (parsed.distanceM - baseM) / 1609.344).toFixed(3);
                    }
                    // Push on every FTMS notification — speed/cadence alone is enough to keep trainer signal alive
                    const code = joinRaceCodeRef.current ?? hostRaceCodeRef.current, idx = joinAthIdxRef.current ?? hostAthIdxRef.current;
                    if (code !== null && idx !== null) {
                      rtdb.ref(`liveRaces/${code}/athletes/${idx}/trainer`)
                        .set({ distMi: r.trainerDistMi ?? null, speed: r.speed ?? null, cadence: r.cadence ?? null, power: r.power ?? null, t: Date.now() }).catch(console.error);
                    }
                    return { ...d, readings: r, trainerBaseDistM: baseM };
                  }
                  return { ...d, readings: r };
                }));
              });
            }
          }

          device.addEventListener("gattserverdisconnected", () => {
            setBtDevices(prev => prev.map(d => d.id === deviceId ? { ...d, connected: false, gattServer: null } : d));
          });

          setBtDevices(prev => prev.map(d => d.id === deviceId ? { ...d, gattServer, connected: true } : d));
          acquireWakeLock();
        }

        async function scanBluetooth() {
          if (!btSupported) return;
          setBtScanning(true);
          try {
            const device = await navigator.bluetooth.requestDevice({
              filters: [
                { services: ["heart_rate"] },
                { services: ["cycling_speed_and_cadence"] },
                { services: ["cycling_power"] },
                { services: ["running_speed_and_cadence"] },
                { services: ["fitness_machine"] },
              ],
              optionalServices: ["heart_rate", "cycling_speed_and_cadence", "cycling_power", "running_speed_and_cadence", "fitness_machine"],
            });
            setBtDevices(prev => prev.some(d => d.id === device.id) ? prev
              : [...prev, { id: device.id, name: device.name || "Unknown Device", device, gattServer: null, connected: false, readings: {}, hrHistory: [], trainerBaseRevs: null, trainerBaseDistM: null }]);
            await connectBleDevice(device);
          } catch (err) {
            if (err.name !== "NotFoundError") console.error("BLE scan error:", err);
          } finally {
            setBtScanning(false);
          }
        }

        function disconnectBleDevice(deviceId) {
          const chars = btCharacteristicsRef.current[deviceId] || {};
          for (const char of Object.values(chars)) {
            try { char.stopNotifications(); } catch (_) {}
          }
          delete btCharacteristicsRef.current[deviceId];
          setBtDevices(prev => {
            const dev = prev.find(d => d.id === deviceId);
            if (dev?.gattServer?.connected) {
              try { dev.device.gatt.disconnect(); } catch (_) {}
            }
            return prev.filter(d => d.id !== deviceId);
          });
        }

        function goToRace() {
          setAthletes(a => a.map((ath, i) => ({ ...ath, name: ath.name || `Athlete ${i + 1}` })));
          setView("race");
        }

        function sendOff(athleteIdx) {
          setAthletes(a => a.map((ath, i) => i === athleteIdx ? { ...ath, startOffset: clockMs, started: true } : ath));
        }

        function sendOffAll() {
          const offset = clockStarted ? clockMs : 0;
          if (!clockStarted) {
            offsetRef.current = 0;
            setClockMs(0);
            setClockRunning(true);
            setClockStarted(true);
          }
          setAthletes(a => a.map(ath => ath.started ? ath : { ...ath, startOffset: offset, started: true }));
        }

        function logSplit(athleteIdx, segIndex) {
          setAthletes(a => a.map((ath, i) => {
            if (i !== athleteIdx) return ath;
            const newSplits = [...ath.splits];
            newSplits[segIndex] = clockMs;
            const finished = segIndex === SEGMENTS.length - 1;
            return { ...ath, splits: newSplits, finished };
          }));
        }

        function nextUnloggedSeg(athlete) {
          return athlete.splits.findIndex(s => s === null);
        }

        function openEdit(athleteIdx) {
          if (editTarget === athleteIdx) { setEditTarget(null); return; }
          const ath = athletes[athleteIdx];
          const vals = {};
          if (ath.startOffset !== null) vals["start"] = formatTime(ath.startOffset);
          ath.splits.forEach((s, si) => { if (s !== null) vals[si] = formatTime(s); });
          setEditValues(vals);
          setEditTarget(athleteIdx);
        }

        function saveEdits(athleteIdx) {
          setAthletes(a => a.map((ath, i) => {
            if (i !== athleteIdx) return ath;
            let newStart = ath.startOffset;
            if (editValues["start"] !== undefined) {
              const ms = parseTimeInput(editValues["start"]);
              if (ms !== null) newStart = ms;

            const newSplits = [...ath.splits];
            SEGMENTS.forEach((_, si) => {
              if (editValues[si] !== undefined) {

                if (ms !== null) newSplits[si] = ms;

            return { ...ath, startOffset: newStart, splits: newSplits, finished: newSplits[SEGMENTS.length - 1] !== null };

        function exportCSV() {
          const headers = ["Place","Bib","Athlete","Gender","Age Group","Ag Place","Course",...SEGMENTS.map(s => s+" Time"),"Chip Time","Gun Time","Swim Pace (/100y)","Bike Speed (mph)","Run Pace (/mi)"];
          const rows = sorted.map((ath, place) => {
            const chip = totalChipTime(ath);
            const gt   = gunTime(ath);
            const swimMs = segmentDuration(ath, 0);
            const bikeMs = segmentDuration(ath, 2);
            const runMs  = segmentDuration(ath, 4);
            const agp = ageGroupPlace(ath);
            const ac = athleteCourse(ath);
            return [
              place + 1, ath.raceNumber != null ? ath.raceNumber : "", ath.name, ath.gender, ath.ageGroup, agp !== null ? agp : "", ac.name,
              ...SEGMENTS.map((_, si) => { const d = segmentDuration(ath, si); return d !== null ? formatElapsed(d) : ""; }),
              chip !== null ? formatElapsed(chip) : "",
              gt   !== null ? formatElapsed(gt)   : "",
              calcSwimPace(swimMs, ac.swimYards, units.swim) ?? "",
              calcBikeMph(bikeMs, ac.bikeMiles, units.bike)  ?? "",
              calcRunPace(runMs, ac.runMiles, units.run)   ?? "",
            ];
          });
          const csv = [headers, ...rows].map(r => r.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\r\n");
          const a = Object.assign(document.createElement("a"), {
            href: URL.createObjectURL(new Blob([csv], { type: "text/csv;charset=utf-8;" })),
            download: "timeathon-results.csv",
          });
          document.body.appendChild(a); a.click(); document.body.removeChild(a);

                                <button onClick={() => printArchivedCert(resultsRace, null)} style={{ ...btnStyle("#ffd166", true), padding: "5px 10px", fontSize: 11 }}>🏆 All Certs</button>
